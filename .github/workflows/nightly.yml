name: nightly
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  nightly:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip if main hasn't changed
        id: changed
        shell: bash
        run: |
          last=$(git ls-remote origin refs/tags/nightly | cut -f1)
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ "$last" = "$GITHUB_SHA" ] && [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Read version
        if: steps.changed.outputs.skip != 'true'
        id: version
        shell: bash
        run: echo "name=$(tr -d '[:space:]' < VERSION)-nightly.$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: steps.changed.outputs.skip != 'true'
        with:
          path: .fo-git/spriggit-cli
          key: spriggit-${{ hashFiles('fo-git.json') }}
      - name: Validate Spriggit text
        if: steps.changed.outputs.skip != 'true'
        run: Tools/fo-git.exe validate --text
      - name: Build ESM
        if: steps.changed.outputs.skip != 'true'
        run: Tools/fo-git.exe build-esm
      - name: Validate ESM
        if: steps.changed.outputs.skip != 'true'
        run: Tools/fo-git.exe validate --esm --round-trip
      - name: Get BSArch
        if: steps.changed.outputs.skip != 'true'
        run: |
          curl.exe -sSL -o "$env:RUNNER_TEMP\xEdit.7z" https://github.com/TES5Edit/TES5Edit/releases/download/xedit-4.1.5f/xEdit.4.1.5f.7z
          7z e -y "-o$env:RUNNER_TEMP" "$env:RUNNER_TEMP\xEdit.7z" BSArch64.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack BSA
        if: steps.changed.outputs.skip != 'true'
        run: |
          $bsa = "$env:RUNNER_TEMP\bsa"
          $out = "$env:RUNNER_TEMP\release"
          New-Item -ItemType Directory $bsa, $out | Out-Null
          foreach ($f in "Meshes", "Sound", "Textures") {
            Copy-Item $f $bsa -Recurse
          }
          # Loose assets
          Remove-Item "$bsa\Textures\Interface\WorldMap" -Recurse
          Remove-Item "$bsa\Sound\Songs" -Recurse
          & "$env:RUNNER_TEMP\BSArch64.exe" pack $bsa "$out\NovaArizona - Main.bsa" -fnv -mt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Zip
        if: steps.changed.outputs.skip != 'true'
        run: |
          $out = "$env:RUNNER_TEMP\release"
          $skip = "Meshes", "Sound", "Textures", "Plugins", "Tools", "README.md", "fo-git.json", "VERSION"
          Get-ChildItem -Force | Where-Object { $_.Name -notin $skip -and -not $_.Name.StartsWith(".") } | Copy-Item -Destination $out -Recurse
          New-Item -ItemType Directory "$out\Textures\Interface", "$out\Sound" | Out-Null
          Copy-Item Textures\Interface\WorldMap "$out\Textures\Interface" -Recurse
          Copy-Item Sound\Songs "$out\Sound" -Recurse
          7z a -tzip "$env:RUNNER_TEMP\NovaArizona-${{ steps.version.outputs.name }}.zip" "$out\*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Write changelog
        if: steps.changed.outputs.skip != 'true'
        shell: bash
        env:
          LAST: ${{ steps.changed.outputs.last }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          echo "Built from $GITHUB_SHA." > "$notes"
          echo >> "$notes"
          if [ -n "$LAST" ] && [ "$LAST" != "$GITHUB_SHA" ]; then
            echo "## Changelog" >> "$notes"
            echo >> "$notes"
            # Merge commits left out
            gh api "repos/$GITHUB_REPOSITORY/compare/$LAST...$GITHUB_SHA" \
              --jq '.commits[] | select(.parents | length == 1) | "- \(.commit.message | split("\n")[0]) (\(.sha[0:7]))"' >> "$notes"
          fi
      - name: Publish nightly release
        if: steps.changed.outputs.skip != 'true'
        shell: bash
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly "$RUNNER_TEMP/NovaArizona-${{ steps.version.outputs.name }}.zip" --prerelease --target "$GITHUB_SHA" \
            --title "Nova Arizona ${{ steps.version.outputs.name }}" --notes-file "$RUNNER_TEMP/notes.md"
