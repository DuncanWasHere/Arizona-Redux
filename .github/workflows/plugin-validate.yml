name: plugin-validate
on:
  pull_request:
    paths: ["Plugins/**", "fo-git.json", "Tools/fo-git.exe"]
  push:
    branches: [main]
    paths: ["Plugins/**", "fo-git.json", "Tools/fo-git.exe"]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Plugins
            Tools
            fo-git.json
            .gitattributes
          sparse-checkout-cone-mode: false
      - uses: actions/cache@v4
        with:
          path: .fo-git/spriggit-cli
          key: spriggit-${{ hashFiles('fo-git.json') }}
      - name: Validate the Spriggit text
        run: Tools/fo-git.exe validate --text
      - name: Build the ESM
        run: Tools/fo-git.exe build-esm
      - name: Validate the ESM
        run: Tools/fo-git.exe validate --esm --round-trip
