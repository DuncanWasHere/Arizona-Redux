  CompiledScript: 
  SourceCode: >-
    name AZRadioQuietZoneQuestScript;


    int bPlayerInQuietZone;

    array aGameRadios;

    array aActiveRadios;


    GameMode {
        if (!bPlayerInQuietZone) {
            if (IsPlayerInRegion(AZRadioQuietZoneRegion)) {
                bPlayerInQuietZone = 1;

                aGameRadios = GetAllGameRadios();
                aActiveRadios = Ar_Construct("array");
                array aRadio;
                ref rRadio;

                // Loop through each radio and check if it's active
                if (ar_Size(aGameRadios) > 0) {
                    for (array aRadio in aGameRadios) {
                        rRadio = aRadio["value"];
                        if (rRadio.GetBroadcastState()) {
                            // Store active radios before disabling them
                            ar_Append(aActiveRadios, rRadio);
                            rRadio.SetBroadcastState(0);
                            MessageExAlt(3, "#3|$UIRadioSignalLost|All signals lost.");
                        }
                    }
                }

                AZSMARTArrayEyebotRadioREF.SetBroadcastState(1);
            }
        } else {
            if (!IsPlayerInRegion(AZRadioQuietZoneRegion) && !PlayerREF.IsInInterior()) {
                bPlayerInQuietZone = 0;

                array aRadio;
                ref rRadio;

                // Re-enable only the radios that were active before entering
                if (ar_Size(aActiveRadios) > 0) {
                    for (array aRadio in aActiveRadios) {
                        rRadio = aRadio["value"];
                        rRadio.SetBroadcastState(1);
                        MessageExAlt(3, "#1|$NVDLC03UIRadioSignalFound|Signals found.");
                    }
                }

                ar_Erase(aActiveRadios);
            }
        }
    }
