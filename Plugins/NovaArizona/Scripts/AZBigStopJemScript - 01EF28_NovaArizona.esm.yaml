  CompiledScript: 
  SourceCode: >+
    name AZBigStopJemScript;


    int DoOnce; // Script blocker

    float Timer; // Timer used for animation control


    // Door Locking Stuff

    int bInit;


    int bLockedStore;

    int bLockedHouse;

    int bGetOut;


    ref rStorePackage;

    ref rStoreCell;

    ref rStoreDoorREF;


    ref rHousePackage;

    ref rHouseCell;

    ref rHouseDoorREF;


    ref rKey;


    GameMode {
        // Door Locking Stuff
        if (bInit) {
            ref rCurrentPackage = GetCurrentStablePackage();

            if (rCurrentPackage == rStorePackage) {
                // Have actor try to kick player out if it's past closing time
                if ((GameHour >= 23 || GameHour < 6) && !bGetOut) {
                    SetPublic(rStoreCell, 0);
                    bGetOut = 1;
                }

            } else if (rCurrentPackage == rHousePackage) {
                // Have actor try to kick player out if they're late for work
                if ((GameHour >= 6 && GameHour < 23) && !bGetOut) {
                    SetPublic(rHouseCell, 0);
                    bGetOut = 1;
                }
            }
        }

        // When set to 1, plays medical animations for eight seconds then restarts conversation with the player
        if (GetAV(Variable01) == 1) {
            if (!DoOnce) {
                DisablePlayerControls();
                Timer = 8;
                DoOnce = 1;
                ResetAI();
            }

            Timer = Timer - GetSecondsPassed();

            if (Timer <= 6 && DoOnce == 1) {
                IMod(FadeToBlackISFX);
                DoOnce = 2;
            }

            if (Timer <= 0 && !IsImagespaceActive(FadeToBlackISFX)) {
                SetStage(VDoctors, 10);
                EnablePlayerControls();
                SetAV(Variable01, 3); 
                ResetAI();
                DoOnce = 0;
            }
        }

        // When set to 2, plays medical animations for ten seconds then restarts conversation with the player
        if (GetAV(Variable01) == 2) {
            if (!DoOnce) {
                DisablePlayerControls();
                Timer = 10;
                DoOnce = 1;
                ResetAI();
            }

            Timer = Timer - GetSecondsPassed();

            if (Timer <= 6 && DoOnce == 1) {
                IMod(FadeToBlackISFX);
                DoOnce = 2;
            }

            if (Timer <= 0 && !IsImagespaceActive(FadeToBlackISFX)) {
                SetStage(VDoctors, 20);
                EnablePlayerControls();
                SetAV(Variable01, 3); 
                ResetAI();
                DoOnce = 0;
            }
        }
    }


    OnDeath {
        SetStage(AZBigStopAugustQuest, 255);

        if (!GetObjectiveCompleted(AZMalpaisAbuserQuest, 56) && GetObjectiveDisplayed(AZMalpaisAbuserQuest, 56)) {
            SetObjectiveDisplayed(AZMalpaisAbuserQuest, 56, 0);
        }

        if (GetObjectiveDisplayed(AZMalpaisAbuserQuest, 70)) {
            if (GetObjectiveCompleted(AZMalpaisAbuserQuest, 71)) {
                SetObjectiveDisplayed(AZMalpaisAbuserQuest, 72, 1);
            }
            SetObjectiveCompleted(AZMalpaisAbuserQuest, 70, 1);
        }
    }


    // This is only triggered by the door locking activator during initialization

    OnTriggerEnter::AZBigStopActivatorJemDoorLockerREF {
        rStorePackage = AZBigStopJemStorePackage;
        rStoreCell = AZBigStopJemsGoodsAndServicesINT;
        rStoreDoorREF = AZBigStopJemStoreDoorREF;

        rHousePackage = AZBigStopJemHousePackage;
        rHouseCell = AZBigStopMotelRoomINT05;
        rHouseDoorREF = AZBigStopJemHouseDoorREF;

        rKey = AZKeyBigStopJem;

        bInit = 1;

        AZBigStopActivatorJemDoorLockerREF.EnterTrigger(PlayerREF);
    }
