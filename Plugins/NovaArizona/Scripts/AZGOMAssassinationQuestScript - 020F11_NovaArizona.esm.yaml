  CompiledScript: 
  SourceCode: >-
    scn AZGOMAssassinationQuestScript


    float iTimer

    float fMinnieKillCountdown


    short bDoOnce


    short bBoughtChickDrink

    short bChickIsDrunk

    short bChickThrowingUp

    short bChickSeduced

    short bChickSpiked

    short bChickFreeside

    short bTroopersFleeing

    short bMinnieMurder

    short bClaudeAutotalk


    begin gamemode


    if bMinnieMurder == 1 && bDoOnce == 0
    	set bDoOnce to 1
    	set fMinnieKillCountdown to GetGameDaysPassed
    endif


    if bMinnieMurder == 1
    	if iTimer < fMinnieKillCountdown + 1 && bDoOnce == 1
    		iTimer = GetGameDaysPassed
    	else
    		set bDoOnce to 2
    		AZGOMClaudeREF.enable
    		AZGOMMinnieREF.disable
    		setobjectivedisplayed AZGOMAssassinationQuest 9 1
    		setobjectivecompleted AZGOMAssassinationQuest 8 1
    		setobjectivecompleted AZGOMAssassinationQuest 1 1
    	endif
    endif

    end
