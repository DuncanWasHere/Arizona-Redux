  SourceCode: >-
    name AZNewtCrucifixVictimScript;


    OnActivate {
        if (GetStageDone(AZNewtLegionGraffitiQuest, 30)) {
            if (IsActionRef(Player)) {
                if (!GetDead()) {
                    if (GetSitting() == 3) {
                        ShowMessage(NiptonCrucifiedMsg);
                    } else {
                        Activate();
                    }
                } else {
                    Activate();
                }
            } else {
                Activate();
            }
        }
    }


    GameMode {
        if (!GetDead()) {
            if (!GetIgnoreCrime()) {
                IgnoreCrime(1);
            } else {
                if (!GetRestrained()) {
                    if (GetSitting() == 3) {
                        SetRestrained(1);
                    }
                }
            }
        }
    }
