  CompiledScript: 
  SourceCode: >-
    scn AZChlorideAntibioticsQuestScript


    float iTimer

    float fRimaDeathCountdown


    short bDoOnce


    short bMetRima

    short bGotRimaInfo

    short bRimaGoIndoors

    short bRimaIsIndoors

    short bBlueSassRecallDiscovered

    short bDistractedFrumentarii

    short bConvincedSpiritChaser

    short bInQuietBox

    short bCaravanGuardsKilled

    short bRobbedCaravan

    short bSpiritChaserDebrief

    short bRattedRima


    begin gamemode


    if bRattedRima == 1 && bDoOnce == 0
    	set bDoOnce to 1
    	set fRimaDeathCountdown to GetGameDaysPassed
    endif


    if bRattedRima == 1
    	if iTimer < fRimaDeathCountdown + 1 && bDoOnce == 1
    		iTimer = GetGameDaysPassed
    	else
    		set bDoOnce to 2
    		AZRimaDeathEnablerREF.enable
    		AZChlorideRimaREF.disable
    	endif
    endif

    end
