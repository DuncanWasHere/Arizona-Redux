  CompiledScript: 
  SourceCode: >-
    name AZMineQuestCacheScript;


    int Opened;

    int PlayerFinds;


    OnActivate {
        if (IsActionRef(Player)) {
            if (Opened) {
                Activate();
            } else if (Player.GetItemCount(WeapShovel) >= 1) {
                Activate();
                Opened = 1;
                AZBigSparMineCallumREF.Enable();

                if (!GetObjectiveDisplayed(AZWhiteHillsMineDialogue, 5)) {
                    PlayerFinds = 1;
                } else if (GetObjectiveDisplayed(AZWhiteHillsMineDialogue, 5) && !GetDeadCount(AZElephantHillSlipperyWill)) {
                    SetObjectiveCompleted(AZWhiteHillsMineDialogue, 5, 1);
                    SetObjectiveDisplayed(AZWhiteHillsMineDialogue, 7, 1);
                }
            } else {
                ShowMessage(NoShovelMsg);
            }
        }
    }
