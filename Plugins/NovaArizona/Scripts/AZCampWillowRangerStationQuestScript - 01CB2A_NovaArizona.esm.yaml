  CompiledScript: 
  SourceCode: >+
    name AZCampWillowRangerStationQuestScript;


    GameMode {
        int stage = GetStage(AZCampWillowRangerStationQuest);

        if (stage <= 10) {
            if (GetDeadCount(AZCampWillowCaro) && AZCampWillowCaroREF.GetDisabled() == 0) {
                SetStage(AZCampWillowRangerStationQuest, 50);            // NCR branch
            } else if (AZCampWillowDecanusREF.GetDead() && AZCampWillowDecanusREF.GetDisabled() == 0) {
                SetStage(AZCampWillowRangerStationQuest, 50);            // NCR branch (Caro already dead)
            } else if (GetDeadCount(AZRSDeltaGarcetti)) {
                SetStage(AZCampWillowRangerStationQuest, 60);            // Legion branch
            }

        } else if (stage == 50) {                                         // Player must wipe out Camp Willow
            if (GetDeadCount(AZCampWillowPrentus) && AZCampWillowPrentusREF.GetDisabled() == 0) {
                SetStage(AZCampWillowRangerStationQuest, 70);
            } else if (AZCampWillowScriboniusREF.GetDead() && AZCampWillowScriboniusREF.GetDisabled() == 0) {
                SetStage(AZCampWillowRangerStationQuest, 70);
            } else if (GetDeadCount(AZRSDeltaGarcetti)) {
                SetStage(AZCampWillowRangerStationQuest, 90);            // Fail
            }

        } else if (stage == 60) {                                         // Player must wipe out RS Delta
            if (GetDeadCount(RSDeltaPason)) {
                SetStage(AZCampWillowRangerStationQuest, 80);
            } else if (GetDeadCount(AZCampWillowCaro)) {
                SetStage(AZCampWillowRangerStationQuest, 90);            // Fail
            }

        } else if (stage == 70) {                                         // Player returns to RS Delta
            if (GetDeadCount(AZRSDeltaGarcetti)) {
                SetStage(AZCampWillowRangerStationQuest, 90);            // Fail
            }

        } else if (stage == 80) {                                         // Player returns to Camp Willow
            if (GetDeadCount(AZCampWillowCaro)) {
                SetStage(AZCampWillowRangerStationQuest, 90);            // Fail
            }
        }
    }
