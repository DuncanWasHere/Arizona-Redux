    scn vCCmovetothefortSCRIPT


    ; ========================================================================

    ; Arizona Redux - Edited by DuncanWasHere on 2023-10-10

    ;

    ; This script took the player, their active followers, and Lucullus to the Fort in vanilla

    ; It has been altered to redirect them to Camp Willow instead

    ; Additional tweaks were made to match my formatting preferences

    ; General improvements and fixes forwarded from YUP

    ; ========================================================================


    short DoOnce ; Using this for timer


    BEGIN GameMode

    	if ( DoOnce == 0 )
    		DisablePlayerControls
    		
    		if ( Player.GetInSameCell NVCCBargeREF )
    			PlaySound DRSCCBoat
    		else
    			PlaySound DRSGateOasis01Open
    		endif

    		set DoOnce to 1
    	endif



    	if ( DoOnce == 3 )
    		if ( Player.GetInSameCell NVCCBargeREF ) ; Going to Camp Willow
    			Player.MoveTo AZCampWillowTravelMarkerREF

    			vCCFortGateREF.Enable
    			NVCCBargeREF.Enable
    			NVCCBargeStaticREF.Disable

    			set VCCLucullusREF.iCampWillow to 1
    			set NVCCBargeREF.iStripped to 2
    			set VCCLucullusREF.iTripCounter to ( VCCLucullusREF.iTripCounter + 1 )

    			if ( VCCLucullusREF.GetDead == 0 )
    				VCCLucullusREF.MoveTo AZCampWillowLucullusMarkerREF
    			endif


    		else ; Leaving Camp Willow
    			Player.MoveTo FromTheFortPlayerMarker

    			set VCCLucullusREF.iGate to 0
    			set VCCLucullusREF.iCampWillow to 0
    			set NVCCBargeREF.iStripped to 0
    			set VCCLucullusREF.iTripCounter to ( VCCLucullusREF.iTripCounter + 1 )

    			if (( VCCLucullusREF.GetDead == 0 ) && ( GetStageDone VMQ02 110 == 0 ) && ( GetStageDone VMQCaesarFail 5 == 0 ))
    				VCCLucullusREF.MoveTo FromTheFortMarker
    				NVCCBargeREF.Disable
    				NVCCBargeStaticREF.Enable
    			endif

    			set DoOnce to 6 ; Prevent 'Going to Camp Willow' parts from running
    		endif
    	endif



    	; Spreads the timing out a bit to prevent companions teleporting into the player and Lucullus's skin from glitching
    	; Temporarily sets L38 to 2 to check if a companion is waiting

    	if ( DoOnce == 4 ) ; Going to Camp Willow
    		if (( VNPCFollowers.bBooneHired ) && ( CraigBooneREF.Waiting != 1 ))
    			set CraigBooneREF.Waiting to 1
    			CraigBooneREF.MoveTo AZCampWillowCompanionMarkerREF
    			set VNPCFollowers.bBooneL38 to 2		
    		endif

    		if (( VNPCFollowers.bCassHired ) && ( RoseofSharonCassidyREF.Waiting != 1 ))
    			set RoseofSharonCassidyREF.Waiting to 1
    			RoseofSharonCassidyREF.MoveTo AZCampWillowCompanionMarkerREF
    			set VNPCFollowers.bCassL38 to 2
    		endif

    		if (( VNPCFollowers.bVeronicaHired ) && ( VeronicaREF.Waiting != 1 ))
    			set VeronicaREF.Waiting to 1
    			VeronicaREF.MoveTo AZCampWillowCompanionMarkerREF
    			set VNPCFollowers.bVeronicaL38 to 2
    		endif

    		if (( VNPCFollowers.bLilyHired ) && ( LilyREF.Waiting != 1 ))
    			set LilyREF.Waiting to 1
    			LilyREF.MoveTo AZCampWillowCompanionMarkerREF
    			set VNPCFollowers.bLilyL38 to 2
    		endif

    		if (( VNPCFollowers.RaulHired ) && ( RaulREF.Waiting != 1 ))
    			set RaulREF.Waiting to 1
    			RaulREF.MoveTo AZCampWillowCompanionMarkerREF
    			set VNPCFollowers.bRaulL38 to 2
    		endif

    		if (( VNPCFollowers.ArcadeHired ) && ( ArcadeREF.Waiting != 1 ))
    			set ArcadeREF.Waiting to 1
    			ArcadeREF.MoveTo AZCampWillowCompanionMarkerREF
    			set VNPCFollowers.bArcadeL38 to 2
    		endif

    		if (( VNPCFollowers.RexHired ) && ( RexREF.Waiting != 1 ))
    			set RexREF.Waiting to 1
    			RexREF.MoveTo AZCampWillowCompanionMarkerREF
    			set VNPCFollowers.bRexL38 to 2
    		endif

    		if (( VNPCFollowers.bEDEHired ) && ( EDE1REF.Waiting != 1 ))
    			if ( EDE1Ref.GetDisabled == 0 )
    				set EDE1Ref.Waiting to 1
    				EDE1Ref.MoveTo AZCampWillowCompanionMarkerREF
    				set VNPCFollowers.bEDEL38 to 2
    			elseif ( EDE2Ref.GetDisabled == 0 )
    				set EDE2Ref.Waiting to 1
    				EDE2Ref.MoveTo AZCampWillowCompanionMarkerREF
    				set VNPCFollowers.bEDEL38 to 2
    			elseif ( EDE3Ref.GetDisabled == 0 )
    				set EDE3Ref.Waiting to 1
    				EDE3Ref.MoveTo AZCampWillowCompanionMarkerREF
    				set VNPCFollowers.bEDEL38 to 2
    			endif
    		endif

    		SetPCSleepHours 1
    		set DoOnce to 11
    	endif


    	;Leaving Camp Willow
    	if ( DoOnce == 7 )
    		if (( VNPCFollowers.bBooneHired ) && ( CraigBooneREF.Waiting != 1))
    			set CraigBooneREF.Waiting to 1
    			CraigBooneREF.MoveTo FromTheFortCompanionMarker
    			set VNPCFollowers.bBooneL38 to 2
    		endif

    		if (( VNPCFollowers.bCassHired) && (RoseofSharonCassidyREF.Waiting != 1 ))
    			set RoseofSharonCassidyREF.Waiting to 1
    			RoseofSharonCassidyREF.MoveTo FromTheFortCompanionMarker
    			set VNPCFollowers.bCassL38 to 2
    		endif

    		if (( VNPCFollowers.bVeronicaHired ) && ( VeronicaREF.Waiting != 1 ))
    			set VeronicaREF.Waiting to 1
    			VeronicaREF.MoveTo FromTheFortCompanionMarker
    			set VNPCFollowers.bVeronicaL38 to 2
    		endif

    		if (( VNPCFollowers.bLilyHired ) && ( LilyREF.Waiting != 1 ))
    			set LilyREF.Waiting to 1
    			LilyREF.MoveTo FromTheFortCompanionMarker
    			set VNPCFollowers.bLilyL38 to 2
    		endif

    		if (( VNPCFollowers.RaulHired ) && ( RaulREF.Waiting != 1 ))
    			set RaulREF.Waiting to 1
    			RaulREF.MoveTo FromTheFortCompanionMarker
    			set VNPCFollowers.bRaulL38 to 2
    		endif

    		if (( VNPCFollowers.ArcadeHired ) && ( ArcadeREF.Waiting != 1 ))
    			set ArcadeREF.Waiting to 1
    			ArcadeREF.MoveTo FromTheFortCompanionMarker
    			set VNPCFollowers.bArcadeL38 to 2
    		endif

    		if (( VNPCFollowers.RexHired ) && ( RexREF.Waiting != 1 ))
    			set RexREF.Waiting to 1
    			RexREF.MoveTo FromTheFortCompanionMarker
    			set VNPCFollowers.bRexL38 to 2
    		endif

    		if (( VNPCFollowers.bEDEHired ) && ( EDE1REF.Waiting != 1 ))
    			if ( EDE1Ref.GetDisabled == 0 )
    				set EDE1Ref.Waiting to 1
    				EDE1Ref.MoveTo FromTheFortCompanionMarker
    			elseif ( EDE2Ref.GetDisabled == 0 )
    				set EDE2Ref.Waiting to 1
    				EDE2Ref.MoveTo FromTheFortCompanionMarker
    			elseif ( EDE3Ref.GetDisabled == 0 )
    				set EDE3Ref.Waiting to 1
    				EDE3Ref.MoveTo FromTheFortCompanionMarker
    			endif
    			set VNPCFollowers.bEDEL38 to 2
    		endif

    		SetPCSleepHours 1
    		set DoOnce to 11
    	endif

    	set DoOnce to ( DoOnce + 1 )

    	if ( DoOnce >= 13 ) ; Stop waiting and set L38 back to 0 if it was set to 2 above

    		if ( VNPCFollowers.bBooneL38 == 2 )
    			set CraigBooneREF.Waiting to 0
    			set VNPCFollowers.bBooneL38 to 0
    		endif

    		if ( VNPCFollowers.bCassL38 == 2 )
    			set RoseofSharonCassidyREF.Waiting to 0
    			set VNPCFollowers.bCassL38 to 0
    		endif

    		if ( VNPCFollowers.bVeronicaL38 == 2 )
    			set VeronicaREF.Waiting to 0
    			set VNPCFollowers.bVeronicaL38 to 0
    		endif

    		if ( VNPCFollowers.bLilyL38 == 2 )
    			set LilyREF.Waiting to 0
    			set VNPCFollowers.bLilyL38 to 0
    		endif

    		if ( VNPCFollowers.bRaulL38 == 2 )
    			set RaulREF.Waiting to 0
    			set VNPCFollowers.bRaulL38 to 0
    		endif

    		if ( VNPCFollowers.bArcadeL38 == 2 )
    			set ArcadeREF.Waiting to 0
    			set VNPCFollowers.bArcadeL38 to 0
    		endif

    		if ( VNPCFollowers.bRexL38 == 2 )
    			set RexREF.Waiting to 0
    			set VNPCFollowers.bRexL38 to 0
    		endif

    		if ( VNPCFollowers.bEDEL38 == 2 )
    			if ( EDE1Ref.GetDisabled == 0 )
    				set EDE1Ref.Waiting to 0
    			elseif ( EDE2Ref.GetDisabled == 0 )
    				set EDE2Ref.Waiting to 0
    			elseif ( EDE3Ref.GetDisabled == 0 )
    				set EDE3Ref.Waiting to 0
    			endif
    			set VNPCFollowers.bEDEL38 to 0
    		endif
    		
    		;Autosave
    		EnablePlayerControls
    		Stopquest vCCMoveToTheFort
    		set DoOnce to 0
    	endif

    END
