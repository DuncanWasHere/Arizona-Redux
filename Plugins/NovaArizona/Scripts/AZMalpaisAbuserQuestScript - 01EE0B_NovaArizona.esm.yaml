  SourceCode: >-
    scn AZMalpaisAbuserQuestScript


    short SedonusSlavesMoved

    short SlaveDoOnce


    short Slave1DoOnce

    short Slave2DoOnce


    short SedonusInspired

    short SedonusUninspired

    short SedonusWaitTimer


    short DoOnce


    float iTimer


    BEGIN GameMode


    if GetObjectiveDisplayed AZMalpaisAbuserQuest 35 == 1 && GetQuestCompleted AZMalpaisAbuserQuest == 0
    	if SedonusSlavesMoved == 2
    		SetObjectiveCompleted AZMalpaisAbuserQuest 35 1
    		SetObjectiveDisplayed AZMalpaisAbuserQuest 40 1
    	endif
    endif



    if AZSedonusSlave01REF.GetDead >= 1 || AZSedonusSlave01REF.GetDead >= 1
    	if SlaveDOOnce == 0 && GetStageDone AZMalpaisAbuserQuest 20 == 0
    		if GetDeadCount AZMalpaisMarcellusSedonus == 0
    			SetStage AZMalpaisAbuserQuest 255
    			AZMarcellusSedonusREF.StartCombat player
    			AddReputationExact RepNVCaesarsLegion 0 12
    			Set SlaveDoOnce to 1
    		endif
    	endif
    endif


    if Player.GetHasNote AZMalpaisSedonusQuestNote == 1 && GetObjectiveDisplayed AZMalpaisAbuserQuest 55 == 1 && GetObjectiveCompleted AZMalpaisAbuserQuest 55 == 0
    	if GetDeadCount AZBigStopJem == 0 && AZElephantHillFatEyeQuest.FatEyeJem == 0 && GetObjectiveCompleted AZMalpaisAbuserQuest 56 == 0 && AZBigStopAugustQuest.GossipReject == 0
    		SetObjectiveDisplayed AZMalpaisAbuserQuest 56 1
    	endif
    	if GetDeadCount AZElephantHillFatEye == 0 && AZElephantHillFatEyeQuest.FatEyeJem == 1
    		SetObjectiveDisplayed AZMalpaisAbuserQuest 57 1
    	endif
    endif


    if GetObjectiveDisplayed AZMalpaisAbuserQuest 81 == 1 && GetObjectiveCompleted AZMalpaisAbuserQuest 81 == 0
    	if Player.GetItemCount NVFixer > 0
    		SetObjectiveDisplayed AZMalpaisAbuserQuest 82 1
    	elseif Player.GetItemCount NVFixer == 0
    		SetObjectiveDisplayed AZMalpaisAbuserQuest 82 0
    	endif
    endif


    if GetStage AZMalpaisAbuserQuest == 70 && GetQuestCompleted AZMalpaisAbuserQuest == 0
    	if DoOnce == 0
    		set SedonusWaitTimer to GetGameDaysPassed
    		set DoOnce to 1
    	elseif DoOnce == 1
    		if iTimer < SedonusWaitTimer + 7
    				iTimer = GetGameDaysPassed
    		else
    			SetStage AZMalpaisAbuserQuest 80
    			AZMalpaisAdjutantREF.disable
    			Set DoOnce to 2
    		endif
    	endif
    endif


    if GetStage AZMalpaisAbuserQuest == 80
    	if AZMalpaisAbuserQuest.SedonusUninspired == 1
    		if AZBigStopAlbaNoxREF.GetDead == 1 && AZElephantHillFatEyeREF.GetDead == 1
    			SetObjectiveDisplayed AZMalpaisAbuserQuest 95 1
    		endif
    	endif
    endif


    END
