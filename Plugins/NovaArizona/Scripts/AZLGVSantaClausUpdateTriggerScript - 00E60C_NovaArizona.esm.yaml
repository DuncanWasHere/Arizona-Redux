  SourceCode: >-
    scn AZLGVSantaClausUpdateTriggerScript


    BEGIN OnTriggerEnter player


    if GetStageDone AZStatioFindFriendQuest 35 == 1 && GetQuestCompleted AZStatioFindFriendQuest == 0
    	SetObjectiveCompleted AZStatioFindFriendQuest 35 1
    	SetObjectiveDisplayed AZStatioFindFriendQuest 50 1
    	Set AZStatioFindFriendQuest.AutonousSearchStatus to 3
    	AZLGVDolanNoteREF.disable
    	AZLGVDolanBasketREF.disable
    endif


    END
