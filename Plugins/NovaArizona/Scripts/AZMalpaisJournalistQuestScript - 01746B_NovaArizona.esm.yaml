  SourceCode: >-
    scn AZMalpaisJournalistQuestScript


    Float iTimer


    int iDoOnce1

    int bDoOnce2


    short DoOnceBigStop

    short bChainwayForemanBroughttoNestor

    short bChainwayForemanPresent

    short bChainwayForemanTask

    short bDominicusAngry

    short bDominicusInterviewVeryPositive

    short bDominicusInterviewPositive

    short bDominicusInterviewNotPositive

    short bDominicusInterviewNoInterview

    short bDominicusInterviewOver

    short bKnowsAboutMalachi

    short bKnowsAboutSlaves

    short bLegionInformedAboutMalachi

    short bStanleyFate

    short bStanleyFateHelper

    short bStanleyInterviewOffered

    short bStanleyInterviewOne

    short bStanleyInterviewTwo

    short bStanleyJobOffered

    short bStanleyIsDoomed

    short bStanleyMet

    short bStanleyPaysMore

    short bStanleyLegionApproval

    short bStanleyLegionDisapproval

    short bWhiteSandsGuardAngered


    short ChildGreetDoOnce


    BEGIN GameMode


    if GetQuestCompleted AZMalpaisJournalistQuest == 0
    	if GetQuestCompleted VMQCaesarFail == 1
    		SetStage AZMalpaisJournalistQuest 160
    	endif
    	if GetQuestCompleted VMQCaesarFail == 0 && GetDeadCount FortCaesar > 0
    		SetStage AZMalpaisJournalistQuest 170
    		AZStanleyHartfordREF.AddItem AZStanleyDeathNote 1
    	endif
    endif
    	
    if bChainwayForemanBroughttoNestor == 1 || bChainwayForemanBroughttoNestor == 2
    	AZMalpaisNestorREF.EVP
    endif
    	
    if GetStage AZMalpaisJournalistQuest == 60
    	if iDoOnce1 == 1
    		if iTimer < bStanleyFateHelper + 3
    				iTimer = GetGameDaysPassed
    		else
    			Set iDoOnce1 to 2
    			SetStage AZMalpaisJournalistQuest 65
    		endif
    	endif
    endif
    	
    if GetStage AZMalpaisJournalistQuest == 40 && GetObjectiveDisplayed AZMalpaisJournalistQuest 41 == 1
    	if bKnowsAboutMalachi == 1
    		SetObjectiveCompleted AZMalpaisJournalistQuest 41 1
    	endif
    endif


    End
