  CompiledScript: 
  SourceCode: >-
    scn AZWaterPumpPoisonActivatorScript


    short WellButton

    short WellDetected

    short WellPoisoned

    short DoOnce



    BEGIN OnActivate player


    if IsActionRef Player
    	if Player.GetItemCount AZSmoochCannister == 1
    		ShowMessage AZBrushQuest02WaterPrePoisoned
    	elseif Player.GetItemCount AZSmoochCannister == 0
    		ShowMessage AZBrushQuest02WaterPostPoisoned
    	endif
    endif


    END



    BEGIN OnActivate


    if IsActionRef Player
    	if Player.GetItemCount AZSmoochCannister == 1
    		ShowMessage AZBrushQuest02WaterPrePoisoned
    	elseif Player.GetItemCount AZSmoochCannister == 0
    		ShowMessage AZBrushQuest02WaterPostPoisoned
    	endif
    endif


    END



    BEGIN GameMode

    Set WellButton to GetButtonPressed


    if AZBrushQuest02.WellPoisoned == 0
    	if WellButton == 0
    		Return
    	elseif WellButton == 1
    		Player.RemoveItem AZSmoochCannister 1
    		AZMountTiptonCaveMartyREF.disable
    		set AZBrushQuest02.WellPoisoned to 1
    		SetObjectiveCompleted AZBrushQuest02 60 1
    		SetObjectiveDisplayed AZBrushQuest02 62 0
    		SetObjectiveDisplayed AZBrushQuest02 63 1
    		if GetPCDetectionState > 1
    			Set AZBrushQuest02.WellPoisonedDetected to 1
    			AddReputationExact RepNVCaesarsLegion 0 12
    		endif
    	endif
    elseif AZBrushQuest02.WellPoisoned == 1 && DoOnce == 0
    	ShowMessage AZBrushQuest02WaterPostPoisoned
    	Set DoOnce to 1
    endif


    END
