  SourceCode: >-
    scn AZLGVBloodActivator01Script


    int Button


    BEGIN OnActivate Player


    ShowMessage AZLGVAircraftActivator01


    END



    BEGIN GameMode


    Set Button to GetButtonPressed

    if Button == 1
    	if Player.GetAV Medicine < 40
    		ShowMessage AZLGVAircraftActivator01a
    	elseif Player.GetAV Medicine >= 40
    		ShowMessage AZLGVAircraftActivator01b
    		SetStage AZStatioFindFriendQuest 21
    		SetObjectiveDisplayed AZStatioFindFriendQuest 30 0
    	endif
    endif


    END
