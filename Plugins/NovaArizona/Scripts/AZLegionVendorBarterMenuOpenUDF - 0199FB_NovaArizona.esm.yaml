  CompiledScript: 
  SourceCode: >+
    name AZLegionVendorBarterMenuOpenUDF;


    fn (int iMenuID) {
    	if (IsKeyPressed(1) ||
    		IsKeyPressed(15) ||
    		IsKeyPressed(56) ||
    		IsButtonPressed(16)) {
    		// If the pause menu was opened during barter, we need to return now
    		// Because apparently GetMenuItemListRefs() will trigger an error otherwise
    		print("Pause menu opened during barter, ignoring event.");
    		return;
    	}

    	ref rVendor = GetMenuTargetRef(1053);

    	if (HasKeyword(rVendor, "AZDenariusVendor")) {
    		SetOnMenuCloseEventHandler(AZLegionVendorBarterMenuCloseUDF, 1, 1053);

    		// Count and convert currencies
    		int iPlayerCaps = PlayerREF.GetItemCount(Caps001);
    		int iPlayerDenarii = PlayerREF.GetItemCount(MoneyLegion1);
    		int iPlayerAurei = PlayerREF.GetItemCount(MoneyLegion25);
    		int iPlayerLegionCoinValue = iPlayerDenarii + iPlayerAurei * 25;
    		int iVendorCaps = rVendor.GetItemCount(Caps001);
    		int iVendorDenarii = iVendorCaps / 4;
    	
    		// Store variables in quest
    		AZLegionVendorBarterQuest.rVendor = rVendor;
    		AZLegionVendorBarterQuest.iPlayerCaps = iPlayerCaps;
    		AZLegionVendorBarterQuest.iPlayerDenarii = iPlayerDenarii;
    		AZLegionVendorBarterQuest.iPlayerAurei = iPlayerAurei;
    		AZLegionVendorBarterQuest.iPlayerLegionCoinValue = iPlayerLegionCoinValue;
    		AZLegionVendorBarterQuest.iVendorCaps = iVendorCaps;
    		AZLegionVendorBarterQuest.iVendorDenarii = iVendorDenarii;
    		// AZLegionVendorBarterQuest.fBarterBuyBaseDefault = GetNumericGameSetting("fBarterBuyBase");
    		// AZLegionVendorBarterQuest.fBarterSellBaseDefault = GetNumericGameSetting("fBarterSellBase");
    		
    		// Remove player's Legion coins so they won't appear in the barter menu
    		PlayerREF.RemoveItem(MoneyLegion1, iPlayerDenarii, 1);
    		PlayerREF.RemoveItem(MoneyLegion25, iPlayerAurei, 1);
    	
    		// Remove player's caps and replace with total value of Legion coins
    		PlayerREF.RemoveItem(Caps001, iPlayerCaps, 1);
    		PlayerREF.AddItem(Caps001, iPlayerLegionCoinValue, 1);
    	
    		// Remove vendor's caps and replace with number of denarii of equal value
    		rVendor.RemoveItem(Caps001, iVendorCaps, 1);
    		rVendor.AddItem(Caps001, iVendorDenarii, 1);
    		
    		// No longer changing these settings, modifying values directly now
    		// Convert item values to use denarii
    		// SetNumericGameSetting("fBarterBuyBase", 0.3875);
    		// SetNumericGameSetting("fBarterSellBase", 0.1125);
    		
    		// Temporarily modify the UI strings to reflect the new currency
    		SetUIStringAlt("BarterMenu\\NOGLOW_BRANCH\\BM_CapsFlow\\BM_CapsLabel\\string", "Denarii");
    		SetUIStringAlt("RepairServicesMenu\\NOGLOW_BRANCH\\RSM_MainRect\\RSM_CapsLabel\\string", "Denarii");
    		con_SetGameSetting("sInventoryCaps", "Denarii");
    		con_SetGameSetting("sMerchantNoGold", "Merchant doesn't have enough denarii.");
    		con_SetGameSetting("sNotEnoughCaps", "You don't have enough denarii.");
    		con_SetGameSetting("sRepairCost", "Cost: %d denarii");
    		
    		AZLegionVendorBarterQuest.aItemValues = Ar_Construct("stringmap");

    		for ([_, ref rItem] in GetMenuItemListRefs(1, 0)) {
    			ref rBaseItem = rItem.GetBaseForm();
    			string sBaseItem = RefToString(rBaseItem);
    			if (Ar_HasKey(AZLegionVendorBarterQuest.aItemValues, sBaseItem)) {
    				continue;
    			}
    			
    			float fBaseValue = GetValueAlt(rBaseItem);
    			AZLegionVendorBarterQuest.aItemValues[sBaseItem] = fBaseValue;
    			SetValueAlt(rBaseItem, Ceil(fBaseValue / 4));
    		}

    		for ([_, ref rItem] in GetMenuItemListRefs(1, 1)) {
    		ref rBaseItem = rItem.GetBaseForm();
    		string sBaseItem = RefToString(rBaseItem);
    		if (Ar_HasKey(AZLegionVendorBarterQuest.aItemValues, sBaseItem)) {
    			continue;
    		}
    		
    		float fBaseValue = GetValueAlt(rBaseItem);
    		AZLegionVendorBarterQuest.aItemValues[sBaseItem] = fBaseValue;
    		SetValueAlt(rBaseItem, Ceil(fBaseValue / 4));
    	}
    		
    		RefreshItemsList();
    	}
    }
