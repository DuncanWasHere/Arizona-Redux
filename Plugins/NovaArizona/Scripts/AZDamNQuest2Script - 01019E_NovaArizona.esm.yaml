    				SetStage AZDamNQuest2 12
    			endif
    		elseif AZBigStopClariceQuest.bPostSteffie == 1
    			SetStage AZDamNQuest2 12
    		endif
    	endif
    endif



    if (GetStage VMQ03a > 0) || (GetStage VMQ03b > 0)
    	if GetQuestCompleted AZDamNQuest1 == 0
    		SetStage AZDamNQuest1 110
    		AZOmarREF.KillActor
    	endif
    	if GetQuestCompleted AZDamNQuest2 == 0
    		if AZBigStopClariceQuest.bPostSteffie == 0
    			AZHDSteffieREF.KillActor
    		endif
    		SetStage AZDamNQuest2 53
    		Set bWireTookAction to 1
    		AZHHRefugee1aREF.KillActor
    		AZHHRefugee1bREF.KillActor
    		AZHHRefugee1cREF.KillActor
    		AZHHRefugee1dREF.KillActor
    		AZHHRefugee1eREF.KillActor
    		AZHHRefugee1fREF.KillActor
