    		AZCastraNervaREF.disable
    		AZHDRSAntoninusREF.killactor
    		AZHDRSFlaminiusREF.killactor
    		VHDCheckpointEastDoorREF.unlock
    	endif
    	if GetQuestCompleted AZDamnQuest3 == 1
    		AZHHRefugee2aaREF.disable
    		AZHHRefugee2baREF.disable
    		AZHDWireREF.moveto AZHDWireMarkerREF
    	endif
    	if AZCastraNervaREF.GetDead == 0
    		AZCastraNervaDeadREF.enable
    		AZHDRSSuicideBloodREF.enable
    		AZHDRSMacheteGladiusREF.enable
    	endif
    endif


    if (GetStageDone AZDamNQuest2 45 == 1) && (GetQuestCompleted AZDamNQuest1 == 1) && (GetQuestCompleted AZDamNQuest2 == 1)
    	if (GetStage VHDBattleController > 0) || (GetStage VHDLegionBattle > 0) || (GetStage VHDHouseBattle > 0) || (GetStage VHDIndependentBattle > 0) 
    		AZOmarREF.Disable
    		AZHHRefugee3aREF.Disable
    		AZHHRefugee3bREF.Disable
    		AZHHRefugee3cREF.Disable
    		AZCharlieREF.Disable
    		AZHDCheckpointOfficerREF.Disable
    		AZHDNCRTrooper02REF.Disable
    		AZHDNCRTrooper02bREF.Disable
    		AZHDNCRTrooper03aREF.Disable
    		AZHDNCRTrooper03bREF.Disable
    	endif
    endif


    if GetStageDone AZDamNQuest2 22 == 1  || GetStageDone AZDamNQuest2 45 == 1
            if GetStageDone AZBigStopClariceQuest 5 ==0
                SetStage AZBigStopClariceQuest 10
            endif
    endif


    END
