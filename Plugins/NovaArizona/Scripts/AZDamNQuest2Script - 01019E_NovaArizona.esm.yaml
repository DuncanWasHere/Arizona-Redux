    scn AZDamNQuest2Script


    short bAgreedtoKillRefugees

    short bCeasefireinEffect

    short bMetNerva

    short bOnAnAssassinationMission

    short bOnDuty

    short bUnderFrumentariiProtection

    short bWireTookAction



    BEGIN GameMode


    if bAgreedtoKillRefugees == 1
