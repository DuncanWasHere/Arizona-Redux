  SourceCode: >-
    scn AZHavenMurderQuestScript


    ; Variables to help manage the Haven vote system

    int TotalHavenPopulation

    int HavenJobKillVote

    int HavenJobSpareVote

    int HavenJobUncommittedVote


    ; Variables to help manage Haven's randomness

    int AhoteDecision

    int BenjaminDecision

    int MurrayDecision

    int RipleyDecision

    int SerwaDecision


    ; variables to clear quest objectives

    int CalDecision

    int CorvusDecision

    int DocDecision

    int EvelinaDecision

    int JobDecision

    int RuceDecision

    int WierzbowskiDecision


    ; Other quest variables

    int JobConclusion ; 1 = Executed by player, 2 = Executed by Deathclaws, 3 = Spared and given community service, 4 = Spared and exiled, 5 = Killed by Sharky, 6 = Job been killed (conclusion of 1 and 2)

    int WaterChipFound

    int SharkyHealed ; 1 = offered, 2 = healed, 3 = Sharky attacks Job, 4 = Sharky killed, 5 = Sharky lives



    BEGIN GameMode


    if AhoteDecision == 1 && BenjaminDecision == 1 && CalDecision == 1 && CorvusDecision == 1 && DocDecision >= 1 && EvelinaDecision == 1 && JobDecision == 1 && MurrayDecision == 1 && RipleyDecision == 1 && RuceDecision == 1 && SerwaDecision == 1 && WierzbowskiDecision == 1
    	SetStage AZHavenMurderQuest 10
    endif


    END
