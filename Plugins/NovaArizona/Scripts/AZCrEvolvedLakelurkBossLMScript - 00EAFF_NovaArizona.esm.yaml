  CompiledScript: 
  SourceCode: >-
    name AZCrEvolvedLakelurkBossLMScript;


    OnDeath {
    	AZNewtFishingQuest.BossLakelurksKilled += 2;
    }


    GameMode {
    	if (AZNewtFishingQuest.LakelurksKilled >= 10 && AZNewtFishingQuest.BossLakelurksKilled >= 5) {
    		if (GetStage(AZNewtFishingQuest) == 50) {
    			SetStage(AZNewtFishingQuest, 60);
    			AZNewtFishingQuest.HiveCleared = 1;
    		} else if (GetStage(AZNewtFishingQuest) < 50) {
    			AZNewtFishingQuest.HiveCleared = 1;
    		} else if (GetStage(AZNewtFishingQuest) == 100) {
    			AZNewtFishingQuest.HiveCleared = 2;
    		}
    	}
    }
