  SourceCode: >+
    name AZChlorideAntibioticsItemScript;


    OnAdd::PlayerREF {
        if (!AZSmartArrayLegionCaravanGuardREF.GetItemCount(AZChlorideAntibioticsItem)) {

            SetObjectiveCompleted(AZChlorideAntibioticsQuest, 0, 1);
            SetObjectiveCompleted(AZChlorideAntibioticsQuest, 10, 1);
            SetObjectiveDisplayed(AZChlorideAntibioticsQuest, 14, 1);

            AZChlorideAntibioticsQuest.bRobbedCaravan = 1;
            AZSMARTArraySpiritChaserREF.SetHealth(50);
            AZSMARTArraySpiritChaserREF.Evp();
            AZSmartArrayBelliusREF.SetHealth(75);

            if (AZChlorideAntibioticsQuest.bConvincedSpiritChaser && !AZSMARTArraySpiritChaserREF.GetDead()) {
                DisablePlayerControls();
            }
        }

        if (!AZChlorideAntibioticsQuestUsanagiContainerREF.GetItemCount(AZChlorideAntibioticsItem)) {

            SetObjectiveCompleted(AZChlorideAntibioticsQuest, 0, 1);
            SetObjectiveCompleted(AZChlorideAntibioticsQuest, 6, 1);
            SetObjectiveDisplayed(AZChlorideAntibioticsQuest, 14, 1);
        }
    }
