  CompiledScript: 
  SourceCode: >-
    name AZBarkerForceGreetTriggerScript;


    int DoOnce;


    OnTriggerEnter::Player {
        if (!AZBarkerDialogue.iBarkerCaveAcceptance) {
            AZSUHBarkerREF.AddScriptPackage(AZBarkerCaveForceGreetPackage);
            DoOnce = 1;
        }

        if (AZBarkerDialogue.iBarkerCaveAcceptance > 0 && DoOnce) {
            AZSUHBarkerREF.RemoveScriptPackage(AZBarkerCaveForceGreetPackage);
        }

        if (AZBarkerDialogue.iBarkerCaveAcceptance > 1) {
            AZSUHBarkerREF.AddScriptPackage(AZBarkerMoveAwayFromDoorPackage);
        }
    }
