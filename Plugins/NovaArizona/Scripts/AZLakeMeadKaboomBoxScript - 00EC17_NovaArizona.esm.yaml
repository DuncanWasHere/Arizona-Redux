  CompiledScript: 
  SourceCode: >-
    scn AZLakeMeadKaboomBoxScript


    int Button

    int Decision

    int DoOnce


    BEGIN OnActivate player


    if AZNewtFishingQuest.GeneratorsSettoBlow == 0
    	ShowMessage AZLakeMeadSelfDestructMessage01
    else
    	ShowMessage AZLakeMeadSelfDestructMessage03
    endif


    END


    BEGIN GameMode

    Set Button to GetButtonPressed

    if Decision == 0
    	if Button == 1
    		ShowMessage AZLakeMeadSelfDestructMessage02
    		Set Decision to 1
    		Set Button to 0
    	endif
    elseif Decision == 1
    	if Button == 0
    		ShowMessage AZLakeMeadSelfDestructMessage02
    	elseif Button > 0
    		Set AZNewtFishingQuest.GeneratorsSettoBlow to 1
    		Set Decision to 2
    		Set DoOnce to 1
    	endif
    endif


    if DoOnce == 1
    	AZLakeMeadLaboratoryKlaxonGlow01.activate AZLakeMeadLaboratoryKlaxonGlow01 1
    	AZLakeMeadLaboratoryKlaxon01.activate AZLakeMeadLaboratoryKlaxon01 1
    	AZLakeMeadLaboratoryKlaxonGlow02.activate AZLakeMeadLaboratoryKlaxonGlow02 1
    	AZLakeMeadLaboratoryKlaxon02.activate AZLakeMeadLaboratoryKlaxon02 1
    	AZLakeMeadLaboratoryKlaxonGlow03.activate AZLakeMeadLaboratoryKlaxonGlow03 1
    	AZLakeMeadLaboratoryKlaxon03.activate AZLakeMeadLaboratoryKlaxon03 1
    	AZLakeMeadLaboratoryKlaxonGlow04.activate AZLakeMeadLaboratoryKlaxonGlow04 1
    	AZLakeMeadLaboratoryKlaxon04.activate AZLakeMeadLaboratoryKlaxon04 1
    	AZLakeMeadLaboratoryKlaxonGlow05.activate AZLakeMeadLaboratoryKlaxonGlow05 1
    	AZLakeMeadLaboratoryKlaxon05.activate AZLakeMeadLaboratoryKlaxon05 1
    	AZLakeMeadLaboratoryKlaxonGlow06.activate AZLakeMeadLaboratoryKlaxonGlow06 1
    	AZLakeMeadLaboratoryKlaxon06.activate AZLakeMeadLaboratoryKlaxon06 1
    	AZLakeMeadLaboratoryKlaxonGlow07.activate AZLakeMeadLaboratoryKlaxonGlow07 1
    	AZLakeMeadLaboratoryKlaxon07.activate AZLakeMeadLaboratoryKlaxon07 1
    	AZLakeMeadLaboratoryKlaxonGlow08.activate AZLakeMeadLaboratoryKlaxonGlow08 1
    	AZLakeMeadLaboratoryKlaxon08.activate AZLakeMeadLaboratoryKlaxon08 1

    	AZLakeMeadFacilityDoorREF.SetDestroyed 1
    	AZLakeMeadLaboratoryLockdownLurkEnabler.enable
    	PlaySound VMS08Explosion3D
    	if GetStage AZNewtFishingQuest == 50
    		SetStage AZNewtFishingQuest 60
    		Set AZNewtFishingQuest.HiveCleared to 1
    	elseif AZNewtFishingQuest < 50
    		Set AZNewtFishingQuest.HiveCleared to 1
    	elseif AZNewtFishingQuest == 100
    		Set AZNewtFishingQuest.HiveCleared to 2
    	endif
    	Set DoOnce to 2
    endif


    END
