  CompiledScript: 
  SourceCode: >+
    name AZActivatorStoreHouseDoorLockerScript;


    ref rLinkedREF; //The store/home owner actor linked to the activator.

    int bInit;


    // Variables read from the linked actor. They must be defined in its script.

    ref rStorePackage;

    ref rStoreCell;

    ref rStoreDoorREF;


    ref rHousePackage;

    ref rHouseCell;

    ref rHouseDoorREF;


    ref rKey;



    GameMode {
    	if (!bInit) {
    		ref rSelf = GetSelf();
    		rLinkedREF = GetLinkedRef();
    		rLinkedREF.EnterTrigger(rSelf); //Force the actor to initialize its variables if it hasn't been loaded yet.
    	} else {
    		ref rCurrentPackage = rLinkedREF.GetCurrentStablePackage();
    		int bLockedStore = rLinkedREF.GetVariable("bLockedStore");
    		int bLockedHouse = rLinkedREF.GetVariable("bLockedHouse");
    		int bGetOut = rLinkedREF.GetVariable("bGetOut");
    	
    		if (rCurrentPackage == rStorePackage) {
    			// Lock house if actor left for work.
    			if (!bLockedHouse) {
    				if (!bGetOut) {
    					SetPublic(rHouseCell, 0);
    					rLinkedREF.SetVariable("bGetOut", 1);			
    				}

    				if (!rLinkedREF.GetInCell(rHouseCell) && rLinkedREF.GetItemCount(rKey)) {
    					rHouseDoorREF.Lock(50);
    					SetPublic(rHouseCell, 0);
    					rLinkedREF.SetVariable("bLockedHouse", 1);
    				}
    			}
    	
    			// Allow customers if actor opened their store.
    			if (bLockedStore) {
    				if (rLinkedREF.GetInCell(rStoreCell)) {
    					rStoreDoorREF.Unlock();
    					SetPublic(rStoreCell, 1);
    					rLinkedREF.SetVariable("bLockedStore", 0);
    					rLinkedREF.SetVariable("bGetOut", 0);
    				}
    			}
    	
    		} else {
    			// Lock store if actor closed for the night.
    			if (!bLockedStore) {
    				if (!bGetOut) {
    					SetPublic(rStoreCell, 0);
    					rLinkedREF.SetVariable("bGetOut", 1);			
    				}

    				if (!rLinkedREF.GetInCell(rStoreCell) && rLinkedREF.GetItemCount(rKey)) {
    					rStoreDoorREF.Lock(50);
    					rLinkedREF.SetVariable("bLockedStore", 1);
    				}
    			}
    	
    			// Allow guests if actor is home.
    			if (bLockedHouse) {
    				if (rLinkedREF.GetInCell(rHouseCell)) {
    					rHouseDoorREF.Unlock();
    					SetPublic(rHouseCell, 1);
    					rLinkedREF.SetVariable("bLockedHouse", 0);
    					rLinkedREF.SetVariable("bGetOut", 0);
    				}
    			}
    		}
    	}
    }


    // The linked actor's script manually triggers this activator when it's done initializing its variables.

    OnTriggerEnter::PlayerREF {
    	rStorePackage = rLinkedREF.GetVariable("rStorePackage");
    	rStoreCell = rLinkedREF.GetVariable("rStoreCell");
    	rStoreDoorREF = rLinkedREF.GetVariable("rStoreDoorREF");

    	rHousePackage = rLinkedREF.GetVariable("rHousePackage");
    	rHouseCell = rLinkedREF.GetVariable("rHouseCell");
    	rHouseDoorREF = rLinkedREF.GetVariable("rHouseDoorREF");

    	rKey = rLinkedREF.GetVariable("rKey");
    	
    	if (!rLinkedREF.GetInCell(rStoreCell)) {
    		rLinkedREF.SetVariable("bLockedStore", 1);
    		SetPublic(rStoreCell, 0);
    	} else {
    		rStoreDoorREF.Unlock();
    		SetPublic(rStoreCell, 1);
    	}

    	if (!rLinkedREF.GetInCell(rHouseCell)) {
    		rLinkedREF.SetVariable("bLockedHouse", 1);
    		SetPublic(rHouseCell, 0);
    	} else {
    		rHouseDoorREF.Unlock();
    		SetPublic(rHouseCell, 1);
    	}

    	bInit = 1;
    }
