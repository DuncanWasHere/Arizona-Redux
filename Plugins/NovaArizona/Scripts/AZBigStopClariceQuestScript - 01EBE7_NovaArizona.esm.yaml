  SourceCode: >-
    scn AZBigStopClariceQuestScript


    short doonce


    short bClariceAutotalk


    short bDonated


    short bDonatedGun

    short bDonatedSupplies

    short bDonatedAll

    short bPostSteffie


    short bPaidSteffieAgain

    short bKnowSteffieRobbed

    short bSteffieMoneyBack


    short bRaiderSteffieAutotalk


    short bPostSteffieTravel



    begin gamemode


    if GetStageDone AZDamNQuest2 22 == 1  || GetStageDone AZDamNQuest2 45 == 1
        if GetObjectiveDisplayed AZBigStopClariceQuest 1 ==1
            if GetStageDone AZBigStopClariceQuest 5 ==0
                SetStage AZBigStopClariceQuest 10
    			AZBigStopClariceREF.disable
            endif
        endif

    	if bPostSteffie ==1
    		if bDonatedGun ==1
    			AZRaiderSteffieREF.enable
    		elseif bDonatedSupplies ==1
    			AZMOSteffieREF.enable
    		elseif bDonatedAll ==1
    			AZ188SteffieREF.enable
    		endif

    		set bPostSteffie to 2
    	endif
    endif


    END
