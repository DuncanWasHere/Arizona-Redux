  SourceCode: >-
    scn AZHavenDocScript


    int	DoOnce								;Script blocker

    float	Timer									;Timer used for animation control

    int iHealed									;toggled when player healed to change greetings.



    BEGIN OnDeath


    SetEnemy PlayerFaction AZHavenFaction


    END



    BEGIN GameMode


    ;When Set to 1, plays medical animations for eight seconds then restarts conversation with the player

    if ( GetAV Variable01 == 1 )
    	if ( DoOnce == 0 )
    		SetRestrained 1
    		DisablePlayerControls
    		SayTo player VFreeformMcCarranDoctorKempTopic001
    		Set Timer to 8
    		Set DoOnce to 1
    		PlayIdle LooseDoctorHealPlayer
    	endif

    	Set Timer to ( Timer - GetSecondsPassed )

    	if ( Timer <= 6 ) && ( DoOnce == 1 )
    		IMod FadeToBlackISFX
    		Set DoOnce to 2
    	endif

    	if ( Timer <= 0 ) &&  ( IsImagespaceActive FadeToBlackISFX == 0 )
    		SetStage VDoctors 10
    		SetRestrained 0
    		EnablePlayerControls
    		SetAv Variable01 0 
    		;resetai
    		Set DoOnce to 0
    		Set iHealed to 1
    		StartConversation player VFreeformMcCarranDoctorKempTopic001
    	endif
    ;When Set to 1, plays medical animations for eight seconds then restarts conversation with the player

    elseif ( GetAV Variable01 == 2 )
    	if ( DoOnce== 0 )
    		SetRestrained 1
    		DisablePlayerControls
    		Set Timer to 8
    		Set DoOnce to 1
    		PlayIdle LooseDoctorHealPlayer
    	endif

    	Set Timer to ( Timer - GetSecondsPassed )

    	if ( Timer <= 6 ) && ( DoOnce == 1 )
    		IMod FadeToBlackISFX
    		Set DoOnce to 2
    	endif

    	if ( Timer <= 0 ) && ( IsImagespaceActive FadeToBlackISFX == 0 )
    		SetStage VDoctors 20
    		SetRestrained 0
    		EnablePlayerControls
    		SetAv Variable01 0
    		;resetai
    		Set DoOnce to 0
    		Set iHealed to 1
    		StartConversation player VFreeformMcCarranDoctorKempTopic001
    	endif
    elseif ( GetAV Variable01 == 3 )
    	if ( DoOnce== 0 )
    		SetRestrained 1
    		DisablePlayerControls
    		Set Timer to 8
    		Set DoOnce to 1
    		PlayIdle LooseDoctorHealPlayer
    	endif

    	Set Timer to ( Timer - GetSecondsPassed )

    	if ( Timer <= 6 ) && ( DoOnce == 1 )
    		IMod FadeToBlackISFX
    		Set DoOnce to 2
    	endif

    	if ( Timer <= 0 ) && ( IsImagespaceActive FadeToBlackISFX == 0 )
    		SetStage VDoctors 30
    		SetRestrained 0
    		EnablePlayerControls
    		SetAv Variable01 0
    		;resetai
    		Set DoOnce to 0
    		Set iHealed to 1
    		StartConversation player VFreeformMcCarranDoctorKempTopic001
    	endif
    endif


    END
