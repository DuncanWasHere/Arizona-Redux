  CompiledScript: 
  SourceCode: >+
    name AZVideoQuestScript;


    // Credit to C6 for the original script this is based on


    // =====================

    // State Control Variables

    // =====================

    int bSpacePressed;

    int bPlaying;

    int bInitialized;

    int iCount;


    // =====================

    // External Configuration

    // =====================

    string sVideoFolder;        // Folder path of current video (set externally)

    int iMaxFrameCount;         // Total number of frames (set externally)

    int bShouldLoop;            // 1 = loop, 0 = stop after last frame (set externally)

    int bPlaySound;             // 1 = play sound, 0 = no sound (set externally)

    ref rVideoSoundForm;        // Sound form reference to play for this video (set externally)


    // =====================

    // Internal Temp Vars

    // =====================

    string sFileName;

    string sText;


    Gamemode {
        if (GetGameRestarted()) {
            bPlaying = 0;
            bInitialized = 0;
            bSpacePressed = 0;
            iCount = 1;
            bShouldLoop = 0;
            bPlaySound = 0;

            SetUIFloat("ComputersMenu/computers_depth_rect/visible", 1);
            SetUIFloat("ComputersMenu/doomMainRect/visible", 0);
            SetOnMenuCloseEventHandler(AZVideoOnMenuCloseUDF, 1, 1057);
        }
    }


    MenuMode::1057 {
        if (bPlaying) {

            // =====================
            // Initialization
            // =====================
            if (!bInitialized) {
                SetOnKeyDownEventHandler(AZVideoKeyPressUDF, 1, 57);
                SetUIFloat("ComputersMenu/computers_depth_rect/visible", 0);
                SetUIFloat("ComputersMenu/doomMainRect/visible", 1);
                bInitialized = 1;
                iCount = 1;
                print($sVideoFolder);

                if (rVideoSoundForm && bPlaySound) {
                    PlaySound(rVideoSoundForm, 1);
                }
            }

            // =====================
            // Space Pressed = Stop Playback
            // =====================
            if (bSpacePressed) {
                SetOnKeyDownEventHandler(AZVideoKeyPressUDF, 0, 57);
                SetUIFloat("ComputersMenu/computers_depth_rect/visible", 1);
                SetUIFloat("ComputersMenu/doomMainRect/visible", 0);
                bPlaying = 0;
                bSpacePressed = 0;
                bInitialized = 0;
                iCount = 1;
                bShouldLoop = 0;
                bPlaySound = 0;

                if (rVideoSoundForm) {
                    StopSound(rVideoSoundForm);
                }
            }

            // =====================
            // Frame Logic
            // =====================
            if (iCount >= iMaxFrameCount) {
                if (bShouldLoop) {
                    iCount = 1;
                } else {
                    bSpacePressed = 1;
                }
            }

            // =====================
            // Filename
            // =====================
            if (iCount < 10) {
                sFileName = ($sVideoFolder + "ASCII-thumb000" + $iCount + ".txt");
            } else if ((iCount >= 10) && (iCount < 100)) {
                sFileName = ($sVideoFolder + "ASCII-thumb00" + $iCount + ".txt");
            } else if ((iCount >= 100) && (iCount < 1000)) {
                sFileName = ($sVideoFolder + "ASCII-thumb0" + $iCount + ".txt");
            } else {
                sFileName = ($sVideoFolder + "ASCII-thumb" + $iCount + ".txt");
            }

            print(ReadStringFromFile($sFileName));
            SetUIStringAlt("ComputersMenu/doomMainRect/mainText/string", ReadStringFromFile($sFileName));
            iCount = (iCount + 1);
        }
    }
