  CompiledScript: 
  SourceCode: >-
    name AZChlorideAristophontesScript;


    // Door Locking Stuff

    int bInit;


    int bLocked;

    int bGetOut;


    ref rPackage;

    ref rCell;

    ref rDoorREF;


    ref rKey;


    GameMode {
        // Door Locking Stuff
        if (bInit) {
            ref rCurrentPackage = GetCurrentStablePackage();

            if (rCurrentPackage == rPackage) {
                // Have actor try to kick player out if they need to leave.
                if (GameHour >= 6 && GameHour < 18 && !bGetOut) {
                    SetPublic(rCell, 0);
                    bGetOut = 1;
                }
            }
        }
    }


    OnDeath {
        if (!GetQuestCompleted(AZArizonaOpenSeason)) {
            AddItem(AZScalpAristophontes, 1);
        }
    }


    // This is only triggered by the door locking activator during initialization.

    OnTriggerEnter::AZChlorideActivatorAristophontesDoorLockerREF {
        rPackage = AZChlorideAristophontesHousePackage;
        rCell = AZChlorideAristophontesHouseINT;
        rDoorREF = AZChlorideAristophontesHouseDoorREF;

        rKey = AZKeyChlorideAristophontes;

        bInit = 1;

        AZChlorideActivatorAristophontesDoorLockerREF.EnterTrigger(PlayerREF);
    }
