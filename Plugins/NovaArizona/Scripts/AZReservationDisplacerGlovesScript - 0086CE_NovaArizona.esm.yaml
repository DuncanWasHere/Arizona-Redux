  SourceCode: >+
    name AZReservationDisplacerGlovesScript;


    OnAdd::Player {
        if (!AZBaseCampReservationQuest.iGlovesStolen) {
            if (AZBaseCampBethREF.GetDetected(Player)) {
                SetStage(AZBaseCampReservationQuest, 255);
                AZBaseCampBethREF.StartCombat(Player);
            }
            SetStage(AZBaseCampReservationQuest, 10);
            AZBaseCampReservationQuest.iGlovesStolen = 1;
        }
    }
