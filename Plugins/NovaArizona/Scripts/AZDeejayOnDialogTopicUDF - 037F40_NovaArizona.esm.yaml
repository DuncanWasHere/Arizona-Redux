  SourceCode: >-
    scn AZDeejayOnDialogTopicUDF



    ref    rTopicOrInfo

    ref    rSpeaker


    begin Function {rTopicOrInfo}
    	If AZDeejayREF.bCurrentlyHired != 1
    		Return

    	elseif (rTopicOrInfo == AZMalpaisNoctisQuestTopic04a)
    		AZDeejayREF.startconversation player AZDeejayTopicTrustNoctis01

    	elseif (rTopicOrInfo == AZMidwestTowerDecanusSharptooth02)
    		AZDeejayREF.say AZDeejayTopicTrustSharptooth

    	elseif (rTopicOrInfo == AZHavenMurrayConfrontTopic08a)
    		AZDeejayREF.startconversation player AZDeejayTopicTrustHaven01

    	elseif (rTopicOrInfo == AndersFree)
    		AZDeejayREF.say AZDeejayTopicTrustAnders

    	endif

    end
