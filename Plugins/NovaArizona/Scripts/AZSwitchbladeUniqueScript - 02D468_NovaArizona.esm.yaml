  CompiledScript: 
  SourceCode: >-
    scn AZSwitchbladeUniqueScript


    ; This script controls the bonus Agility effect of the unique switchblade


    Short bEquipped


    BEGIN OnSell Player

    	Player.RemoveSpell AZActorEffectSwitchbladeUnique
    	Set bEquipped to 0

    END



    BEGIN GameMode

    	If bEquipped == 0
    		If (Player.GetEquipped AZWeapSwitchbladeUnique == 1)
    			Player.AddSpell AZActorEffectSwitchbladeUnique
    			Set bEquipped to 1
    		EndIf
    	Else
    		If (Player.GetEquipped AZWeapSwitchbladeUnique == 0)
    			Player.RemoveSpell AZActorEffectSwitchbladeUnique
    			Set bEquipped to 0
    		EndIf
    	EndIf

    END
