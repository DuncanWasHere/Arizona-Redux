  CompiledScript: 
  SourceCode: >-
    name AZBarkerScript;


    OnDeath {
        AZMalpaisBountyQuest.iBarkerDead = 1;
        AZSUHBarkerREF.AddItem(AZBarkerCaveNote, 1);

        if (!GetStageDone(AZMalpaisBountyQuest, 255)) {
            if (IsLimbGone(1)) {
                AddItem(AZBarkerHeadMangled, 1);
            } else if (IsInCriticalStage(GooEnd) || IsInCriticalStage(DisintegrateEnd)) {
                AddItem(AZBarkerHeadMangled, 1);
            } else {
                AddItem(AZBarkerHead, 1);
            }
        }

        if (GetObjectiveDisplayed(AZMalpaisBountyQuest, 42)) {
            SetObjectiveDisplayed(AZMalpaisBountyQuest, 42, 0);
        }
    }
