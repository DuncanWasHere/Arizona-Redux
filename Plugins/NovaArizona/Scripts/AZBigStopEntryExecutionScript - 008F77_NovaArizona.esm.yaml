  CompiledScript: 
  SourceCode: >+
    name AZBigStopEntryExecutionScript;


    int doonce;


    OnTriggerEnter::Player {
        if (!doonce) {
            AZBigStopEntryExecutionQuest.livefire = 1;

            AZBigStopLegionExecutioner01Ref.EVP();
            AZBigStopLegionExecutioner02Ref.EVP();
            AZBigStopLegionExecutioner03Ref.EVP();
            AZBigStopLegionExecutioner04Ref.EVP();

            AZBigStopEntryExecutionQuest.deadfired = 1;

            AZBigStopLegionExecutioner01Ref.EVP();
            AZBigStopLegionExecutioner02Ref.EVP();
            AZBigStopLegionExecutioner03Ref.EVP();
            AZBigStopLegionExecutioner04Ref.EVP();

            if (GetStage(AZMalpaisJournalistQuest) == 70) {
                AZStanleyHartfordREF.Say(AZMalpaisStanleyBigStopTopicReact);
            }

            doonce = 1;
        } else {
            if (GetStage(AZMalpaisJournalistQuest) == 70) {
                AZStanleyHartfordREF.Say(AZMalpaisStanleyBigStopTopicReact);
            }
        }
    }
