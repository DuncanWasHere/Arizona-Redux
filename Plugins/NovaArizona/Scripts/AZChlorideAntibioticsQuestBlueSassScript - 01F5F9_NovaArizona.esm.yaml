  SourceCode: >+
    name AZChlorideAntibioticsQuestBlueSassScript;


    OnAdd::Player {
        if (GetObjectiveDisplayed(AZChlorideAntibioticsQuest, 0) && !GetObjectiveCompleted(AZChlorideAntibioticsQuest, 5)) {

            SetObjectiveCompleted(AZChlorideAntibioticsQuest, 0, 1);
            SetObjectiveCompleted(AZChlorideAntibioticsQuest, 5, 1);
            SetObjectiveDisplayed(AZChlorideAntibioticsQuest, 14, 1);
        }
    }


    OnDrop::Player {
        if (GetObjectiveCompleted(AZChlorideAntibioticsQuest, 5)) {
            if (!player.GetItemCount(AZBlueSassBottle)) {
                SetObjectiveCompleted(AZChlorideAntibioticsQuest, 5, 0);
                SetObjectiveDisplayed(AZChlorideAntibioticsQuest, 5, 0);
                SetObjectiveDisplayed(AZChlorideAntibioticsQuest, 5, 1);

                if (!player.GetItemCount(AZChlorideAntibioticsItem)) {
                    SetObjectiveDisplayed(AZChlorideAntibioticsQuest, 14, 0);
                    SetObjectiveCompleted(AZChlorideAntibioticsQuest, 0, 0);
                    SetObjectiveDisplayed(AZChlorideAntibioticsQuest, 0, 0);
                    SetObjectiveDisplayed(AZChlorideAntibioticsQuest, 0, 1);
                }
            }
        }
    }
