  SourceCode: >-
    name AZMalpaisAdjutantTriggerScript;


    int AdjutantForceGreet;


    OnTriggerEnter::Player {
    	AZMalpaisAdjutantREF.SetUnconscious(0);

    	if (GetObjectiveDisplayed(AZMalpaisAbuserQuest, 59) == 1 && AZMalpaisAdjutantREF.IsInCombat() == 0) {
    		if (AdjutantForceGreet == 0) {
    			AZMalpaisAdjutantREF.RestoreAV(Fatigue, 1000);
    			AdjutantForceGreet = 1;
    		}

    		AZMalpaisAdjutantREF.RemoveScriptPackage(AZLegatusAdjutantGuardPackage);
    		AZMalpaisAdjutantREF.Evp();
    		AZMalpaisAdjutantREF.RemoveFromFaction(VCaesarsLegionFaction);
    		AZMalpaisAdjutantREF.RemoveFromFaction(ArmorVCaesarsLegionFaction);

    		if (GetObjectiveDisplayed(AZMalpaisAbuserQuest, 56) == 1 && GetObjectiveCompleted(AZMalpaisAbuserQuest, 56) == 0) {
    			SetObjectiveDisplayed(AZMalpaisAbuserQuest, 56, 0);
    		}

    		if (GetObjectiveDisplayed(AZMalpaisAbuserQuest, 57) == 1 && GetObjectiveCompleted(AZMalpaisAbuserQuest, 57) == 0) {
    			SetObjectiveDisplayed(AZMalpaisAbuserQuest, 57, 0);
    		}
    	}
    }
