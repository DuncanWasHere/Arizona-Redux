  CompiledScript: 
  SourceCode: >-
    name AZSteffieGiveFoodQuestScript;


    int bFoodFound;

    int iListIndex;

    int iListIndexMax;


    ref rFormToRemove;


    GameMode {
        if (PlayerREF.GetItemCount(NVDLC03PerkRelatedAllFoodLIST)) {
            iListIndexMax = ListGetCount(NVDLC03PerkRelatedAllFoodLIST) - 1;
            bFoodFound = 0;

            while (!bFoodFound) {
                iListIndex = Rand(0, iListIndexMax);
                rFormToRemove = ListGetNthForm(NVDLC03PerkRelatedAllFoodLIST, iListIndex);

                if (PlayerREF.GetItemCount(rFormToRemove)) {
                    PlayerREF.RemoveItem(rFormToRemove, 1);
                    bFoodFound = 1;
                }
            }
        }

        StopQuest(AZSteffieGiveFoodQuest);
    }
