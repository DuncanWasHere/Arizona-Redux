  CompiledScript: 
  SourceCode: >+
    name AZHeadBarkerScript;


    OnAdd::Player {
        // Explode Barker's head
        AZSUHBarkerREF.Kill(player, 1);

        if (GetObjectiveDisplayed(AZMalpaisBountyQuest, 40) == 1) {
            SetObjectiveCompleted(AZMalpaisBountyQuest, 40, 1);
            SetObjectiveDisplayed(AZMalpaisBountyQuest, 40, 1);
        } else if (GetObjectiveDisplayed(AZMalpaisBountyQuest, 41) == 1) {
            SetObjectiveCompleted(AZMalpaisBountyQuest, 41, 1);
            SetObjectiveDisplayed(AZMalpaisBountyQuest, 45, 1);
        }

        if (GetStageDone(AZMalpaisBountyQuest, 255) == 0) {
            if (IsLimbGone(1)) {
                AddItem(AZBarkerHeadMangled, 1);
            } else if (IsInCriticalStage(GooEnd) || IsInCriticalStage(DisintegrateEnd)) {
                AddItem(AZBarkerHeadMangled, 1);
            } else {
                AddItem(AZBarkerHead, 1);
            }
        }
    }
