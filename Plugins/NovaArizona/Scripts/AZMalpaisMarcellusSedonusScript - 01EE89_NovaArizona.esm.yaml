  CompiledScript: 
  SourceCode: >-
    name AZMalpaisMarcellusSedonusScript;


    OnDeath {
        if (!GetQuestCompleted(AZArizonaOpenSeason)) {
            AddItem(AZScalpMarcellusSedonus, 1);
        }

        if (AZMalpaisSedonusSunsetSasparillaREF.SasSpiked == 1) {
            AZMalpaisAbuseQuest.MarcellusSedonusPoisoned = 1;
        }

        AZMalpaisAbuseQuest.MalpaisCooldown = GetGameDaysPassed();
        StartQuest(AZSedonusKillQuest);

        if (GetStage(AZMalpaisAbuseQuest) == 50) {
            if (GetPCDetectionState() > 0) {
                if (!AZMalpaisAbuseQuest.MarcellusSedonusPoisoned) {
                    SetStage(VMQCaesarFail, 5);
                    AddReputationExact(RepNVCaesarsLegion, 0, 100);

                    SetEnemy(AZMalpaisLegionFaction, PlayerFaction);
                    SetEnemy(AZMalpaisAdjutantFaction, PlayerFaction);
                    SetEnemy(AZMalpaisLegionFaction, AZSedonusSlaveFaction);
                } else if (AZMalpaisAbuseQuest.MarcellusSedonusPoisoned == 1) {
                    SetStage(AZMalpaisAbuseQuest, 100);
                    AZMalpaisAbuseQuest.MalpaisCooldown = GetGameDaysPassed();
                }
            } else if (!GetPCDetectionState()) {
                SetEnemy(AZMalpaisLegionFaction, PlayerFaction);
                SetEnemy(AZMalpaisAdjutantFaction, PlayerFaction);
                SetEnemy(AZMalpaisLegionFaction, AZSedonusSlaveFaction);

                if (GetStage(AZMalpaisAbuseQuest) == 50) {
                    SetStage(AZMalpaisAbuseQuest, 100);
                }
            }
        } else if (GetStage(AZMalpaisAbuseQuest) != 50) {
            if (!GetPCDetectionState()) {
                SetStage(VMQCaesarFail, 1);

                SetEnemy(AZMalpaisLegionFaction, PlayerFaction);
                SetEnemy(AZMalpaisAdjutantFaction, PlayerFaction);
                SetEnemy(AZMalpaisLegionFaction, AZSedonusSlaveFaction);
            } else if (GetPCDetectionState() > 0) {
                SetStage(VMQCaesarFail, 5);

                SetEnemy(AZMalpaisLegionFaction, PlayerFaction);
                SetEnemy(AZMalpaisAdjutantFaction, PlayerFaction);
                SetEnemy(AZMalpaisLegionFaction, AZSedonusSlaveFaction);
            }
        }

        if (GetObjectiveDisplayed(AZMalpaisAbuseQuest, 51) && GetObjectiveCompleted(AZMalpaisAbuseQuest, 51)) {
            SetObjectiveDisplayed(AZMalpaisAbuseQuest, 51, 0);
        }

        if (!GetQuestCompleted(AZMalpaisAbuserQuest)) {
            SetStage(AZMalpaisAbuserQuest, 255);
        }
    }
