Fields:
  MetadataSummary:
    RefCount: 2
    VariableCount: 2
    Enabled: 1
  CompiledScript: 
  SourceCode: >-
    scn AZBigStopAutonousScript


    short DeathAnim

    float DeathTimer



    BEGIN GameMode


    if DeathAnim == 1
    	Set DeathTimer to 3
    	Set DeathAnim to 2
    elseif DeathAnim == 2
    	if DeathTimer < 0
    		SetStage AZstatioFindFriendQuest 55
    		Kill
    		Set DeathAnim to -1
    	else
    		Set DeathTimer to (DeathTimer - GetSecondsPassed)
    	endif
    endif


    END



    BEGIN OnDeath


    Set AZStatioFindFriendQuest.AutonousStatus to 2

    SetStage AZStatioFindFriendQuest 55


    END



    BEGIN OnDeath Player


    Set AZStatioFindFriendQuest.AutonousStatus to 2

    Set AZStatioFindFriendQuest.AutonousSuicide to 2

    SetStage AZStatioFindFriendQuest 55


    END
