  CompiledScript: 
  SourceCode: >+
    name AZDominicusRexScript;


    OnStartCombat::Player {
        SetEnemy(PlayerFaction, AZBigStopLegionFaction);

        if (!GetQuestCompleted(AZSMARTArrayQuest)) {
            FailQuest(AZSMARTArrayQuest);
        }

        if (!GetQuestCompleted(AZBigStopAhigaQuest01)) {
            SetStage(AZBigStopAhigaQuest01, 255);
        }

        if (!GetQuestCompleted(AZBigStopAugustQuest)) {
            SetStage(AZBigStopAugustQuest, 255);
        }

        if (!GetQuestCompleted(AZMalpaisJournalistQuest)) {
            SetStage(AZMalpaisJournalistQuest, 150);
        }
    }


    OnDeath {
        if (!GetQuestCompleted(AZArizonaOpenSeason)) {
            AddItem(AZScalpDominicusRex, 1);
        }

        if (!AZBSStenographusREF.GetDisabled()) {
            SetStage(AZMalpaisJournalistQuest, 150);
            AZBigStopDominicusRexREF.AddItem(WeapNVMachete, 1);
            AZBSTentGuardREF.MoveTo(AZTentGuardMoveREF);
            EnableFastTravel(1);
        }

        if (!GetQuestCompleted(AZSMARTArrayQuest)) {
            FailQuest(AZSMARTArrayQuest);
        }

        if (!GetQuestCompleted(AZBigStopAhigaQuest01)) {
            SetStage(AZBigStopAhigaQuest01, 255);
        }

        if (!GetQuestCompleted(AZBigStopAugustQuest)) {
            SetStage(AZBigStopAugustQuest, 255);
        }

        if (!GetQuestCompleted(AZMalpaisJournalistQuest)) {
            SetStage(AZMalpaisJournalistQuest, 150);
        }

        AddReputationExact(RepNVCaesarsLegion, 0, 12);
    }
