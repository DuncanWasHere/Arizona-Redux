  CompiledScript: 
  SourceCode: >-
    scn AZZekeIndenturedServantTimerQuestScript


    float Timer

    int ZekeAway

    int DoOnce


    BEGIN GameMode


    if DoOnce == 0
    	Set ZekeAway to GetGameDaysPassed
    	AZDolanSpringsZekeREF.evp
    	Set DoOnce to 1
    elseif DoOnce == 1
    	if Timer < ZekeAway + 7
    		Timer = GetGameDaysPassed
    	else
    		Set AZChlorideTaxQuest.ZekeIndenturedServant to 4
    		AZDolanSpringsZekeREF.evp
    		Set DoOnce to 2
    	endif
    elseif DoOnce == 2
    	AZZekeChlorideWorkMarker01REF.disable
    	AZZekeChlorideWorkMarker02REF.disable
    	StopQuest AZZekeIndenturedServantTimerQuest
    endif


    if AZDolanSpringsZekeREF.GetDead == 1
    	StopQuest AZZekeIndenturedServantTimerQuest
    	AZZekeChlorideWorkMarker01REF.disable
    	AZZekeChlorideWorkMarker02REF.disable
    endif


    END
