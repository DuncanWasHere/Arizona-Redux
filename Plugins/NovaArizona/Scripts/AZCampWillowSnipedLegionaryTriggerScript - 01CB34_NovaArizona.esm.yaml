  CompiledScript: 
  SourceCode: >-
    name AZCampWillowSnipedLegionaryTriggerScript;


    int iSequenceCounter;

    float fTimer;


    OnTrigger::PlayerREF {
        if (GetStage(AZCampWillowRangerStationQuest) == 50 || GetStage(AZCampWillowRangerStationQuest) == 70) {
            if (!iSequenceCounter) {
                DisablePlayerControls();
                AZCampWillowSnipedLegionary01REF.Enable(0);
                AZCampWillowSnipedLegionary02REF.Enable(0);
                PlayerREF.SendAssaultAlarm(AZCampWillowSnipedLegionary01REF);
                PlayerREF.SendAssaultAlarm(AZCampWillowSnipedLegionary02REF);
                iSequenceCounter = 1;
            }
        }
    }


    GameMode {
        if (GetStage(AZCampWillowRangerStationQuest) == 50 || GetStage(AZCampWillowRangerStationQuest) == 70) {
            if (iSequenceCounter) {
                fTimer += GetSecondsPassed();

                if (iSequenceCounter == 1 && fTimer > 2) {
                    AZCampWillowSnipedLegionary01REF.KillActor(AZRSDeltaGarcettiREF, 1, 2);
                    AZCampWillowGarcettiSniperSoundMarkerREF.PlaySound3D(WPNRifleSniperFire3DDIST);
                    iSequenceCounter = 2;

                } else if (iSequenceCounter == 2 && fTimer > 4) {
                    AZCampWillowSnipedLegionary02REF.KillActor(AZRSDeltaGarcettiREF, 1, 2);
                    AZCampWillowGarcettiSniperSoundMarkerREF.PlaySound3D(WPNRifleSniperFire3DDIST);
                    iSequenceCounter = 3;

                } else if (iSequenceCounter == 3) {
                    EnablePlayerControls();
                    Disable();
                }
            }
        }
    }
