  CompiledScript: 
  SourceCode: >+
    name AZHooverDamReservationGlovesScript;


    GameMode {
    	if (vHDBattleController.iBattleState > 0) {
    		if (AZBaseCampReservationQuest.iGlovesBought == 1) {
    			AZCenturionDisplacerGloveMarkerREF.Enable();
    		}

    		if (AZBaseCampReservationQuest.iGlovesBought == 2) {
    			AZCenturionDisplacerGloveMarkerREF.Enable();
    			AZHDCenturionDisplacerGlove04REF.Enable();
    			AZHDCenturionDisplacerGlove01REF.ModAv(Unarmed, 100);
    			AZHDCenturionDisplacerGlove02REF.ModAv(Unarmed, 100);
    			AZHDCenturionDisplacerGlove03REF.ModAv(Unarmed, 100);
    		}
    	}
    }
