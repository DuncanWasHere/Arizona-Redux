  CompiledScript: 
  SourceCode: >-
    scn AZBaseCampRomanceQuestScript


    short DoOnce1

    short DoOnce2

    float iTimer


    short bitchmouth


    short askedFlemusAboutArceus

    short askedArceusAboutFlemus


    short IuliaRevealedSuspicions


    short SecretIsOut


    short toldAboutCorella


    short reassignedMentioned

    short killherMentioned


    short IuliaWantsCaps

    short IuliaWantsDenarius


    short reassignmentChosen

    short beatingChosen


    short IuliaIsGettingBeaten


    short beatingAftermathDialogue


    short IuliaWasKilledByArceus

    short ArceusWasReassignedForTheft

    short ArceusWasReassignedAsFavor

    short IuliaSnitchedOnThem


    short youDealtWithIulia

    short youKilledIulia

    short youWillSnitch


    short ArceusIsLeaving


    short ArceusReassignmentTimer

    short ArceusPunishmentTimer

    short PunishmentDelivered


    begin gamemode


    if getstage AZBaseCampRomanceQuest < 40
    	if player.gethasnote AZBaseCampArceusLetter
    	setstage AZBaseCampRomanceQuest 40
    endif

    endif


    if ArceusReassignmentTimer == 1 && DoOnce1 == 0
    		Set DoOnce1 to 1
    		Set ArceusReassignmentTimer to GetGameDaysPassed
    	endif
    	
    	if GetStage AZBaseCampRomanceQuest == 160
    		if iTimer < ArceusReassignmentTimer + 1 && DoOnce1 == 1
    			iTimer = GetGameDaysPassed
    		else
    			Set DoOnce1 to 2
    			SetStage AZBaseCampRomanceQuest 165
    		endif
    	endif


    if ArceusPunishmentTimer == 1 && DoOnce2 == 0
    		Set DoOnce2 to 1
    		Set ArceusPunishmentTimer to GetGameDaysPassed
    	endif
    	
    	if GetStage AZBaseCampRomanceQuest == 190
    	if iTimer < ArceusPunishmentTimer + 1 && DoOnce2 == 1
    			iTimer = GetGameDaysPassed
    		else
    			Set DoOnce2 to 2
    			Set PunishmentDelivered to 1
    			AZBaseCampArceusREF.disable
    			AZBaseCampFlemusREF.disable
    			AZBaseCampIuliaREF.disable
    		endif
    		endif

    end
