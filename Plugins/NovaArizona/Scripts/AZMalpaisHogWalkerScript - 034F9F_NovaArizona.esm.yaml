  CompiledScript: 
  SourceCode: >+
    name AZMalpaisHogWalkerScript;


    float fTimer;


    GameMode {
        if (AZMalpaisSniperQuest.iStoryTimeFadedToBlack) {
            if (!fTimer) {
                ToggleHardcoreTracking(0);

                float fSkipTime = (GetCurrentTime() + 6.0) % 24.0;

                SetGameHour(fSkipTime);
                DisablePlayerControls();
            }

            if (fTimer < 4) {
                fTimer += GetSecondsPassed();
            } else {
                EnablePlayerControls();
                ToggleHardcoreTracking(1);

                AZMalpaisSniperQuest.iStoryTimeFadedToBlack = 2;
                AZMalpaisHogWalkerREF.EVP();
            }
        }
    }
