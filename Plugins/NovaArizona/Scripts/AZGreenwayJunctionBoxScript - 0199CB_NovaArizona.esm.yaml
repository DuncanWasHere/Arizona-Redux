  CompiledScript: 
  SourceCode: >-
    name AZGreenwayJunctionBoxScript;


    int DoOnce;

    int iJBButton;                // Tracks the button presses for the junction box repair menus 

    int iMenu;                     // Tracks the current menu screen: 1 == Science, 2 == Repair, 3 == Parts

    int iJunctionBoxRepaired;


    // GreenwayRepair00 - Intro Message

    // GreenwayRepair01 - Science Check

    // GreenwayRepair02 - Repair Check

    // GreenwayRepair03 - Parts Check


    OnActivate::Player {
        if (IsActionRef(Player)) {
            if (Player.IsInCombat() && GetStage(AZGreenwayWindFarmQuest) == 10) {
                ShowMessage(AZGreenwayCombatMessage);
            }
            if (!iJunctionBoxRepaired && GetStage(AZGreenwayWindFarmQuest) == 10) {
                ShowMessage(AZGreenwayRepair00Message);
            }
            if (iJunctionBoxRepaired) {
                ShowMessage(AZGreenwayRepairCompleteMessage);
            }
        }
    }


    OnActivate {
        if (IsActionRef(Player) && GetStage(AZGreenwayWindFarmQuest) == 10) {
            if (Player.IsInCombat()) {
                ShowMessage(AZGreenwayCombatMessage);
            } else {
                ShowMessage(AZGreenwayRepair01Message);
            }
        }

        if (iJBButton == 0 && iJunctionBoxRepaired) {
            Return;
        }

        if (iJBButton == 0 && !iJunctionBoxRepaired) {
            iMenu = 0;
        }
    }


    GameMode {
        iJBButton = GetButtonPressed();

        if (iMenu == 0 && !iJunctionBoxRepaired) {
            if (iJBButton == 1) {
                ShowMessage(AZGreenwayRepair02Message);
                iMenu = 2;
            }
            if (iJBButton == 2) {
                ShowMessage(AZGreenwayRepair01Message);
                iMenu = 1;
            }
            if (iJBButton == 3) {
                ShowMessage(AZGreenwayRepair03Message);
                iMenu = 3;
            }
        } else if (iMenu == 1 && !iJunctionBoxRepaired) {
            if (iJBButton == 0) {
                ShowMessage(AZGreenwayRepair00Message);
                iMenu = 0;
            }
            if (iJBButton == 1) {
                ShowMessage(AZGreenwayRepair03Message);
                iMenu = 3;
            }
            if (iJBButton == 2) {
                iJunctionBoxRepaired = 1;
                SetStage(AZGreenwayWindFarmQuest, 25);
                ShowMap(AZMountTiptonPowerStationMarkerREF);
            }
            if (iJBButton == 3) {
                ShowMessage(AZGreenwayRepair02Message);
                iMenu = 2;
            }
        } else if (iMenu == 2 && !iJunctionBoxRepaired) {
            if (iJBButton == 0) {
                ShowMessage(AZGreenwayRepair00Message);
                iMenu = 0;
            }
            if (iJBButton == 1) {
                iJunctionBoxRepaired = 1;
                SetStage(AZGreenwayWindFarmQuest, 25);
                ShowMap(AZMountTiptonPowerStationMarkerREF);
            }
            if (iJBButton == 2) {
                ShowMessage(AZGreenwayRepair03Message);
                iMenu = 3;
            }
            if (iJBButton == 3) {
                ShowMessage(AZGreenwayRepair01Message);
                iMenu = 1;
            }
        } else if (iMenu == 3 && !iJunctionBoxRepaired) {
            if (iJBButton == 0) {
                ShowMessage(AZGreenwayRepair00Message);
                iMenu = 0;
            }
            if (iJBButton == 1) {
                SetStage(AZGreenwayWindFarmQuest, 25);
                ShowMap(AZMountTiptonPowerStationMarkerREF);
                iJunctionBoxRepaired = 1;

                Player.RemoveItem(Conductor, 1);
                Player.RemoveItem(DuctTape, 4);
                Player.RemoveItem(FissionBattery, 2);
                Player.RemoveItem(SensorModule, 2);
                Player.RemoveItem(ScrapElectronics, 6);
                Player.RemoveItem(SpareParts, 6);
            }
            if (iJBButton == 2) {
                ShowMessage(AZGreenwayRepair01Message);
                iMenu = 1;
            }
            if (iJBButton == 3) {
                ShowMessage(AZGreenwayRepair02Message);
                iMenu = 2;
            }
        }
    }
