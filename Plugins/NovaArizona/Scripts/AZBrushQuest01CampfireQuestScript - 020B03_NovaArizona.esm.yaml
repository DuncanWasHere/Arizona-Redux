  CompiledScript: 
  SourceCode: >+
    name AZBrushQuest01CampfireQuestScript;


    float FTimer;

    int BDoOnce;


    GameMode {
        if (GetStage(AZBrushQuest01CampfireQuest) == 1) {
            if (FTimer < 3) {
                FTimer += GetSecondsPassed();
            } else if (FTimer < 5) {
                FTimer += GetSecondsPassed();
                if (!BDoOnce) {
                    PlaySound(WPNDynamiteThrow);
                    BDoOnce = 1;
                }
            } else {
                SetStage(AZBrushQuest01CampfireQuest, 5);
            }
        }
    }
