    name AZActivatorLegionHitSquadSpawnerScript;


    // Script attached to Actor Zones (code boxes), from where to call variables, and events,

    // in the Faction Squad Master Script quest according to player position, distance to code box,

    // story-stage, etc.

    // - Jorge


    // Hi, Jorge. Got your message. Kindly fuck off and never write scripts again.

    // - Duncanwashere


    // Squad Positional Variables

    ref	rSelf;

    ref	rMark01;

    ref	rMark02;

    ref	rMark03;

    ref	rMark04;

    ref	rMark05;


    // Squad Actors Variables

    ref	rActor01;

    ref	rActor02;

    ref	rActor03;

    ref	rActor04;

    ref	rActor05;


    int	iSquad;


    // Operational Variables

    int	bSetup;

    int	bSpawn;			// To control the teleportation, and enabling/resurrection, of squad references (Actors).

    int	bCancel;		// To control the event of cancelling/removing squad's references (Actors) - unused.


    int	iState;			// Defines the states of the code box. That is, it governs what to run according to player position, squad chosen, order of operations, etc.

    int	iCount;			// To assist in segmenting tasks within the particular iState logic.


    float fDistance;	// Retrieves distance from Player actor to code box.

    float fEventDay;	// Retrieves time when squad spawns.

    float fTimer;		// To space operations in time, to prevent excessive toll on a given frame.


    OnLoad {
    	rSelf = GetSelf();
    	
    	if (rSelf.GetLinkedRef()) {
    		rMark01 = rSelf.GetLinkedRef();

    		if (rMark01.GetLinkedRef()) {
    			rMark02 = rMark01.GetLinkedRef();

    			if (rMark02.GetLinkedRef()) {
    				rMark03 = rMark02.GetLinkedRef();

    				if (rMark03.GetLinkedRef()) {
    					rMark04 = rMark03.GetLinkedRef();

    					if (rMark04.GetLinkedRef()) {
    						rMark05 = rMark04.GetLinkedRef();
    					}
    				}
    			}
    		}
    	}
    }


    OnTriggerEnter::PlayerREF {
    	Print("Hitsquad trigger activated");

    	if (VFactionSquad.bSquadCleanUp == 0) {
    		Print("iSquadOne: " + $VFactionSquad.iSquadOne);

    		if (VFactionSquad.iSquadOne < 3) {
    			VFactionSquad.iCount = 0;
    			VFactionSquad.bSquadChosen = 0;
    			return;
    		}

    		if (VFactionSquad.iSquadSpawns == 0) {
    		} else if (VFactionSquad.iSquadSpawns >= 1) {
    			VFactionSquadMarkerREF.MoveTo(rMark01);

    			rActor01 = VFactionSquadBox.rActor01;
    			rActor01.MoveTo(rMark01);

    			if (VFactionSquad.iSquadSpawns >= 2) {
    				rActor02 = VFactionSquadBox.rActor02;
    				rActor02.MoveTo(rMark02);

    				if (VFactionSquad.iSquadSpawns >= 3) {
    					rActor03 = VFactionSquadBox.rActor03;
    					rActor03.MoveTo(rMark03);

    					if (VFactionSquad.iSquadSpawns >= 4) {
    						rActor04 = VFactionSquadBox.rActor04;
    						rActor04.MoveTo(rMark04);

    						if (VFactionSquad.iSquadSpawns >= 5) {
    							rActor05 = VFactionSquadBox.rActor05;
    							rActor05.MoveTo(rMark05);
    						}
    					}
    				}
    			}
    		}

    		bSpawn = 1;
    		SetQuestDelay(VFactionSquad, 3);
    		return;
    	} else if (VFactionSquad.bSquadCleanUp == 1) {
    		rActor01.Disable();
    		rActor02.Disable();
    		rActor03.Disable();
    		rActor04.Disable();
    		rActor05.Disable();

    		SetQuestDelay(VFactionSquad, 3);

    		VFactionSquad.rBoxTwo = 0;
    		VFactionSquad.iSquadTwo = 0;
    		VFactionSquad.iSquadEnd = 0;
    		VFactionSquad.bSquadCleanUp = 0;

    		if (VFactionSquad.iSquadNumber >= 1) {
    			VFactionSquad.iSquadNumber = (VFactionSquad.iSquadNumber - 1);
    		}

    		iState = 0;
    	}
    }


    GameMode {
    	if (bSetup == 0) {
    		rSelf = GetSelf();

    		if (rSelf.GetLinkedRef() != 0) {
    			rMark01 = rSelf.GetLinkedRef();

    			if (rMark01.GetLinkedRef() != 0) {
    				rMark02 = rMark01.GetLinkedRef();

    				if (rMark02.GetLinkedRef() != 0) {
    					rMark03 = rMark02.GetLinkedRef();

    					if (rMark03.GetLinkedRef() != 0) {
    						rMark04 = rMark03.GetLinkedRef();

    						if (rMark04.GetLinkedRef() != 0) {
    							rMark05 = rMark04.GetLinkedRef();
    						}
    					}
    				}
    			}
    		}

    		bSetup = 1;
    		return;
    	}

    	if (VFactionSquad.bNoSquad == 0) {
    		if (VFactionSquad.bSquadHit == 1) {
    			if (iState == 0) {
    				fDistance = GetDistance(PlayerREF);

    				if (fDistance <= VFactionSquad.fRange) {
    					if (VFactionSquad.iSquadNumber >= 1) {
    						if (PlayerREF.IsInCombat() == 0) {
    							if (VFactionSquad.iSquadState == 0) {
    								if (VFactionSquad.iSquadEnd == 0) {
    									SetQuestDelay(VFactionSquad, 0.1);
    									VFactionSquad.iSquadEnd = 1;
    								}
    							}
    						}

    					} else {
    						if (DisguiseFactionPulseQuest.bFactionArmorEquipped != 1) {
    							if (VFactionSquad.iSquadState == 0) {
    								SetQuestDelay(VFactionSquad, 0.1);
    								VFactionSquad.rBoxSpawn = rSelf;
    								VFactionSquad.iSquadState = 1;
    								VFactionSquad.iSquadNumber = (VFactionSquad.iSquadNumber + 1);
    								iState = 1;
    							}
    						}
    					}
    				}
    			} else if (iState == 1) {
    				if (bSpawn == 1) {
    					fTimer = fTimer + GetSecondsPassed();

    					if (iCount == 0) {
    						rActor01.Enable();
    						iCount = 1;
    						return;

    					} else if (iCount == 1 && fTimer >= 0.1) {
    						rActor02.Enable();
    						iCount = 2;
    						return;
    					} else if (iCount == 2 && fTimer >= 0.3) {
    						rActor03.Enable();
    						iCount = 3;
    						return;
    					} else if (iCount == 3 && fTimer >= 0.6) {
    						rActor04.Enable();
    						iCount = 4;
    						return;
    					} else if (iCount == 4 && fTimer >= 0.9) {
    						rActor05.Enable();

    						VFactionSquad.iSquadSpawns = 0;
    						VFactionSquad.iSquadState = 0;
    						VFactionSquad.bSquadChosen = 0;
    						VFactionSquad.iCount = 0;
    						VFactionSquad.fSpawnTime = GameDaysPassed;
    						VFactionSquad.bSquadHit = 0;
    						fTimer = 0;
    						iCount = 0;
    						bSpawn = 0;
    						iState = 2;

    						return;
    					}
    				}
    			}
    		} else {
    			if (iState == 2) {
    				if (!PlayerREF.IsInCombat()) {
    					fDistance = GetDistance(PlayerREF);

    					if (fDistance >= (VFactionSquad.fRange + 500)) {
    						if (rActor01.GetDead() != 1 &&
    							rActor02.GetDead() != 1 &&
    							rActor03.GetDead() != 1) {

    							if (VEFR02NCRBad2MostWanted.bThugsDoneTalking == 0) {
    								VFactionSquad.fSpawnTime = 0;
    								rActor01.EVP();
    								rActor02.EVP();
    								rActor03.EVP();
    								rActor04.EVP();
    							}
    						}

    						iState = 3;
    					}
    				}
    			}
    		}
    	}
    }
