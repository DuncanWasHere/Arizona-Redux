            AZGOMOmertaAssassinREF.StartCombat(Player);
            AZGOMClaudeREF.AddItem(WeapNVSilenced22Pistol, 1);
            AZGOMClaudeREF.AddItem(Ammo22LR, 20);
            AZGOMClaudeREF.StartCombat(Player);

            SetObjectiveCompleted(AZGOMAssassinationQuest, 10, 1);
            SetObjectiveDisplayed(AZGOMAssassinationQuest, 15, 1);
        }
    }
