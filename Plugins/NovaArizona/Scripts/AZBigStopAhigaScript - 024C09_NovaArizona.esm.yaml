  SourceCode: >-
    name AZBigStopAhigaScript;


    GameMode {
        if (GetQuestCompleted(VMQCaesarFail) && !GetInCell(AZBigStopPawnShopINT)) {
            if (GetPCDetectionState() == 1 || GetPCDetectionState() == 3) {
                StartCombat(Player);
            }
        }
    }


    OnDeath {
        if (GetObjectiveDisplayed(AZBigStopAhigaQuest01, 46) && GetObjectiveCompleted(AZBigStopAhigaQuest01, 47)) {
            SetObjectiveDisplayed(AZBigStopAhigaQuest01, 46, 0);
        }

        if (GetStage(AZBigStopAhigaQuest01) != 64) {
            if (AZBigStopAhigaQuest01.iAhigaAccused == 0) {
                SetStage(AZBigStopAhigaQuest01, 255);
            }
        } else if (GetStage(AZBigStopAhigaQuest01) == 64) {
            SetObjectiveCompleted(AZBigStopAhigaQuest01, 38, 1);
            SetObjectiveDisplayed(AZBigStopAhigaQuest01, 39, 1);
        }

        if (GetQuestRunning(AZBigStopAhigaQuest01DominicusRexConfrontQuest)) {
            AZBigStopAhigaQuest01DominicusRexConfrontQuest.Check = 1;
        }

        if (!GetQuestCompleted(AZBigStopAhigaQuest02)) {
            SetStage(AZBigStopAhigaQuest02, 255);
        }

        AZBigStopAugustQuest.AhigaHasTarget = 0;
    }
