  SourceCode: >-
    name AZBBSOnMenuCloseUDF;


    fn(int iMenuID) {
        AZBBSQuest.bShowThread = 0;
        AZBBSQuest.bThreadInitialized = 0;
        AZBBSQuest.bFixDisplay = 0;

        SetUIFloatAlt("ComputersMenu/AZBBSThreadWindow/visible", 0);
        SetUIFloatAlt("ComputersMenu/computers_depth_rect/visible", 1);

        SetOnMenuCloseEventHandler(AZBBSOnMenuCloseUDF, 0, 1057);
        SetOnKeyDownEventHandler(AZBBSOnKeyDownUDF, 0, 264);
        SetOnKeyDownEventHandler(AZBBSOnKeyDownUDF, 0, 265);
        SetOnKeyDownEventHandler(AZBBSOnKeyDownUDF, 0, 57);

        int iIndex = 0;
        while (iIndex < AZBBSQuest.iCount) {
            UnloadUIComponent("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/bbsPost" + $iIndex);
            iIndex += 1;
        }

        // Move scrollbar to top
        SetUIFloatAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/Scrollbar/_scroll_to_end", 1);
        ClickMenuTile("ComputersMenu/AZBBSThreadWindow/ScrollContainer/Scrollbar/scrollbar_vert_page_up");
        SetUIFloatAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/Scrollbar/_scroll_to_end", 0);
    }
