    name AZAugustQuestBarrelSCRIPT;


    int doonce;


    OnActivate {
        if (!doonce) {
            AZAugustQuestAssassinREF.Enable();
            AZAugustQuestAssassinREF.EVP();

            EnableFastTravel(0, 1, 0);

            PlayerREF.StartCombat(AZAugustQuestAssassinREF);

            ShowMessage(AZAugustQuestBarrelMessage);

            SetObjectiveCompleted(AZBigStopAugustQuest, 2, 1);
            SetObjectiveCompleted(AZBigStopAugustQuest, 6, 1);
            SetObjectiveDisplayed(AZBigStopAugustQuest, 8, 1);

            doonce = 1;
        }
    }
