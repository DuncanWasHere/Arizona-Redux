  CompiledScript: 
  SourceCode: >-
    name AZDolanSpringsZekeScript;


    // Door Locking Stuff

    int bInit;


    int bLocked;

    int bGetOut;


    ref rPackage;

    ref rCell;

    ref rDoorREF;


    ref rKey;


    GameMode {
        // Door Locking Stuff
        if (bInit) {
            ref rCurrentPackage = GetCurrentStablePackage();

            if (rCurrentPackage == rPackage) {
                // Have actor try to kick player out if they need to leave.
                if ((GameHour >= 8 && GameHour < 20) && !bGetOut) {
                    SetPublic(rCell, 0);
                    bGetOut = 1;
                }
            }
        }
    }


    // This is only triggered by the door locking activator during initialization

    OnTriggerEnter::AZDolanSpringsActivatorZekeDoorLockerREF {
        rPackage = AZDolanSpringsZekeHousePackage;
        rCell = AZDolanSpringsHomeINT05;
        rDoorREF = AZDolanSpringsZekeHouseDoorREF;

        rKey = AZKeyDolanSpringsZeke;

        bInit = 1;

        AZDolanSpringsActivatorZekeDoorLockerREF.EnterTrigger(PlayerREF);
    }
