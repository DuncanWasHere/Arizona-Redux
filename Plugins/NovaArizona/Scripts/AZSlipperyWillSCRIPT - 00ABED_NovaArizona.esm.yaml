  SourceCode: >-
    name AZSlipperyWillSCRIPT;


    int Status;


    OnDeath {
        AZWhiteHillsMineDialogue.SlipperyWillComplete = 1;

        if (GetObjectiveDisplayed(AZWhiteHillsMineDialogue, 7)) {
            SetObjectiveDisplayed(AZWhiteHillsMineDialogue, 7, 0);
            SetObjectiveCompleted(AZWhiteHillsMineDialogue, 7, 0);
        }

        if (GetStageDone(AZWhiteHillsMineDialogue, 40) && !GetStageDone(AZWhiteHillsMineDialogue, 95)) {
            SetStage(AZWhiteHillsMineDialogue, 95);
        }

        if (GetObjectiveCompleted(AZWhiteHillsMineDialogue, 35) && !GetObjectiveCompleted(AZWhiteHillsMineDialogue, 7)) {
            SetStage(AZWhiteHillsMineDialogue, 95);
        }

        Player.RemoveItem(AZMineQuestMap, 1);
    }
