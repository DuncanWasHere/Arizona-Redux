  CompiledScript: 
  SourceCode: >-
    scn AZCrEvolvedLakelurkLMScript


    BEGIN OnDeath


    Set AZNewtFishingQuest.BossLakelurksKilled to AZNewtFishingQuest.BossLakelurksKilled + 1


    END



    BEGIN GameMode


    if AZNewtFishingQuest.LakelurksKilled > 9 && AZNewtFishingQuest.BossLakelurksKilled > 1
    	if GetStage AZNewtFishingQuest == 50
    		SetStage AZNewtFishingQuest 60
    		Set AZNewtFishingQuest.HiveCleared to 1
    	elseif AZNewtFishingQuest < 50
    		Set AZNewtFishingQuest.HiveCleared to 1
    	elseif AZNewtFishingQuest == 100
    		Set AZNewtFishingQuest.HiveCleared to 2
    	endif
    endif


    END
