  CompiledScript: 
  SourceCode: >-
    scn AZLGVBloodGunnerScript


    int Button

    int Evaluated


    BEGIN OnActivate Player


    ShowMessage AZLGVAircraftActivator02


    END



    BEGIN GameMode


    Set Button to GetButtonPressed

    if Button == 1
    	if Player.GetAV Medicine < 20
    		ShowMessage AZLGVAircraftActivator02c
    	elseif Player.GetAV Medicine >= 20 && Player.GetAV Medicine < 60
    		ShowMessage AZLGVAircraftActivator02a
    	elseif Player.GetAV Medicine >= 60
    		ShowMessage AZLGVAircraftActivator02b
    		SetObjectiveDisplayed AZStatioFindFriendQuest 30 0
    		Set AZStatioFindFriendQuest.BloodGunnerClue to 1
    	endif
    elseif Button == 2
    	Activate
    endif


    END
