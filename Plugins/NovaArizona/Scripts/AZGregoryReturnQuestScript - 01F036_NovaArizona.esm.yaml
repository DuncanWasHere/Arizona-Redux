  CompiledScript: 
  SourceCode: >-
    name AZGregoryReturnQuestScript;


    int GregoryHealthComplete;

    int DoOnce;


    float iTimer;


    GameMode {
        if (!DoOnce) {
            if (iTimer < GregoryHealthComplete + 6) {
                iTimer = GetGameDaysPassed();
            } else {	
                AZOldMormonFortGregoryREF.MoveTo(AZGregoryFortMarkerREF);
                AZOldMormonFortGregoryREF.Evp();
                AZMalpaisAbuseQuest.GregoryReturned = 1;
                DoOnce = 1;
                StopQuest(AZFollowerReturnQuest);
            }
        }
    }
