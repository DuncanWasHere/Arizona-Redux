  SourceCode: >-
    name AZRustyHooksPackFightDialogueTriggerScript;

    // Trigger to start pack fight dialogue when player is nearby


    OnTrigger::PlayerREF {
    	if (GetStage(AZRustyHooksPackFightQuest) == 40 && AZRustyHooksDialogueQuest.iPackFightState == 0) {
    		AZRustyHooksDialogueQuest.iPackFightState = 1;
    		AZRustyHooksBearREF.EVP();
    		AZRustyHooksKyleREF.EVP();
    		Disable();
    	}
    }
