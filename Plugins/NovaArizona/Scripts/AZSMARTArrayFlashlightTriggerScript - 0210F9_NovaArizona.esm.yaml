  CompiledScript: 
  SourceCode: >+
    name AZSMARTArrayFlashlightTriggerScript;


    float fTimer;

    float fLastToggleTime;


    OnTrigger::PlayerREF {
        fTimer += GetSecondsPassed();

        if (fTimer - fLastToggleTime >= 1.0) {
            if (TogglePipBoyLight()) {
                TogglePipBoyLight(0);
                PlaySound(UIPipBoyLightOff);
            } else {
                TogglePipBoyLight(1);
                PlaySound(UIPipBoyLightOn);
            }

            fLastToggleTime = fTimer;
        }
    }
