  SourceCode: >+
    name AZWhiteHillsMineLegionaryScript;


    OnDeath {
        SetStage(AZWhiteHillsMineDialogue, 90);

        if (GetObjectiveDisplayed(AZBrushQuest01, 6) && !GetObjectiveCompleted(AZBrushQuest01, 6)) {
            SetObjectiveCompleted(AZBrushQuest01, 6, 0);
        }
    }


    GameMode {
        if (GetStage(AZWhiteHillsMineDialogue) == 95) {
            if (AZWhiteHillsMineDialogue.killedcallum) {
                if (Player.GetDistance(AZBigSparMineCallumREF) > 10000) {
                    AZBigSparMineCallumREF.Disable();
                }
            }
        }
    }
