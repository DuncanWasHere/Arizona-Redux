  CompiledScript: 
  SourceCode: >+
    name AZBrushQuestGilaMonsterScript;


    int GilaHit;


    OnHit::Player {
        if (GilaHit > 5) {
            PlaceAtMe(LimbExplosion);
            Disable();
            AZBrushQuest01.GilaMonsterClean += 1;
        }

        if (GetObjectiveDisplayed(AZBrushQuest01, 10)) {
            if (Player.GetEquipped(WeapNVHatchet) || Player.GetEquipped(AZWeapHatchetUnique) ||
                Player.GetEquipped(WeapNVFireaxe) || Player.GetEquipped(WeapNVFireAxeUnique)) {
                GilaHit += 1;
            }
        }
    }
