  SourceCode: >-
    name AZBuckTimerQuestScript;


    int DoOnce;


    GameMode {
        if (!DoOnce) {
            PlaySound(OBJComputerTerminalForward);
            DoOnce = 1;
        } else if (DoOnce == 1) {
            EnablePlayerControls();
            AZBigStopBuckREF.StartConversation(Player, AZBigStopBuckHolotapeTopic);
            DoOnce = 2;
        } else if (DoOnce == 2) {
            StopQuest(AZBuckTimerQuest);
        }
    }
