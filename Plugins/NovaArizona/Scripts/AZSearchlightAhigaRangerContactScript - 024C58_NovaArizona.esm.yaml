  SourceCode: >-
    name AZSearchlightAhigaRangerContactScript;


    OnDeath {
        if (!GetQuestCompleted(AZBigStopAhigaQuest01)) {
            if (GetObjectiveCompleted(AZBigStopAhigaQuest01, 34) ||
                GetObjectiveCompleted(AZBigStopAhigaQuest01, 37) ||
                GetObjectiveDisplayed(AZBigStopAhigaQuest01, 38) ||
                GetObjectiveDisplayed(AZBigStopAhigaQuest01, 39)) {

                SetObjectiveDisplayed(AZBigStopAhigaQuest01, 30, 0);
                SetStage(AZBigStopAhigaQuest01, 255);
            } else if (!GetObjectiveCompleted(AZBigStopAhigaQuest01, 34)) {
                SetObjectiveDisplayed(AZBigStopAhigaQuest01, 30, 0);
                SetObjectiveDisplayed(AZBigStopAhigaQuest01, 61, 1);
            }
        }
    }


    OnActivate::player {
        if (GetObjectiveDisplayed(AZBigStopAhigaQuest01, 62) && 
            !GetObjectiveCompleted(AZBigStopAhigaQuest01, 62)) {

            ShowMessage(AZRangerFailsafeMessage);
            Player.RemoveItem(AZAhigaQuestHolotape, 1);
            SetObjectiveCompleted(AZBigStopAhigaQuest01, 62, 1);
            SetObjectiveDisplayed(AZBigStopAhigaQuest01, 63, 1);
        } else {
            Activate();
        }
    }
