  SourceCode: >-
    name AZPlasmaGooificationUniqueBaseEffectScript;


    float fTimer;

    int bDoOnce;


    ScriptEffectStart {
        if (!GetIsID(NVCrMrHouse)) {
            SetCriticalStage(GooStart);
            PMS(AZPlasmaGooificationUniqueEffectShader01);
            PMS(AZPlasmaGooificationUniqueEffectShader02);
            fTimer = 1.4;
            bDoOnce = 0;
        }
    }


    ScriptEffectUpdate {
        if (!bDoOnce) {
            if (fTimer <= 0) {
                AttachAshPileEX(AZPlasmaGooPileUnique);
                SetCriticalStage(GooEnd);
                bDoOnce = 1;
            }
            fTimer -= ScriptEffectElapsedSeconds();
        }
    }
