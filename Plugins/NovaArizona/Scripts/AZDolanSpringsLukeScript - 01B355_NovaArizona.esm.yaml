  CompiledScript: 
  SourceCode: >-
    name AZDolanSpringsLukeScript;


    int bInit;


    int bLockedStore;

    int bLockedHouse;

    int bGetOut;


    ref rStorePackage;

    ref rStoreCell;

    ref rStoreDoorREF;


    ref rHousePackage;

    ref rHouseCell;

    ref rHouseDoorREF;


    ref rKey;


    GameMode {
        if (bInit) {
            ref rCurrentPackage = GetCurrentStablePackage();

            if (rCurrentPackage == rStorePackage) {
                // Have actor try to kick player out if it's past closing time.
                if ((GameHour >= 18 || GameHour < 8) && !bGetOut) {
                    SetPublic(rStoreCell, 0);
                    bGetOut = 1;
                }

            } else if (rCurrentPackage == rHousePackage) {
                // Have actor try to kick player out if they're late for work.
                if ((GameHour >= 8 && GameHour < 18) && !bGetOut) {
                    SetPublic(rHouseCell, 0);
                    bGetOut = 1;
                }
            }
        }
    }


    // This is only triggered by the door locking activator during initialization

    OnTriggerEnter::AZDolanSpringsActivatorLukeDoorLockerREF {
        rStorePackage = AZDolanSpringsLukeStorePackage;
        rStoreCell = AZDolanSpringsGasStationOfficeINT;
        rStoreDoorREF = AZDolanSpringsLukeStoreDoorREF;

        rHousePackage = AZDolanSpringsLukeHousePackage;
        rHouseCell = AZDolanSpringsHomeINT01;
        rHouseDoorREF = AZDolanSpringsLukeHouseDoorREF;

        rKey = AZKeyDolanSpringsLuke;

        bInit = 1;

        AZDolanSpringsActivatorLukeDoorLockerREF.EnterTrigger(PlayerREF);
    }
