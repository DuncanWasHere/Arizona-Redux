  CompiledScript: 
  SourceCode: "name AZMalpaisSecurityScript;\r\n\r\nGameMode {\r\n    if (IsPlayerInRegion(AZMalpaisRegion) || \r\n        Player.GetInCell(AZMalpaisBathhouseINT) || \r\n        Player.GetInCell(AZMalpaisLogisticsOfficeINT) || \r\n        Player.GetInCell(AZMalpaisRoadhouseINT) || \r\n        Player.GetInCell(AZMalpaisShrineINT) || \r\n        Player.GetInCell(AZMalpaisToolShedINT) || \r\n        Player.GetInCell(AZMalpaisWarehouseINT) || \r\n        Player.GetInCell(AZMalpaisWorkshopINT)) {\r\n        \r\n        if (!Player.IsWeaponOut()) {\r\n            return;\r\n        } else if (PlayerREF.GetEquippedItemsAsBitMask() & 32) {\r\n            if (AZFreeformMalpais.InCamp) {\r\n                if (Player.GetWeaponAnimType() != 1 && \r\n                    Player.GetEquipped(WeapNVBinoculars) == 0 && \r\n                    Player.GetEquipped(NVWeapMS22Camera) == 0 && \r\n                    Player.GetEquipped(Fists) == 0) {\r\n\r\n                    if (!Player.GetInFaction(ArmorVCaesarsLegionFactionEnemy) && \r\n                        GetStage(AZMalpaisAbuserQuest) != 30) {\r\n\r\n                        AZMarcellusSedonusREF.SendTrespassAlarm(Player);\r\n                        AZMalpaisOptioREF.SendTrespassAlarm(Player);\r\n                    }\r\n                }\r\n            }\r\n        }\r\n    } else {\r\n        StopQuest(AZMalpaisSecurity);\r\n        AZFreeformMalpais.InCamp = 0;\r\n    }\r\n\r\n    if (AZMalpaisOptioREF.GetDead()) {\r\n        StopQuest(AZMalpaisSecurity);\r\n    }\r\n\r\n    if (GetQuestCompleted(VMQCaesarFail)) {\r\n        StopQuest(AZMalpaisSecurity);\r\n    }\r\n}\r\n"
