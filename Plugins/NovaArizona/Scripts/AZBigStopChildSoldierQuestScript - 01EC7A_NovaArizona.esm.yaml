  SourceCode: >-
    scn AZBigStopChildSoldierQuestScript


    short NatalieRevealed

    short DesmondOffer

    short LookingforNatalie

    short NatalieSuspicion

    short NatalieReadytoTalk

    short DesmondKnow

    short RiteJoin

    short AguSpeech


    short ExecutionComplete


    short TempleBarConfrontation ; 1 = Legionaries go hostile, 2 = Legionaries killed by the children, 3 = Legionaries leave


    short RaftsRepaired ; Needs to be three to advance the quest.


    BEGIN GameMode


    if GetObjectiveDisplayed AZBigStopChildSoldierQuest 20 == 1
    	if RaftsRepaired == 3
    		SetObjectiveCompleted AZBigStopChildSoldierQuest 20 1
    	endif
    endif


    if GetObjectiveCompleted AZBigStopChildSoldierQuest 15 == 1 && GetObjectiveCompleted AZBigStopChildSoldierQuest 20 == 1
    	SetObjectiveDisplayed AZBigStopChildSoldierQuest 25 1
    	SetObjectiveDisplayed AZBigStopChildSoldierQuest 21 0
    	SetObjectiveDisplayed AZBigStopChildSoldierQuest 22 0
    endif


    if GetObjectiveDisplayed AZBigStopChildSoldierQuest 22 == 1 && Player.GetHasNote AZNatalieNote
    	SetObjectiveCompleted AZBigStopChildSoldierQuest 22 1
    endif


    END
