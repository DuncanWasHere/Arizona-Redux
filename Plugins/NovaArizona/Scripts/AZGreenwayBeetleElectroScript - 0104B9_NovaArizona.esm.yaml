  SourceCode: >-
    scn AZGreenwayBeetleElectroScript


    BEGIN OnDeath


    Set AZGreenwayWindFarmQuest.ElectroBeetlesKilled to AZGreenwayWindFarmQuest.ElectroBeetlesKilled + 1

    if AZGreenwayWindFarmQuest.ElectroBeetlesKilled > 4
    	SetObjectiveCompleted AZGreenwayWindFarmQuest 30 1
    	SetObjectiveDisplayed AZGreenwayWindFarmQuest 35 1
    endif

    if GetStage AZGreenwayWindFarmQuest == 25
    	SetStage AZGreenwayWindFarmQuest 55
    endif


    END
