  SourceCode: >-
    scn NVCCLucullusSCRIPT


    ; ========================================================================

    ; Arizona Redux - Edited by DuncanWasHere on 2023-10-10

    ; This script controls behavior for Lucullus and variables to toggle his packages in vanilla and AZRedux. Additional tweaks were made to match my formatting preferences.

    ; ========================================================================


    short iCampWillow ; AZ variable to sequence dialogue for initial trip to Camp Willow

    short iCampWillowEscort ; AZ variable to track if Lucullus is escorting the player during initial trip to the Fort

    short iGate ; Vanilla variable to sequence dialogue for initial trip to the Fort


    short iTripCounter ; > 1 if player has been to the fort at least once


    BEGIN OnDeath

    	NVCCBargeStaticREF.Disable
    	NVCCBargeREF.Enable
    	vCCFortGateREF.Enable

    	if ( GetStage vFreeformForlornHope03 == 10 )
    		AddItem LegionEar 1
    	endif

    END




    BEGIN OnDeath Player

    	SetReputation RepNVCaesarsLegion 1 0
    	SetReputation RepNVCaesarsLegion 0 100
    	SetEnemy VCaesarsLegionFaction PlayerFaction

    END
