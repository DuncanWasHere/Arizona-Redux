  CompiledScript: 
  SourceCode: >+
    name AZAhigaWeaponShipmentScript;


    int button;

    int Decision;

    int InvestigationAllowed;

    int iMenu;


    OnActivate::PlayerREF {
        iMenu = 1;
        ShowMessage(AZAhigaWeaponShipmentInvestigationMsg);
    }


    GameMode {
        if (iMenu == 1) {
            button = GetButtonPressed();
            if (button == 0) {
                iMenu = 0;
            } else if (button == 1) {
                AZAhigaWeaponShipmentREF.disable();
                PlayerREF.AddItem(AZAhigaWeaponShipmentItem, 1);
                SetObjectiveCompleted(AZBigStopAhigaQuest01, 1, 1);
                SetObjectiveDisplayed(AZBigStopAhigaQuest01, 3, 1);
            } else if (button == 2) {
                if ((PlayerREF.GetActorValue(Repair) >= 75) || 
                    (PlayerREF.GetActorValue(Guns) >= 70) || 
                    (PlayerREF.GetActorValue(Perception) >= 7)) 
                {
                    ShowMessage(AZAhigaWeaponShipmentInvestigationSkillMsg);
                    iMenu = 2;
                } else {
                    ShowMessage(AZAhigaWeaponShipmentInvestigationNoSkillMsg);
                }
            }
        } else if (iMenu == 2) {
            button = GetButtonPressed();
            if (button == 0) {
                ShowMessage(AZAhigaWeaponShipmentInvestigationMsg);
                iMenu = 1;
            } else if (button == 1) {
                AZAhigaWeaponShipmentREF.disable();
                PlayerREF.AddItem(AZAhigaWeaponShipmentItem, 1);
                SetObjectiveCompleted(AZBigStopAhigaQuest01, 1, 1);
                SetObjectiveDisplayed(AZBigStopAhigaQuest01, 3, 1);
            } else if (button == 2) {
                if (PlayerREF.GetActorValue(Repair) >= 75) {
                    ShowMessage(AZAhigaWeaponShipmentInvestigationRepairMsg);
                    AZBigStopAhigaQuest01.iDiscoveredPartsBroken = 1;
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 4, 1);
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 5, 1);
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 7, 1);
                } else {
                    ShowMessage(AZAhigaWeaponShipmentInvestigationNoSkillMsg);
                }
            } else if (button == 3) {
                if (PlayerREF.GetActorValue(Guns) >= 70) {
                    ShowMessage(AZAhigaWeaponShipmentInvestigationGunsMsg);
                    AZBigStopAhigaQuest01.iDiscoveredPartsBroken = 1;
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 4, 1);
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 5, 1);
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 7, 1);
                    InvestigationAllowed = 2;
                } else {
                    ShowMessage(AZAhigaWeaponShipmentInvestigationNoSkillMsg);
                }
            } else if (button == 4) {
                if (PlayerREF.GetActorValue(Perception) >= 7) {
                    ShowMessage(AZAhigaWeaponShipmentInvestigationPERMsg);
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 2, 1);
                } else {
                    ShowMessage(AZAhigaWeaponShipmentInvestigationNoSkillMsg);
                }
            }
        }
    }
