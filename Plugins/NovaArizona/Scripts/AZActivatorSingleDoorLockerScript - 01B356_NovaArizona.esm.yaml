  CompiledScript: 
  SourceCode: >+
    name AZActivatorSingleDoorLockerScript;


    ref rLinkedREF; //The cell owner actor linked to the activator.

    int bInit;


    // Variables read from the linked actor. They must be defined in its script.

    ref rPackage;

    ref rCell;

    ref rDoorREF;


    ref rKey;



    GameMode {
    	if (!bInit) {
    		ref rSelf = GetSelf();
    		rLinkedREF = GetLinkedRef();
    		rLinkedREF.EnterTrigger(rSelf); //Force the actor to initialize its variables if it hasn't been loaded yet.
    	} else {
    		ref rCurrentPackage = rLinkedREF.GetCurrentStablePackage();
    		int bLocked = rLinkedREF.GetVariable("bLocked");
    		int bGetOut = rLinkedREF.GetVariable("bGetOut");
    	
    		if (rCurrentPackage != rPackage) {
    			// Lock cell if actor left.
    			if (!bLocked) {
    				if (!bGetOut) {
    					SetPublic(rCell, 0);
    					rLinkedREF.SetVariable("bGetOut", 1);			
    				}

    				if (!rLinkedREF.GetInCell(rCell) && rLinkedREF.GetItemCount(rKey)) {
    					rDoorREF.Lock(50);
    					rLinkedREF.SetVariable("bLocked", 1);
    				}
    			}
    		} else {
    			// Allow guests if actor is in cell.
    			if (bLocked) {
    				if (rLinkedREF.GetInCell(rCell)) {
    					rDoorREF.Unlock();
    					SetPublic(rCell, 1);
    					rLinkedREF.SetVariable("bLocked", 0);
    					rLinkedREF.SetVariable("bGetOut", 0);
    				}
    			}
    		}
    	}
    }


    // The linked actor's script manually triggers this activator when it's done initializing its variables.

    OnTriggerEnter::PlayerREF {
    	rPackage = rLinkedREF.GetVariable("rPackage");
    	rCell = rLinkedREF.GetVariable("rCell");
    	rDoorREF = rLinkedREF.GetVariable("rDoorREF");

    	rKey = rLinkedREF.GetVariable("rKey");

    	if (!rLinkedREF.GetInCell(rCell)) {
    		rLinkedREF.SetVariable("bLocked", 1);
    		SetPublic(rCell, 0);
    	} else {
    		rDoorREF.Unlock();
    		SetPublic(rCell, 1);
    	}

    	bInit = 1;
    }

