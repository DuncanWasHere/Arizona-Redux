  CompiledScript: 
  SourceCode: >+
    name AZAhigaToolboxScript;


    int ToolboxButton;


    OnActivate::PlayerREF {
    	if (AZBigStopAhigaQuest01.iToolboxInvestigated < 2) {
    		ShowMessage(AZAhigaToolboxMessage);
    	} else if (AZBigStopAhigaQuest01.iToolboxInvestigated == 2) {
    		ShowMessage(AZAhigaToolboxMessage02);
    	}
    }


    GameMode {
    	ToolboxButton = GetButtonPressed();

    	if (ToolboxButton == 1) {
    		ShowMessage(AZAhigaToolboxMessage01);
    		AZBigStopAhigaQuest01.iToolboxInvestigated = 1;
    	} else if (ToolboxButton == 2) {
    		ShowMessage(AZAhigaToolboxMessage02);
    		AZBigStopAhigaQuest01.iToolboxInvestigated = 2;
    		SetObjectiveDisplayed(AZBigStopAhigaQuest01, 20, 1);
    	}
    }
