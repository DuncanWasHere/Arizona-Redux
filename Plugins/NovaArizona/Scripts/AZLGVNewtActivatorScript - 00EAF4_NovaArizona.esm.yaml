  CompiledScript: 
  SourceCode: >-
    scn AZLGVNewtActivatorScript


    int Button


    BEGIN OnActivate player


    ShowMessage AZLGVNewtActivatorMessage01


    END



    BEGIN GameMode

    Set Button to GetButtonPressed

    if Button == 1
    	if Player.GetAV Perception >= 6
    		ShowMessage AZLGVNewtActivatorMessage01a
    		Set AZStatioFindFriendQuest.ShelfKnowledge to 1
    	else
    		ShowMessage AZLGVNewtActivatorMessage01b
    	endif
    elseif Button == 2
    	if Player.GetAV Strength >= 6
    		ShowMessage AZLGVNewtActivatorMessage02a
    		Set AZStatioFindFriendQuest.ShelfKnowledge to 1
    	else
    		ShowMessage AZLVGNewtActivatorMessage02b
    	endif
    elseif Button == 3
    	if Player.GetAV Repair >= 40
    		ShowMessage AZLVGNewtActivatorMessage03a
    		Set AZStatioFindFriendQuest.ShelfKnowledge to 1
    	else
    		ShowMessage AZLVGNewtActivatorMessage03b
    	endif
    elseif Button == 4
    	AZLGVNewtActivatorREF.disable
    	AZLGVNewtBasementDoorREF.enable
    	Set Button to 0
    endif


    END
