  CompiledScript: 
  SourceCode: >-
    name AZFortArrivalTriggerScript;


    int bDoOnce;

    int bChipTransferred;


    OnTriggerEnter::Player {
        VMS45.bPlayerAtFort = 1;

        if (VNPCFollowers.ArcadeHired && !VDialogueArcadeGannon.bArcadeQuestionedBeforeCaesar) {
            ArcadeREF.AddScriptPackage(ArcadeTriggerBeforeCaesarDialoguePackage);
        }

        // If VMQ02 (The Enemy of My Enemy) is active, update the quest to direct the player to go see Caesar when the player first arrives
        if (GetStageDone(VMQ02, 1)) {
            SetStage(VMQ02, 2);
            bDoOnce = 1;
            VVulpesIncultaStripRef.Disable();
            VVulpesIncultaStripRef.MarkForDelete();
        }

        if (!GetStageDone(VMQ02, 110)) {
            if (!FortEquipmentConfiscationQuest.bFortEquipmentStored) {
                AZFortLegionaryEntranceGreeterREF.AddScriptPackage(FortDisarmDialoguePackage);
            }
        }

        if (VStoryEventBennyFled && !bChipTransferred) {
            VFortBennyRef.Enable();
            FortBennyGuardRef.Enable();

            if (FortCaesarRef.GetItemCount(VPlatinumChip) == 0) {
                FortCaesarRef.AddItem(VPlatinumChip, 1);
            }

            bChipTransferred = 1;
            VStoryChipOwner = 3;
        }

        // Player was inside inner camp, but fast traveled out
        if (VFreeformTheFort.bPlayerInside) {
            VFreeformTheFort.bPlayerInside = 0;
            FortExteriorNPCParent.Enable();
            FortInteriorNPCParent.Disable();
        }

        // Caesar has revealed his illness, and time is running out
        if (GetQuestRunning(VMS35)) {
            if (VMS35.bEnableCaesarComa && !VFreeformTheFort.bCaesarInComa) {
                // put Caesar in coma
                VFreeformTheFort.bCaesarInComa = 1;
                FortCaesarRef.IgnoreCrime(1);
            }
        }
    }


    OnTriggerEnter::VFortBennyRef {
        VFortBennyRef.Disable(1);
    }
