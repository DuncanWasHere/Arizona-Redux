    name AZHavenWarningTriggerScript;


    int DoOnce;


    OnTriggerEnter::Player {
        if (GetQuestRunning(AZHavenIntroQuest) == 1) {
            if (DoOnce == 0) {
                AZHavenMurrayREF.Say(AZHavenMurrayWarningTopic);
                AZHavenWarningTalkerREF.Say(AZHavenMurrayWarningTopic);
                DoOnce = 1;
            }
            Disable();
            MarkForDelete();
        } else {
            Disable();
            MarkForDelete();
        }
    }
