  CompiledScript: 
  SourceCode: >+
    name AZJemKillQuestScript;


    int DoOnce;

    int JemDeathWarrant;


    float iTimer;


    GameMode {
        if (AZBigStopJemREF.GetDead()) {
            StopQuest(AZJemKillQuest);
        }

        if (DoOnce == 0) {
            JemDeathWarrant = GetGameDaysPassed();
            DoOnce = 1;
        } else if (DoOnce == 1) {
            if (iTimer < JemDeathWarrant + 2) {
                iTimer = GetGameDaysPassed();
            } else {
                if (Player.GetInSameCell(AZBigStopJemREF) == 0) {
                    AZBigStopJemREF.Kill();
                    AZBigStopJemREF.AddItem(AZBigStopJemNote, 1);
                    StopQuest(AZJemKillQuest);
                }
            }
        }
    }
