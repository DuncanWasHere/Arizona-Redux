  CompiledScript: 
  SourceCode: >-
    name AZRexScript;


    int DoOnce;


    GameMode {
        if (!DoOnce && !RexREF.GetDead() && !AZRexREF.GetDisabled()) {
            if (!AZRexREF.GetDead()) {
                if (!AZRexREF.IsInCombat() && FortCaesarREF.GetDead() && !Player.IsInCombat()) {
                    if (!Player.GetLineOfSight(AZRexREF)) {
                        RexREF.Enable();
                        RexREF.MoveTo(AZRexREF);
                        AZRexREF.Disable();
                        AZVanillaDialogueQuest.RexReturnedToCaesar = 0;
                        DoOnce = 1;
                    }
                }
            }
        } else if (RexREF.GetDead()) {
            AZRexREF.Kill();
        }
    }


    OnDeath {
        if (!FortCaesarREF.GetDead() && !RexREF.GetDead()) {
            SetStage(VMQCaesarFail, 5);
        }

        VNPCFollowers.bRexDead = 1;
        ShowMessage(FollowerMessageDeadRex);
    }
