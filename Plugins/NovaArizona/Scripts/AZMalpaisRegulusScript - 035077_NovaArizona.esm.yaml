  SourceCode: >-
    name AZMalpaisRegulusScript;


    int bDoTwice;


    GameMode {
        if (!bDoTwice) {
            if ((AZMalpaisSniperQuest.iBrawlStage == 1 || AZMalpaisSniperQuest.iBrawlStage == 2) &&
                (AZMalpaisRegulusREF.GetHealthPercentage() <= 0.20 || PlayerREF.GetHealthPercentage() <= 0.20)) {

                AZMalpaisSniperQuest.bBrawlRoundOver = 1;
                AZMalpaisRegulusREF.StopCombat(PlayerREF);
                AZMalpaisRegulusREF.EVP();
                bDoTwice = 1;
                DisablePlayerControls();
            }
        }
    }


    OnDeath {
        if (!AZMalpaisSniperQuest.bHeardHogWalkerSobStory) {
            SetStage(AZMalpaisSniperQuest, 101);
        } else if (GetObjectiveDisplayed(AZMalpaisSniperQuest, 10)) {
            SetObjectiveCompleted(AZMalpaisSniperQuest, 10, 1);
        }
    }
