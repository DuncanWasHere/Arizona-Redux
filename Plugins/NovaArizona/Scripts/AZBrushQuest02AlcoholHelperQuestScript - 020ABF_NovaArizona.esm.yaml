  CompiledScript: 
  SourceCode: >+
    name AZBrushQuest02AlcoholHelperQuestScript;


    int AlcoholFound;

    int IListIndex;

    int IListIndexMax;


    ref RFormToRemove;


    GameMode {
        if (PlayerREF.GetItemCount(AlchoholicDrinks)) {
            IListIndexMax = ListGetCount(AlchoholicDrinks) - 1;
            AlcoholFound = 0;

            while (!AlcoholFound) {
                IListIndex = Rand(0, IListIndexMax);
                RFormToRemove = ListGetNthForm(AlchoholicDrinks, IListIndex);

                if (PlayerREF.GetItemCount(RFormToRemove)) {
                    PlayerREF.RemoveItem(RFormToRemove, 1);
                    AlcoholFound = 1;
                }
            }
        }

        StopQuest(AZBrushQuest02AlcoholHelperQuest);
    }
