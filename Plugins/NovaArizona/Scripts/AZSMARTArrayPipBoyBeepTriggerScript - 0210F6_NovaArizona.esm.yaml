  CompiledScript: 
  SourceCode: >-
    name AZSMARTArrayPipBoyBeepTriggerScript;


    OnTriggerEnter::PlayerREF {
        int iRand = Rand(0, 10);

        if (iRand == 0) {
            PlaySound(NPCIdlePipBoyStatic);
        } else if (iRand == 1) {
            PlaySound(UIPipBoyHighlight);
        } else if (iRand == 2) {
            PlaySound(UIPipBoySelect);
        } else if (iRand == 3) {
            PlaySound(UIPipBoyHolotapeStop);
        } else if (iRand == 4) {
            PlaySound(UIPipBoyStatic);
        }
    }
