  CompiledScript: 
  SourceCode: >+
    name AZDolanSpringsDocDScript;


    int DoOnce; // Script blocker

    float Timer; // Timer used for animation control


    // Door Locking Stuff

    int bInit;


    int bLockedStore;

    int bLockedHouse;

    int bGetOut;


    ref rStorePackage;

    ref rStoreCell;

    ref rStoreDoorREF;


    ref rHousePackage;

    ref rHouseCell;

    ref rHouseDoorREF;


    ref rKey;


    GameMode {
        // Door Locking Stuff
        if (bInit) {
            ref rCurrentPackage = GetCurrentStablePackage();

            if (rCurrentPackage == rStorePackage) {
                // Have actor try to kick player out if it's past closing time.
                if ((GameHour >= 20 || GameHour < 8) && !bGetOut) {
                    SetPublic(rStoreCell, 0);
                    bGetOut = 1;
                }

            } else if (rCurrentPackage == rHousePackage) {
                // Have actor try to kick player out if they're late for work.
                if ((GameHour >= 8 && GameHour < 20) && !bGetOut) {
                    SetPublic(rHouseCell, 0);
                    bGetOut = 1;
                }
            }
        }

        // When set to 1, plays medical animations for eight seconds then restarts conversation with the player
        if (GetAV(Variable01) == 1) {
            if (DoOnce == 0) {
                DisablePlayerControls();
                Timer = 8;
                DoOnce = 1;
                ResetAI();
            }

            Timer = Timer - GetSecondsPassed();

            if (Timer <= 6 && DoOnce == 1) {
                IMod(FadeToBlackISFX);
                DoOnce = 2;
            }

            if (Timer <= 0 && !IsImagespaceActive(FadeToBlackISFX)) {
                SetStage(VDoctors, 10);
                EnablePlayerControls();
                SetAV(Variable01, 3);
                ResetAI();
                DoOnce = 0;
            }
        }

        // When set to 2, plays medical animations for ten seconds then restarts conversation with the player
        if (GetAV(Variable01) == 2) {
            if (DoOnce == 0) {
                DisablePlayerControls();
                Timer = 10;
                DoOnce = 1;
                ResetAI();
            }

            Timer = Timer - GetSecondsPassed();

            if (Timer <= 6 && DoOnce == 1) {
                IMod(FadeToBlackISFX);
                DoOnce = 2;
            }

            if (Timer <= 0 && !IsImagespaceActive(FadeToBlackISFX)) {
                SetStage(VDoctors, 20);
                EnablePlayerControls();
                SetAV(Variable01, 3);
                ResetAI();
                DoOnce = 0;
            }
        }
    }


    // This is only triggered by the door locking activator during initialization

    OnTriggerEnter::AZDolanSpringsActivatorDocDDoorLockerREF {
        rStorePackage = AZDolanSpringsDocDStorePackage;
        rStoreCell = AZDolanSpringsAnimalClinicINT;
        rStoreDoorREF = AZDolanSpringsDocDStoreDoorREF;

        rHousePackage = AZDolanSpringsDocDHousePackage;
        rHouseCell = AZDolanSpringsHomeINT06;
        rHouseDoorREF = AZDolanSpringsDocDHouseDoorREF;

        rKey = AZKeyDolanSpringsDocD;

        bInit = 1;

        AZDolanSpringsActivatorDocDDoorLockerREF.EnterTrigger(PlayerREF);
    }
