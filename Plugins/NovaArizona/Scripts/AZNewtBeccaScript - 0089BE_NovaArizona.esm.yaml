  SourceCode: >-
    scn AZNewtBeccaScript


    BEGIN OnDeath


    if GetObjectiveDisplayed AZBaseCampRomanceQuest 20 == 1
    	SetObjectiveDisplayed AZBaseCampRomanceQuest 20 0
    endif


    if GetObjectiveDisplayed AZBaseCampRomanceQuest 15 == 1
    	SetObjectiveDisplayed AZBaseCampRomanceQuest 15 0
    endif


    if GetQuestCompleted AZNewtFishingQuest == 0
    	SetStage AZNewtFishingQuest 255
    endif


    AddReputationExact AZRepNewt 0 15

    if AZNewtOriaREF.GetDead == 0
    	Set AZFreeformNewt.NewtLeadership to 1
    else
    	Set AZFreeformNewt.NewtLeadership to 2
    endif


    END
