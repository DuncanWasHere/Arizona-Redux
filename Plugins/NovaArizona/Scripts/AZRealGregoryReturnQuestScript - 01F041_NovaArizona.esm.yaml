  CompiledScript: 
  SourceCode: >-
    name AZRealGregoryReturnQuestScript;


    float fTimer;

    int bRunTimer;

    int nEvent;


    GameMode {
        // Timer for Next Day Fadeout
        if (!bRunTimer) {
            bRunTimer = 1;
            AZMalpaisAbuseQuest.GregorySentBack = 1;
            AZOldMormonFortGregoryREF.EVP();
        }

        if (bRunTimer) {
            if (fTimer > 0) {
                fTimer -= GetSecondsPassed();
            } else {
                if (nEvent == 0) {
                    // Fade out
                    nEvent += 1;
                    ApplyImageSpaceModifier(FadeToBlack9sISFX);
                    DisablePlayerControls();
                } else if (nEvent == 1) {
                    // Run this on faded out
                    nEvent += 1;
                    fTimer = 3.0;
                    SetStage(AZMalpaisAbuseQuest, 200);
                    AZMalpaisNoctisREF.KillActor();
                    AZMalpaisNoctisREF.Disable();
                    Player.MoveTo(AZGregoryFortMarkerREF);
                    AZOldMormonFortGregoryREF.MoveTo(AZGregoryFortMarkerREF);
                    ApplyImageSpaceModifier(FadeToBlack9sISFX);
                } else if (nEvent == 2) {
                    EnablePlayerControls();
                    StopQuest(AZGregoryReturnQuest);
                }
            }
        }
    }
