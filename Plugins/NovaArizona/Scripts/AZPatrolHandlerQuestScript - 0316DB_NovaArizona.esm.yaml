  CompiledScript: 
  SourceCode: >-
    scn AZPatrolHandlerQuestScript


    float fDaysPassed

    int iNumber


    begin gamemode

    		if GetGameDaysPassed >= (fDaysPassed + 1)	;swaps to new patrol every day

    			if AZLegionaryVeteranEnableMarkerREF.getdisabled == 1
    				set iNumber to GetRandomInRange 1 4
    				if iNumber == 1
    					AZSCtoMlpSlaveCaravanGuardREF.enable
    					AZSCtoMlpLegionaryPatrolDecanusPrimeREF.disable
    					AZSCtoMlpLegionaryPatrolDecanusPrimeSlaverREF.disable
    				elseif iNumber == 2
    					AZSCtoMlpSlaveCaravanGuardREF.disable
    					AZSCtoMlpLegionaryPatrolDecanusPrimeREF.enable
    					AZSCtoMlpLegionaryPatrolDecanusPrimeSlaverREF.disable
    				elseif iNumber == 3
    					AZSCtoMlpSlaveCaravanGuardREF.disable
    					AZSCtoMlpLegionaryPatrolDecanusPrimeREF.disable
    					AZSCtoMlpLegionaryPatrolDecanusPrimeSlaverREF.enable
    				endif
    			else  AZLegionaryVeteranEnableMarkerREF.getdisabled == 0
    					AZSCtoMlpLegionaryPatrolDecanusVeteranREF.enable
    					AZSCtoMlpSlaveCaravanGuardREF.disable
    					AZSCtoMlpLegionaryPatrolDecanusPrimeREF.disable
    					AZSCtoMlpLegionaryPatrolDecanusPrimeSlaverREF.disable
    			endif
    			set fDaysPassed to GetGameDaysPassed
    		endif

    end
