  CompiledScript: 
  SourceCode: >+
    name AZBigStopChildSoldierQuestHelperScript;


    int DoOnce;

    int DoOnce2;


    GameMode {
        if (!DoOnce) {
            AZJawRipperFollower01REF.AddToFaction(AZJawRipperFaction, 1);
            AZJawRipperFollower02REF.AddToFaction(AZJawRipperFaction, 1);
            AZJawRipperFollower03REF.AddToFaction(AZJawRipperFaction, 1);

            AZJawRipperREF.AddScriptPackage(AZJawRipperAmbushPackage01);
            AZJawRipperFollower01REF.AddScriptPackage(AZTempleBarAmbushPackage01);
            AZJawRipperFollower02REF.AddScriptPackage(AZTempleBarAmbushPackage02);
            AZJawRipperFollower03REF.AddScriptPackage(AZTempleBarAmbushPackage03);

            DoOnce = 1;
        }

        if (AZBigStopChildSoldierQuest.TempleBarConfrontation == 1) {
            if (!DoOnce2) {
                if (AZJawRipperREF.GetDead() && AZJawRipperFollower01REF.GetDead() && AZJawRipperFollower02REF.GetDead() && AZJawRipperFollower03REF.GetDead()) {
                    SetObjectiveCompleted(AZBigStopChildSoldierQuest, 60, 1);
                    SetObjectiveDisplayed(AZBigStopChildSoldierQuest, 70, 1);
                    SetStage(AZBigStopChildSoldierQuest, 80);
                    DoOnce2 = 1;
                }
            }
        } else if (AZBigStopChildSoldierQuest.TempleBarConfrontation == 2) {
            AZBigStopLegionExecutioner01Ref.RemoveFromFaction(TheFortChildFaction);
            AZBigStopLegionExecutioner01Ref.RemoveFromFaction(ArmorVCaesarsLegionFaction);
            AZBigStopLegionExecutioner02Ref.RemoveFromFaction(TheFortChildFaction);
            AZBigStopLegionExecutioner02Ref.RemoveFromFaction(ArmorVCaesarsLegionFaction);
            AZBigStopLegionExecutioner03Ref.RemoveFromFaction(TheFortChildFaction);
            AZBigStopLegionExecutioner03Ref.RemoveFromFaction(ArmorVCaesarsLegionFaction);
            AZBigStopLegionExecutioner04Ref.RemoveFromFaction(TheFortChildFaction);
            AZBigStopLegionExecutioner04Ref.RemoveFromFaction(ArmorVCaesarsLegionFaction);

            AZBigStopLegionExecutioner01Ref.SetAv(Confidence, 4);
            AZBigStopLegionExecutioner02Ref.SetAv(Confidence, 4);
            AZBigStopLegionExecutioner03Ref.SetAv(Confidence, 4);
            AZBigStopLegionExecutioner04Ref.SetAv(Confidence, 4);

            AZBigStopLegionExecutioner01Ref.SetActorRefEssential(1);
            AZBigStopLegionExecutioner02Ref.SetActorRefEssential(1);
            AZBigStopLegionExecutioner03Ref.SetActorRefEssential(1);
            AZBigStopLegionExecutioner04Ref.SetActorRefEssential(1);

            SetEnemy(AZBigStopExecutionFaction, AZJawRipperFaction);

            if (!DoOnce2) {
                if (AZJawRipperREF.GetDead() && AZJawRipperFollower01REF.GetDead() && AZJawRipperFollower02REF.GetDead() && AZJawRipperFollower03REF.GetDead()) {
                    SetObjectiveCompleted(AZBigStopChildSoldierQuest, 60, 1);
                    SetObjectiveDisplayed(AZBigStopChildSoldierQuest, 70, 1);
                    SetStage(AZBigStopChildSoldierQuest, 80);
                    DoOnce2 = 1;
                }
            }
        } else if (AZBigStopChildSoldierQuest.TempleBarConfrontation == 3) {
            SetAlly(PlayerFaction, AZJawRipperFaction);
            AZJawRipperREF.AddScriptPackage(AZJawRipperFactionLeavePackage);
            AZJawRipperFollower01REF.AddScriptPackage(AZJawRipperFactionLeavePackage);
            AZJawRipperFollower02REF.AddScriptPackage(AZJawRipperFactionLeavePackage);
            AZJawRipperFollower03REF.AddScriptPackage(AZJawRipperFactionLeavePackage);
        }
    }
