  SourceCode: >-
    scn AZLGVHavenNoteScript


    int DoOnce


    BEGIN OnActivate player


    if DoOnce == 0
    	Player.AddItem AZLGVNote02 1
    	Set DoOnce to 1
    endif


    if AZStoryEventHavenFound == 1 && AZHavenBenjaminREF.GetDead == 0
    	ShowMessage AZLGVAircraftActivator04b
    	Set AZStatioFindFriendQuest.AutonousSearchStatus to 4
    	SetObjectiveDisplayed AZStatioFindFriendQuest 30 0
    	SetStage AZStatioFindFriendQuest 40
    elseif AZHavenBenjaminREF.GetDead == 1
    	ShowMessage AZLGVAircraftActivator04c
    else
    	ShowMessage AZLGVAircraftActivator04a
    endif


    END
