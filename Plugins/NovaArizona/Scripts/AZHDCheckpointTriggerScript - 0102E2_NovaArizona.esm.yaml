  SourceCode: >-
    name AZHDCheckpointTriggerScript;


    int Today;


    OnTriggerEnter::PlayerREF {


    if ((GetStage(VHDBattleController) < 10) &&
    	(GetStage(VHDLegionBattle) < 10) &&
    	(GetStage(VHDHouseBattle) < 10) &&
    	(GetStage(VHDIndependentBattle) < 10) &&
    	(AZDamNQuest2.bOnDuty != 1) &&
    	(AZDamNQuest3.bBomberExploded == 0) &&
    	(GetStageDone(AZDamNQuest3, 50) == 0)) {
    	if (Today != GameDay) {
    		AddReputationExact(RepNVNCR, 0, 3);
    		Today = GameDay;
            }
            if (VHDPreBattleRanger01REF.GetDetected(PlayerREF) ||
                VHDPreBattleRanger03REF.GetDetected(PlayerREF) ||
                VHDPreBattleNCRTrooper5REF.GetDetected(PlayerREF) ||
                VHDPreBattleNCRTrooper8REF.GetDetected(PlayerREF) ||
                VHDPreBattleNCRTrooper9REF.GetDetected(PlayerREF) ||
                VHDPreBattleNCRTrooper10REF.GetDetected(PlayerREF)) {

                VHDPreBattleRanger03REF.StartCombat(PlayerREF);
                VHDPreBattleRanger01REF.StartCombat(PlayerREF);
                VHDPreBattleNCRTrooper9REF.StartCombat(PlayerREF);
                VHDPreBattleNCRTrooper5REF.StartCombat(PlayerREF);
                VHDPreBattleNCRTrooper10REF.StartCombat(PlayerREF);
                VHDPreBattleNCRTrooper8REF.StartCombat(PlayerREF);
                AZHDCheckpointOfficerREF.StartCombat(PlayerREF);
                AZHDNCRTrooper02REF.StartCombat(PlayerREF);
                AZHDNCRTrooper02bREF.StartCombat(PlayerREF);
                AZHDNCRTrooper03aREF.StartCombat(PlayerREF);
                AZHDNCRTrooper03bREF.StartCombat(PlayerREF);
                AZCharlieREF.StartCombat(PlayerREF);
            }

            if (AZHDNCRTrooper02REF.GetDetected(PlayerREF) ||
                AZHDNCRTrooper02bREF.GetDetected(PlayerREF) ||
                AZHDNCRTrooper03aREF.GetDetected(PlayerREF) ||
                AZHDNCRTrooper03bREF.GetDetected(PlayerREF) ||
                AZCharlieREF.GetDetected(PlayerREF) ||
                AZHDCheckpointOfficerREF.GetDetected(PlayerREF)) {

                VHDPreBattleRanger03REF.StartCombat(PlayerREF);
                VHDPreBattleRanger01REF.StartCombat(PlayerREF);
                VHDPreBattleNCRTrooper9REF.StartCombat(PlayerREF);
                VHDPreBattleNCRTrooper5REF.StartCombat(PlayerREF);
                VHDPreBattleNCRTrooper10REF.StartCombat(PlayerREF);
                VHDPreBattleNCRTrooper8REF.StartCombat(PlayerREF);
                AZHDCheckpointOfficerREF.StartCombat(PlayerREF);
                AZHDNCRTrooper02REF.StartCombat(PlayerREF);
                AZHDNCRTrooper02bREF.StartCombat(PlayerREF);
                AZHDNCRTrooper03aREF.StartCombat(PlayerREF);
                AZHDNCRTrooper03bREF.StartCombat(PlayerREF);
                AZCharlieREF.StartCombat(PlayerREF);
            }
        }
    }
