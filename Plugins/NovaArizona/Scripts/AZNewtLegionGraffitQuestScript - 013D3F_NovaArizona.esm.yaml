  CompiledScript: 
  SourceCode: >-
    scn AZNewtLegionGraffitQuestScript


    int iMetPincturus

    int iPabloSneak

    int iPabloDayLastSnuck

    int bHankHelp


    short bHuntsGoatsPunished

    short bPabloFound

    short bPabloPunished

    short bReservationTradersPunished

    short bPabloSneaking

    short DoOnce

    short bGraffitiEnabled



    begin GameMode

    	if (iPabloSneak == 1) && (GetDayOfWeek != iPabloDayLastSnuck)
    		set iPabloSneak to 0
    	endif

    	if (bPabloPunished == 1) && (DoOnce == 0)
    			AZNewtPabloREF.MoveTo AZMalpaisChildrenQuartersMarkerREF
    			AZNewtPabloREF.AddItem WithAmmoHuntingRifleLoot 1
    			AZNewtPabloREF.EquipItem WithAmmoHuntingRifleLoot 0 1
    			AZNewtPabloREF.AddItem ArmorNVCLRecruit 1
    			AZNewtPabloREF.EquipItem ArmorNVCLRecruit 0 1
    		if (GetDeadCount AZNewtIsabela == 0)
    			AZNewtLegionGraffitiCrucifixREF01.enable
    			AZNewtLegionGraffitiCrucifixFurnitureREF01.enable
    			AZNewtIsabelaCrucifiedREF.enable
    		endif
    		Set DoOnce to 1
    	endif

    	if (bHuntsGoatsPunished == 1) && (DoOnce == 0) && (GetDeadCount AZBaseCampHuntsGoats == 0)
    			AZHuntsGoatsREF.disable
    			AZNewtLegionGraffitiCrucifixREF01.enable
    			AZNewtLegionGraffitiCrucifixFurnitureREF01.enable
    			AZHuntsGoatsCrucifiedREF.enable
    		set DoOnce to 1
    	endif

    end
