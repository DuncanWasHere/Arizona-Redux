  CompiledScript: 
  SourceCode: >+
    name AZMalpaisQuestNoteObjectScript;


    OnAdd::player {
        Player.RemoveItem(AZMalpaisQuestNoteObject, 1);
        Player.AddItem(AZMalpaisSedonusQuestNote, 1);

        if (GetObjectiveDisplayed(AZMalpaisAbuserQuest, 55) && !GetQuestCompleted(AZMalpaisAbuserQuest)) {
            if (!GetDeadCount(AZBigStopJem) && AZElephantHillFatEyeQuest.FatEyeJem == 0) {
                SetObjectiveDisplayed(AZMalpaisAbuserQuest, 56, 1);
            }

            if (!GetDeadCount(AZElephantHillFatEye) && AZElephantHillFatEyeQuest.FatEyeJem == 1) {
                SetObjectiveDisplayed(AZMalpaisAbuserQuest, 57, 1);
            }
        }

        if (GetStage(AZMalpaisAbuseQuest) == 50) {
            if (!AZBigStopJemREF.GetDead() && AZElephantHillFatEyeQuest.FatEyeJem == 0 && AZBigStopAugustQuest.GossipReject == 0) {
                SetObjectiveDisplayed(AZMalpaisAbuseQuest, 51, 1);
            }

            if (AZElephantHillFatEyeQuest.FatEyeJem == 1) {
                SetObjectiveDisplayed(AZMalpaisAbuseQuest, 55, 1);
            }
        }
    }
