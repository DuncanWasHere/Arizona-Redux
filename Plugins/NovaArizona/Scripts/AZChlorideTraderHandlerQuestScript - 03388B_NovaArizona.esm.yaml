  CompiledScript: 
  SourceCode: >-
    name AZChlorideTraderHandlerQuestScript;


    float fDaysPassed;

    int iNumber;


    GameMode {
        // Swaps to new trader every three days
        if (GetGameDaysPassed() >= fDaysPassed + 3) {

            // Lalo Shen
            if (AZChlorideCurrentTrader == 0) {
                AZChlorideCurrentTrader = 1;
                AZChlorideLaloShenREF.Disable();
                AZChlorideSandyRhodesREF.Enable();

            // Sandy Rhodes
            } else if (AZChlorideCurrentTrader == 1) {
                AZChlorideCurrentTrader = 0;
                AZChlorideLaloShenREF.Enable();
                AZChlorideSandyRhodesREF.Disable();
            }

            fDaysPassed = GetGameDaysPassed();
        }
    }
