  CompiledScript: 
  SourceCode: >+
    name AZMalpaisSedonusSlaveTriggerScript;


    int Slave1DoOnce;

    int Slave2DoOnce;


    OnTriggerEnter::Player {
        if (!GetQuestCompleted(AZMalpaisAbuserQuest) && GetObjectiveDisplayed(AZMalpaisAbuserQuest, 35)) {
            if (IsPlayerGrabbedREF(AZSedonusSlave01REF) && AZMalpaisAbuserQuest.Slave1DoOnce == 0) {
                AZMalpaisAbuserQuest.Slave1DoOnce = 1;
                AZMalpaisAbuserQuest.SedonusSlavesMoved = AZMalpaisAbuserQuest.SedonusSlavesMoved + 1;
            }

            if (IsPlayerGrabbedREF(AZSedonusSlave02REF) && AZMalpaisAbuserQuest.Slave2DoOnce == 0) {
                AZMalpaisAbuserQuest.Slave2DoOnce = 1;
                AZMalpaisAbuserQuest.SedonusSlavesMoved = AZMalpaisAbuserQuest.SedonusSlavesMoved + 1;
            }
        }
    }
