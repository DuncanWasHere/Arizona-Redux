  CompiledScript: 
  SourceCode: >-
    name AZQuintusSupplyCaseScript;


    int QuintusButton;

    int DoOnce;


    OnActivate::Player {
        if (IsActionRef(Player)) {
            if (!AZBrushQuest02.QuintusTampered) {
                ShowMessage(AZDecanusQuintusSupplyLockerMessagePre);
            } else {
                ShowMessage(AZDecanusQuintusSupplyLockerMessagePost);
            }
        }
    }


    OnActivate {
        if (IsActionRef(Player)) {
            if (!AZBrushQuest02.QuintusTampered) {
                ShowMessage(AZDecanusQuintusSupplyLockerMessagePre);
            } else {
                ShowMessage(AZDecanusQuintusSupplyLockerMessagePost);
            }
        }
    }


    GameMode {
        QuintusButton = GetButtonPressed();

        if (!AZBrushQuest02.QuintusTampered) {
            if (QuintusButton == 0) {
                return;
            } else if (QuintusButton == 1) {
                StartQuest(AZBrushQuest02AlcoholHelperQuest);
                AZBrushQuest02.QuintusTampered = 1;
                SetObjectiveCompleted(AZBrushQuest02, 17, 1);
                SetObjectiveDisplayed(AZBrushQuest02, 18, 1);
                SetObjectiveDisplayed(AZBrushQuest02, 16, 0);
            } else if (QuintusButton == 2) {
                StartQuest(AZBrushQuest02ChemHelperQuest);
                AZBrushQuest02.QuintusTampered = 1;
                SetObjectiveCompleted(AZBrushQuest02, 17, 1);
                SetObjectiveDisplayed(AZBrushQuest02, 18, 1);
                SetObjectiveDisplayed(AZBrushQuest02, 16, 0);
            } else if (QuintusButton == 3) {
                Player.RemoveItem(NVSuperStimpak, 2);
                AZBrushQuest02.QuintusTampered = 1;
                SetObjectiveCompleted(AZBrushQuest02, 17, 1);
                SetObjectiveDisplayed(AZBrushQuest02, 18, 1);
                SetObjectiveDisplayed(AZBrushQuest02, 16, 0);
            }
        } else if (AZBrushQuest02.QuintusTampered && !DoOnce) {
            ShowMessage(AZDecanusQuintusSupplyLockerMessagePost);
            DoOnce = 1;
        }
    }
