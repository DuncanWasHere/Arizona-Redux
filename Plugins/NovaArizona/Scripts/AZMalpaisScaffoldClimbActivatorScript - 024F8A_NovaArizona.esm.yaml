  CompiledScript: 
  SourceCode: >-
    scn AZMalpaisScaffoldClimbActivatorScript


    short button

    short awaitinginput


    begin onactivate
    	showmessage AZMalpaisScaffoldClimbActivatorMsg
    	set awaitinginput to 1
    end


    begin gamemode
    	if awaitinginput ==1
    		set button to getbuttonpressed
    	if button > -1
    		set awaitinginput to 0
    	endif

    	if button ==0
    	player.moveto AZMalpaisScaffoldClimbTeleportMarker
    	endif

    	if button ==1
    	endif
    endif

    end
