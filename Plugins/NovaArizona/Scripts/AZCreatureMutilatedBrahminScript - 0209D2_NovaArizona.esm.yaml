  CompiledScript: 
  SourceCode: >+
    name AZCreatureMutilatedBrahminScript;


    int BrahminHit;


    OnHit::Player {
        if (BrahminHit > 5) {
            AZMutilatedBrahminREF.PlaceAtMe(LimbExplosion);
            Disable();
            AZBrushQuest01.BrahminClean = 1;
        }

        if (GetObjectiveDisplayed(AZBrushQuest01, 10)) {
            if (Player.GetEquipped(WeapNVHatchet) || Player.GetEquipped(AZWeapHatchetUnique) || Player.GetEquipped(WeapNVFireaxe) || Player.GetEquipped(WeapNVFireAxeUnique)) {
                BrahminHit = BrahminHit + 1;
            }
        }
    }
