  SourceCode: >-
    scn AZPirateDoorScript


    int Unlocked


    BEGIN OnActivate player


    Activate

    AZLakeMeadAmmonRaREF.evp


    if AZFreeformLakeMead.ParlayAccepted < 2
    	if Player.IsWeaponOut == 0
    		Return
    	elseif eval (PlayerREF.GetEquippedItemsAsBitMask & 32)
    		if Player.GetWeaponAnimType != 1 && Player.GetEquipped WeapNVBinoculars == 0 && Player.GetEquipped NVWeapMS22Camera == 0 && Player.GetEquipped Fists == 0
    			SetEnemy PlayerFaction AZAmmonRaFaction
    			Set AZFreeformLakeMead.AmmonRaHostile to 1
    		endif
    	endif
    endif


    END
