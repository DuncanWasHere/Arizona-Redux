  CompiledScript: 
  SourceCode: >-
    scn AZBrassKnucklesUniqueScript


    ; This script controls the bonus effects of the unique brass knuckles


    Short bEquipped


    BEGIN OnSell Player

    	Player.RemoveSpell AZActorEffectBrassKnucklesUnique
    	Set bEquipped to 0

    END



    BEGIN GameMode

    	If bEquipped == 0
    		If (Player.GetEquipped AZWeapBrassKnucklesUnique == 1)
    			Player.AddSpell AZActorEffectBrassKnucklesUnique
    			Set bEquipped to 1
    		EndIf
    	Else
    		If (Player.GetEquipped AZWeapBrassKnucklesUnique == 0)
    			Player.RemoveSpell AZActorEffectBrassKnucklesUnique
    			Set bEquipped to 0
    		EndIf
    	EndIf

    END
