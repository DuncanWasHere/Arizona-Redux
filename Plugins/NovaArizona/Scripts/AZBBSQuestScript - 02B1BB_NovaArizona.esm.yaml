  CompiledScript: 
  SourceCode: >+
    name AZBBSQuestScript;


    int bShowThread;

    int bThreadInitialized;

    int bFixDisplay;

    int iCount;


    string sThreadFile;

    string sBoardName;


    GameMode {
        if (GetGameRestarted()) {
            bShowThread = 0;
            bThreadInitialized = 0;
            bFixDisplay = 0;

            SetUIFloatAlt("ComputersMenu/AZBBSThreadWindow/visible", 0);
            SetUIFloatAlt("ComputersMenu/computers_depth_rect/visible", 1);
            SetUIFloatAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/Scrollbar/_current_value", 0);

            int iIndex = 0;
            while (iIndex < iCount) {
                UnloadUIComponent("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/bbsPost" + $iIndex);
                iIndex += 1;
            }
        }
    }


    MenuMode::1057 {
        if (bShowThread && !bThreadInitialized) {
            bThreadInitialized = 1;

            SetOnMenuCloseEventHandler(AZBBSOnMenuCloseUDF, 1, 1057);
            SetOnKeyDownEventHandler(AZBBSOnKeyDownUDF, 1, 264);
            SetOnKeyDownEventHandler(AZBBSOnKeyDownUDF, 1, 265);
            SetOnKeyDownEventHandler(AZBBSOnKeyDownUDF, 1, 57);

            SetUIFloatAlt("ComputersMenu/computers_depth_rect/visible", 0);
            SetUIFloatAlt("ComputersMenu/AZBBSThreadWindow/visible", 1);
            SetUIStringAlt("ComputersMenu/AZBBSThreadWindow/_board_name", $sBoardName);

            array aThreadJson = &(ReadFromJSON($sThreadFile, "", 0, 0));
            array aOriginalPost = (*aThreadJson)["op"];

            string sOPTitle = aOriginalPost["title"];
            string sOPUser = aOriginalPost["user"];
            string sOPTime = aOriginalPost["time"];
            string sOPBody = aOriginalPost["body"];

            array aReplies = (*aThreadJson)["replies"];
            iCount = Ar_Size(aReplies);

            SetUIStringAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/originalPost/_title", $sOPTitle);
            SetUIStringAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/originalPost/_user", $sOPUser);
            SetUIStringAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/originalPost/_time", $sOPTime);
            SetUIStringAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/originalPost/_body", $sOPBody);
            SetUIStringAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/originalPost/_replies", $iCount);

            int iIndex = 0;
            array aPost;
            string sUser;
            string sTime;
            string sBody;

            while (iIndex < iCount) {
                aPost = aReplies[iIndex];

                sUser = aPost["user"];
                sTime = aPost["time"];
                sBody = aPost["body"];

                AddTileFromTemplate("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer|bbsPostTemplate|BBSPost%g", iIndex);

                SetUIStringAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/BBSPost" + $iIndex + "/_user", $sUser);
                SetUIStringAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/BBSPost" + $iIndex + "/_time", $sTime);
                SetUIStringAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/BBSPost" + $iIndex + "/_body", $sBody);

                iIndex += 1;
            }
        } else if (!bShowThread && bThreadInitialized) {
            bThreadInitialized = 0;

            SetUIFloatAlt("ComputersMenu/AZBBSThreadWindow/visible", 0);
            SetUIFloatAlt("ComputersMenu/computers_depth_rect/visible", 1);

            SetOnKeyDownEventHandler(AZBBSOnKeyDownUDF, 0, 264);
            SetOnKeyDownEventHandler(AZBBSOnKeyDownUDF, 0, 265);
            SetOnKeyDownEventHandler(AZBBSOnKeyDownUDF, 0, 57);

            int iIndex = 0;
            while (iIndex < iCount) {
                UnloadUIComponent("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/bbsPost" + $iIndex);
                iIndex += 1;
            }

            // Move scrollbar to top
            SetUIFloatAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/Scrollbar/_scroll_to_end", 1);
            ClickMenuTile("ComputersMenu/AZBBSThreadWindow/ScrollContainer/Scrollbar/scrollbar_vert_page_up");
            SetUIFloatAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/Scrollbar/_scroll_to_end", 0);
        } else if (!bFixDisplay && bShowThread && bThreadInitialized) {
            bFixDisplay = 1;

            string sLastReply = ("ComputersMenu/AZBBSThreadWindow/ScrollContainer/PostContainer/BBSPost" + $(iCount - 1));

            SetUIFloatAlt("ComputersMenu/AZBBSThreadWindow/ScrollContainer/_thread_height", 
                GetMaxOf(0, (GetUIFloatAlt($sLastReply + "/y") + GetUIFloatAlt($sLastReply + "/height"))));
        }
    }
