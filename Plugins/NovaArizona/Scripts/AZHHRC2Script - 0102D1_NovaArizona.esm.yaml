  SourceCode: "name AZHHRC2Script;\r\n\r\nint bDoOnce;\r\n\r\nOnStartCombat::Player {\r\n    if ((GetStageDone(AZHooverDamCheckpointQuest, 5) == 1) && (GetStage(AZHooverDamCheckpointQuest) != 25) && (GetQuestCompleted(AZHooverDamCheckpointQuest) == 0) &&\r\n        (AZHooverDamCheckpointQuest.bBomberDisarmed == 0) && (AZHooverDamCheckpointQuest.bBomberExploded == 0) && (bDoOnce == 0) &&\r\n        (AZHooverDamCheckpointQuest.bBomberKilled == 0)) {\r\n        \r\n        AZSuiciderREF.PlaceAtMe(AZHDExplosion);\r\n        Player.DamageActorValue(Health, 440);\r\n        AZSuiciderREF.Kill();\r\n        AZHDCheckpointOfficerREF.Kill();\r\n        AZCharlieREF.Kill();\r\n        AZHDNCRTrooper02REF.Kill();\r\n        AZHDNCRTrooper02bREF.Kill();\r\n        AZHDNCRTrooper03aREF.Kill();\r\n        AZHDNCRTrooper03bREF.Kill();\r\n        AZHHRefugee2aaREF.Kill();\r\n        AZHHRefugee2baREF.Kill();\r\n        AddReputationExact(RepNVNCR, 0, 12);\r\n        SetStage(AZHooverDamCheckpointQuest, 25);\r\n        AZHooverDamCheckpointQuest.bBomberExploded = 1;\r\n        AZHDWireREF.MoveTo(AZHDWireMarker);\r\n        EnableFastTravel(1);\r\n        bDoOnce = 1;\r\n    }\r\n\r\n    if (AZHooverDamCheckpointQuest.bBomberDisarmed == 1) {\r\n        SetEnemy(NCRFactionNV, AZHHRCFactionCheckpoint);\r\n    }\r\n\r\n    if (AZHooverDamCheckpointQuest.bBomberUnconscious == 1) {\r\n        SetEnemy(NCRFactionNV, AZHHRCFactionCheckpoint);\r\n    }\r\n}\r\n\r\nOnDeath {\r\n    if ((GetStageDone(AZHooverDamCheckpointQuest, 5) == 1) && (GetStage(AZHooverDamCheckpointQuest) != 25) && (GetQuestCompleted(AZHooverDamCheckpointQuest) == 0) &&\r\n        (AZHooverDamCheckpointQuest.bBomberDisarmed == 0) && (AZHooverDamCheckpointQuest.bBomberExploded == 0) && (bDoOnce == 0) &&\r\n        (AZHooverDamCheckpointQuest.bBomberKilled == 0)) {\r\n        \r\n        AZSuiciderREF.PlaceAtMe(AZHDExplosion);\r\n        Player.DamageActorValue(Health, 440);\r\n        AZSuiciderREF.Kill();\r\n        AZHDCheckpointOfficerREF.Kill();\r\n        AZCharlieREF.Kill();\r\n        AZHDNCRTrooper02REF.Kill();\r\n        AZHDNCRTrooper02bREF.Kill();\r\n        AZHDNCRTrooper03aREF.Kill();\r\n        AZHDNCRTrooper03bREF.Kill();\r\n        AZHHRefugee2aaREF.Kill();\r\n        AZHHRefugee2baREF.Kill();\r\n        AddReputationExact(RepNVNCR, 0, 12);\r\n        SetStage(AZHooverDamCheckpointQuest, 25);\r\n        AZHooverDamCheckpointQuest.bBomberExploded = 1;\r\n        AZHDWireREF.MoveTo(AZHDWireMarker);\r\n        EnableFastTravel(1);\r\n        bDoOnce = 1;\r\n    }\r\n\r\n    if (AZHooverDamCheckpointQuest.bBomberDisarmed == 1) {\r\n        SetEnemy(NCRFactionNV, AZHHRCFactionCheckpoint);\r\n    }\r\n\r\n    if (AZHooverDamCheckpointQuest.bBomberUnconscious == 1) {\r\n        SetEnemy(NCRFactionNV, AZHHRCFactionCheckpoint);\r\n    }\r\n}"
