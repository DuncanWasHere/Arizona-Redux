  CompiledScript: 
  SourceCode: >-
    name AZBaseCampIuliaScript;


    OnDeath {
        if (GetStage(AZBaseCampRomanceQuest) < 45) {
            SetStage(AZBaseCampRomanceQuest, 250);
        }

        if (GetStageDone(AZBaseCampRomanceQuest, 45)) {
            SetStage(AZBaseCampRomanceQuest, 180);
            AZBaseCampRomanceQuest.YouKilledIulia = 1;
            AZBaseCampRomanceQuest.YouDealtWithIulia = 1;
        }

        if (GetStageDone(AZBaseCampRomanceQuest, 150)) {
            SetStage(AZBaseCampRomanceQuest, 180);
            AZBaseCampRomanceQuest.BeatingAftermathDialogue = 1;
            AZBaseCampRomanceQuest.IuliaWasKilledByArceus = 1;

            AZBaseCampArceusREF.AddToFaction(ArmorVCaesarsLegionFaction, 1);
            AZBaseCampArceusREF.AddToFaction(VCaesarsLegionFaction, 1);
            AZBaseCampArceusREF.AddToFaction(VCaesarsLegionMilitaryDialogueFaction, 1);
            AZBaseCampArceusREF.AddToFaction(AZBaseCampLegionFaction, 1);
        }
    }
