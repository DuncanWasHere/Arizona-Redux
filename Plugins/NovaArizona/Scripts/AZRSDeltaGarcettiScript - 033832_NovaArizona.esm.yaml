  CompiledScript: 
  SourceCode: >+
    scn AZRSDeltaGarcettiScript


    int bInit

    int bHelmetEquipped


    ; NCR Sniffer Stuff

    ref MyHandler

    short DoOnce


    BEGIN GameMode
    	ref rCurrentPackage = GetCurrentStablePackage

    	if eval (!bInit)
    		if eval (rCurrentPackage == AZRSDeltaGarcettiScoutPackage)
    			bHelmetEquipped = 1
    		else
    			UnequipItem HelmetNVNCRRangerCombat
    		endif

    		bInit = 1
    	endif
    		
    	if eval (rCurrentPackage == AZRSDeltaGarcettiScoutPackage)
    		if eval (!bHelmetEquipped)
    			EquipItem HelmetNVNCRRangerCombat
    			bHelmetEquipped = 1
    		endif
    	elseif eval (bHelmetEquipped)
    		UnequipItem HelmetNVNCRRangerCombat
    		bHelmetEquipped = 0
    	endif
    END


    begin OnStartCombat Player
    	if (GetQR DisguiseFactionPulseQuest == 1) && (IsSpellTarget DisguiseFactionPulseActorEffect == 1)
    		sendAssaultAlarm Player NCRFactionNV
    		sendAssaultAlarm Player VNCRSnifferFaction
    		set MyHandler to GetLinkedRef
    		if (GetDistance player < 512) && MyHandler != 0
    			MyHandler.Say NCRSnifferChallengePlayer			
    		endif
    	endif
    end

