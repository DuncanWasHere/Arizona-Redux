  CompiledScript: 
  SourceCode: >+
    name AZDolanSpringsHarlowScript;


    // Door Locking Stuff

    int bInit;


    int bLockedStore;

    int bLockedHouse;

    int bGetOut;


    ref rStorePackage;

    ref rStoreCell;

    ref rStoreDoorREF;


    ref rHousePackage;

    ref rHouseCell;

    ref rHouseDoorREF;


    ref rKey;


    GameMode {
        // Door Locking Stuff
        if (bInit) {
            ref rCurrentPackage = GetCurrentStablePackage();

            if (rCurrentPackage == rStorePackage) {
                // Have actor try to kick player out if it's past closing time.
                if ((GameHour >= 21 || GameHour < 7) && !bGetOut) {
                    SetPublic(rStoreCell, 0);
                    bGetOut = 1;
                }

            } else if (rCurrentPackage == rHousePackage) {
                // Have actor try to kick player out if they're late for work.
                if ((GameHour >= 7 && GameHour < 21) && !bGetOut) {
                    SetPublic(rHouseCell, 0);
                    bGetOut = 1;
                }
            }
        }
    }


    // This is only triggered by the door locking activator during initialization

    OnTriggerEnter::AZDolanSpringsActivatorHarlowDoorLockerREF {
        rStorePackage = AZDolanSpringsHarlowStorePackage;
        rStoreCell = AZDolanSpringsBigDogINT;
        rStoreDoorREF = AZDolanSpringsHarlowStoreDoorREF;

        rHousePackage = AZDolanSpringsHarlowHousePackage;
        rHouseCell = AZDolanSpringsHomeINT04;
        rHouseDoorREF = AZDolanSpringsHarlowHouseDoorREF;

        rKey = AZKeyDolanSpringsHarlow;

        bInit = 1;

        AZDolanSpringsActivatorHarlowDoorLockerREF.EnterTrigger(PlayerREF);
    }
