            AZBarkerCaveFakeMiniNuke01.Disable();
            AZBarkerCaveFakeMiniNuke02.Disable();
            AZBarkerCaveFakeFragMine01.Disable();
            AZBarkerCaveFakeFragMine02.Disable();

            SetEnemy(PlayerFaction, AZBarkerFaction);

            Activate();

            DoOnce = 1;
        }

        if (DoOnce) {
            Activate();
        }
    }
