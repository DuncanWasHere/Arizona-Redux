  CompiledScript: 
  SourceCode: >+
    name AZBigStopAhigaAmbushQuestScript;


    GameMode {
        if (AZBigStopAhigaQuest01.AhigaMeeting == 2 && AZBigStopAhigaTravelPackage02 == AZBigStopAhigaREF.GetCurrentPackage() && !AZBigStopAhigaREF.GetInCell(AZBigStopPawnShopINT)) {
            AZBigStopAhigaREF.AddScriptPackage(AZBigStopAhigaTravelPackage02);
        }

        if (AZBigStopAhigaREF.GetInCell(AZBigStopPawnShopINT)) {
            if (!Player.GetInCell(AZBigStopPawnShopINT)) {
                AZBigStopAhigaREF.Disable();
                AZAhigaAmbushTalkingActivatorREF.Enable();
            } else if (Player.GetInCell(AZBigStopPawnShopINT)) {
                AZAhigaAmbushTalkingActivatorREF.StartConversation(Player);
                StopQuest(AZBigStopAhigaAmbushQuest);
            }
        }

        if (GetQuestCompleted(AZBigStopAhigaQuest01)) {
            StopQuest(AZBigStopAhigaAmbushQuest);
        }
    }
