  CompiledScript: 
  SourceCode: >-
    scn AZChlorideBankRobberyHelperQuestScript


    short bVaultEntered

    short bVaultDoOnce

    short bTimerControl

    short bAlarmTriggered


    float fTimer


    BEGIN GameMode


    if bAlarmTriggered == 1
    	AZChlorideBankIntAlarmREF.enable
    	setenemy AZChlorideBankGuardFaction Playerfaction
    endif


    if bVaultEntered == 1 && bVaultDoOnce == 0
    	Set bTimerControl to 1
    	Set bVaultDoOnce to 1
    endif


    if bTimerControl == 1
    	Set fTimer to fTimer + GetSecondsPassed
    	if fTimer >= 5 && fTimer < 10
    		AZChlorideBankRobberyResponder1.enable
    	elseif fTimer >= 10 && fTimer < 15
    		AZChlorideBankRobberyResponder2.enable
    	elseif fTimer >= 15
    		AZChlorideBankRobberyResponder3.enable
    		Return
    	endif
    endif


    END
