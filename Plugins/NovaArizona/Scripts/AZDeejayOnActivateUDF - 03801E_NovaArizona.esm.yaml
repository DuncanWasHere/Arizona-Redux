  CompiledScript: 
  SourceCode: >-
    scn AZDeejayOnActivateUDF


    ref Activated

    ref Activator


    BEGIN Function { Activated, Activator }

    	If AZDeejayREF.bCurrentlyHired != 1
    		Return
    	else

    	if (Activated == NVCCPlayerStorageActivatorREF)
    		set NVCCPlayerStorageActivatorREF.Follower1 to AZDeejayREF

    	elseif (Activated == VFSSilverRushFriskingTriggerREF)
    		set VFSSilverRushFriskingTriggerREF.Companion1REF to AZDeejayREF

    	elseif (Activated == TopsFriskingTriggerREF)
    		set TopsFriskingTriggerREF.Companion1REF to AZDeejayREF

    	elseif (Activated == TopsFriskingHoldoutTriggerREF)
    		set TopsFriskingHoldoutTriggerREF.Companion1REF to AZDeejayREF

    	elseif (Activated == VUltraLuxeFriskingTriggerREF)
    		set VUltraLuxeFriskingTriggerREF.Companion1REF to AZDeejayREF

    	elseif (Activated == VUltraLuxeFriskingHoldoutTriggerREF)
    		set VUltraLuxeFriskingHoldoutTriggerREF.Companion1REF to AZDeejayREF

    	elseif (Activated == GomorrahCasinoEnterTriggerREF)
    		set GomorrahCasinoEnterTriggerREF.Companion1REF to AZDeejayREF


    	endif
    	endif
    end
