  CompiledScript: 
  SourceCode: >-
    name AZRustyHooksKyleScript;


    OnDeath {
    	if (GetStage(AZRustyHooksPackFightQuest) == 50) {
    		SetStage(AZRustyHooksPackFightQuest, 60); // Bear won the pack fight
    	} else if (!GetQuestCompleted(AZRustyHooksPackFightQuest)) {
    		SetStage(AZRustyHooksPackFightQuest, 99); // Fail pack fight quest if killed early
    	}

    	if (!AZRustyHooksDialogueQuest.bBearBombDisarmed && !AZRustyHooksBearREF.GetDead()) {
    		AZRustyHooksBearREF.PlaceAtMe(AZRustyHooksBearExplosion); // Kyle's dead man's switch activates the bomb if not disarmed
    	}
    }


    // Failsafes if player interferes in pack fight

    OnDeath::PlayerREF {
    	if (GetStage(AZRustyHooksPackFightQuest) == 50) {
    		SetStage(AZRustyHooksPackFightQuest, 98);
    	}
    }


    OnStartCombat::PlayerREF {
    	if (GetStage(AZRustyHooksPackFightQuest) == 50) {
    		SetStage(AZRustyHooksPackFightQuest, 98);
    	}
    }
