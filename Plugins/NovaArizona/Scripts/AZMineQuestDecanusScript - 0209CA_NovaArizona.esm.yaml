  SourceCode: >-
    name AZMineQuestDecanusScript;


    OnDeath {
        if (!GetQuestCompleted(AZWhiteHillsMineDialogue)) {
            if (GetObjectiveDisplayed(AZWhiteHillsMineDialogue, 7) && !GetObjectiveCompleted(AZWhiteHillsMineDialogue, 7)) {
                return;
            } else {
                SetObjectiveDisplayed(AZWhiteHillsMineDialogue, 25, 0);
                SetObjectiveDisplayed(AZWhiteHillsMineDialogue, 30, 0);
                SetObjectiveDisplayed(AZWhiteHillsMineDialogue, 31, 0);
                SetObjectiveDisplayed(AZWhiteHillsMineDialogue, 33, 0);
                SetObjectiveDisplayed(AZWhiteHillsMineDialogue, 35, 0);
                SetObjectiveDisplayed(AZWhiteHillsMineDialogue, 36, 0);
                SetObjectiveDisplayed(AZWhiteHillsMineDialogue, 40, 0);
                SetObjectiveDisplayed(AZWhiteHillsMineDialogue, 95, 0);
                SetStage(AZWhiteHillsMineDialogue, 90);
            }
        }

        if (!AZBigSparMineCallumREF.GetDisabled()) {
            AZBigSparMineCallumREF.Kill();
        }

        if (!GetQuestCompleted(AZBrushQuest01)) {
            SetStage(AZBrushQuest01, 255);
            AZGilaMonsterDead01REF.Disable();
            AZGilaMonsterDead02REF.Disable();
        }

        if (GetStage(AZBrushQuest02) < 40) {
            if (!GetObjectiveCompleted(AZBrushQuest02, 16) && !AZBrushQuest02.QuintusBlamed) {
                SetStage(AZBrushQuest02, 255);
            } else if (GetObjectiveCompleted(AZBrushQuest02, 16)) {
                SetStage(AZBrushQuest02, 35);
                AZBrushQuest02.QuintusMutiny = 1;
            }
        }

        if (GetObjectiveDisplayed(AZBrushQuest02, 19)) {
            SetObjectiveCompleted(AZBrushQuest02, 19, 1);
        }
    }
