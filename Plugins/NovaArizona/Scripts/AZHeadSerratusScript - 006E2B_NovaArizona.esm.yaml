  SourceCode: >-
    name AZHeadSerratusScript;


    OnAdd::Player {
        // Explode Serratus's head
        AZSerratusREF01.Kill(Player, 1);

        if (GetObjectiveDisplayed(AZMalpaisBountyQuest, 21) == 1) {
            SetObjectiveCompleted(AZMalpaisBountyQuest, 21, 1);
            SetObjectiveDisplayed(AZMalpaisBountyQuest, 25, 1);
        } else if (GetObjectiveDisplayed(AZMalpaisBountyQuest, 22) == 1) {
            SetObjectiveCompleted(AZMalpaisBountyQuest, 22, 1);
            SetObjectiveDisplayed(AZMalpaisBountyQuest, 25, 1);
        }

        AZMalpaisBountyQuest.iSerratusDead = 1;
        AZSerratusREF.SetFullNameAlt("Serratus");
    }
