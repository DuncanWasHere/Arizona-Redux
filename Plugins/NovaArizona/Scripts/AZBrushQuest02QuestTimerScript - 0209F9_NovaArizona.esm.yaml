  CompiledScript: 
  SourceCode: >+
    name AZBrushQuest02QuestTimerScript;


    float ITimer;

    int DoOnce;


    GameMode {
        if (!DoOnce && ITimer < AZBrushQuest02.BrushTimer + 3) {
            ITimer = GetGameDaysPassed();
        } else {
            DoOnce = 1;
            SetStage(AZBrushQuest02, 60);
            StopQuest(AZBrushQuest02QuestTimer);
        }
    }
