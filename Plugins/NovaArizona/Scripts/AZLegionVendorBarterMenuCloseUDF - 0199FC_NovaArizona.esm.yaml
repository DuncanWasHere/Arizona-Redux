  CompiledScript: 
  SourceCode: >+
    name AZLegionVendorBarterMenuCloseUDF;


    fn (int iMenuID) {
        if (IsKeyPressed(1) ||
            IsKeyPressed(15) ||
            IsKeyPressed(56) ||
            IsButtonPressed(16)) {
            return;
        }

        SetOnMenuCloseEventHandler(AZLegionVendorBarterMenuCloseUDF, 0, 1053);

        // Retrieve variables from quest
        ref rVendor = AZLegionVendorBarterQuest.rVendor;
        int iPlayerCaps = AZLegionVendorBarterQuest.iPlayerCaps;
        int iPlayerDenarii = AZLegionVendorBarterQuest.iPlayerDenarii;
        int iPlayerAurei = AZLegionVendorBarterQuest.iPlayerAurei;
        int iPlayerLegionCoinValue = AZLegionVendorBarterQuest.iPlayerLegionCoinValue;
        int iVendorCaps = AZLegionVendorBarterQuest.iVendorCaps;
        int iVendorDenarii = AZLegionVendorBarterQuest.iVendorDenarii;

        // Return Legion coins to player
        int iPlayerLegionCoinValueNew = PlayerREF.GetItemCount(Caps001);
        int iPlayerLegionCoinValueDifference = iPlayerLegionCoinValueNew - iPlayerLegionCoinValue;
        int iPlayerAureiPayout = iPlayerLegionCoinValueDifference / 25;

        if (iPlayerLegionCoinValueDifference > 0) { // If transaction was positive
            PlayerREF.AddItem(MoneyLegion25, iPlayerAurei + iPlayerAureiPayout);
            PlayerREF.AddItem(MoneyLegion1, iPlayerDenarii + (iPlayerLegionCoinValueDifference - (iPlayerAureiPayout * 25)));
        } else if (iPlayerLegionCoinValueDifference < 0) { // If transaction was negative
            PlayerREF.AddItem(MoneyLegion25, iPlayerAurei + iPlayerAureiPayout);
            PlayerREF.AddItem(MoneyLegion1, iPlayerDenarii + (iPlayerLegionCoinValueDifference + (iPlayerAurei * 25)));
        } else {
            PlayerREF.AddItem(MoneyLegion1, iPlayerDenarii);
            PlayerREF.AddItem(MoneyLegion25, iPlayerAurei);
        }

        // Return player's caps
        PlayerREF.RemoveItem(Caps001, iPlayerLegionCoinValueNew, 1);
        PlayerREF.AddItem(Caps001, iPlayerCaps, 1);

    	// No longer changing these settings, modifying values directly now
        // Convert item values back to caps
        // SetNumericGameSetting("fBarterBuyBase", AZLegionVendorBarterQuest.fBarterBuyBaseDefault);
        // SetNumericGameSetting("fBarterSellBase", AZLegionVendorBarterQuest.fBarterSellBaseDefault);

        // Revert UI strings to use caps
        con_SetGameSetting("sInventoryCaps", "Caps");
        con_SetGameSetting("sNotEnoughCaps", "You don't have enough caps.");
        con_SetGameSetting("sRepairCost", "Cost: %d caps");

        for ([string sBaseItem, int iBaseValue] in AZLegionVendorBarterQuest.aItemValues) {
            ref rBaseItem = StringToRef(sBaseItem);
            SetValueAlt(rBaseItem, iBaseValue);
        }

        Ar_Erase(AZLegionVendorBarterQuest.aItemValues);
    }
