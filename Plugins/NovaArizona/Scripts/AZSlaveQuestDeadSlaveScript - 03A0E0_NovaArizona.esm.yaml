  CompiledScript: 
  SourceCode: >-
    scn AZSlaveQuestDeadSlaveScript


    short awaitinginput

    short buttonvar


    begin OnActivate

    showmessage AZSlaveQuestDeadSlaveMessage01

    set awaitinginput to 1

    end


    begin GameMode
    	if awaitingInput == 1
    		set buttonVar to getbuttonpressed

    		if buttonVar > -1
    			set awaitingInput to 0

    			if buttonVar == 0
    				showmessage AZSlaveQuestDeadSlaveMessage02
    				set AZMalpaisMarketSlaveQuest.iTongueClue to 1
    			elseif buttonVar == 1
    				showmessage AZSlaveQuestDeadSlaveMessage03
    			endif
    		endif
    	endif
    end
