  SourceCode: >-
    scn AZDeejayOnquestStageUDF


    ref	rQuest

    int	iStageIdx


    begin Function {rQuest, iStageIdx}
    	If AZDeejayREF.bCurrentlyHired != 1
    		Return
    	else

    		if (rQuest == VMS56) && (iStageIdx == 100)
    			AZDeejayREF.startconversation player AZDeejayTopicTrustCplBetsy01

    		elseif (rQuest == AZChlorideAntibioticsQuest) && (iStageIdx == 10) && (getobjectivedisplayed AZChlorideAntibioticsQuest 20 == 1)
    			AZDeejayREF.startconversation player AZDeejayTopicTrustRima01

    		elseif (rQuest == VMS21a) && (iStageIdx == 30)
    			AZDeejayREF.startconversation player AZDeejayTopicTrustByeByeLove01

    		elseif (rQuest == VDialogueVegasNorth) && (iStageIdx == 100)
    			AZDeejayREF.startconversation player AZDeejayTopicTrustWatchOverMe01

    		elseif (rQuest == AZWhiteHillsMineDialogue) && (iStageIdx == 95)
    			AZDeejayREF.startconversation player AZDeejayTopicTrustSubterranean01

    		endif
    		
    	endif
    end
