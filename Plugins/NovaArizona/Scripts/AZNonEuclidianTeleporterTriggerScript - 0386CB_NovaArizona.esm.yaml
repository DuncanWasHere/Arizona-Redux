  CompiledScript: 
  SourceCode: >+
    scn AZNonEuclidianTeleporterTriggerScript


    BEGIN OnTriggerEnter
    	ref rTarget = GetActionRef
    	ref rEntry = GetLinkedRef
    	ref rExit = rEntry.GetLinkedRef

    	float fRelX = rTarget.GetPos X - rEntry.GetPos X
    	float fRelY = rTarget.GetPos Y - rEntry.GetPos Y
    	float fRelZ = rTarget.GetPos Z - rEntry.GetPos Z

    	float fEntryAZ = rEntry.GetAngle Z
    	float fExitAZ  = rExit.GetAngle Z

    	float fAng = fExitAZ - fEntryAZ
    	float fSinA = Sin fAng
    	float fCosA = Cos fAng

    	float fNewX = fRelX * fCosA - fRelY * fSinA
    	float fNewY = fRelX * fSinA + fRelY * fCosA

    	rTarget.SetPos X ( rExit.GetPos X + fNewX )
    	rTarget.SetPos Y ( rExit.GetPos Y + fNewY )
    	rTarget.SetPos Z ( rExit.GetPos Z + fRelZ )
    END
