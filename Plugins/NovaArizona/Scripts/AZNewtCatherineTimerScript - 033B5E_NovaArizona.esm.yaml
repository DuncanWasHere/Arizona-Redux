  CompiledScript: 
  SourceCode: >-
    scn AZNewtCatherineTimerScript


    float iTimer

    float CatherineVariable

    short DoOnce


    BEGIN GameMode


    if DoOnce == 0
    	Set CatherineVariable to GetGameDaysPassed
    	Set DoOnce to 1
    elseif DoOnce == 1
    	if iTimer < CatherineVariable + 0.04
    		iTimer = GetGameDaysPassed
    	else
    		Set AZFreeformNewt.CatherinePissed to 0
    		StopQuest AZNewtCatherineTimer
    	endif
    endif




    if AZNewtCatherineREF.GetDead == 1  || AZNewtCatherineREF.GetDisabled == 1
    	StopQuest AZNewtCatherineTimer
    endif


    END
