  CompiledScript: 
  SourceCode: >+
    name AZSedonusKillQuestScript;


    float iTimer;


    GameMode {
        if (iTimer < AZMalpaisAbuseQuest.MalpaisCooldown + 3) {
            iTimer = GetGameDaysPassed();
        } else {
            AZFreeformMalpais.bOptioinCharge = 1;
        }

        if (AZFreeformMalpais.bOptioinCharge) {
            SetEnemy(PlayerFaction, AZMalpaisLegionFaction, 1, 1);
            SetEnemy(PlayerFaction, AZMalpaisAdjutantFaction, 1, 1);

            AZSedonusSlave01REF.KillActor();
            AZSedonusSlave02REF.KillActor();

            AZSedonusSlave01REF.MoveTo(AZSedonusSlave01MarkerREF);
            AZSedonusSlave02REF.MoveTo(AZSedonusSlave02MarkerREF);

            if (GetObjectiveDisplayed(AZMalpaisAbuseQuest, 60)) {
                if (!AZMalpaisAbuseQuest.NoctisFail) {
                    SetObjectiveCompleted(AZMalpaisAbuseQuest, 60, 1);
                    SetObjectiveDisplayed(AZMalpaisAbuseQuest, 100, 1);
                    StopQuest(AZSedonusKillQuest);
                } else if (AZMalpaisAbuseQuest.NoctisFail) {
                    AZMalpaisNoctisREF.KillActor();
                    SetStage(AZMalpaisAbuseQuest, 255);
                    StopQuest(AZSedonusKillQuest);
                }
            } else if (!GetObjectiveDisplayed(AZMalpaisAbuseQuest, 60)) {
                AZMalpaisNoctisREF.Disable();
                SetStage(AZMalpaisAbuseQuest, 255);
                StopQuest(AZSedonusKillQuest);
            }
        }
    }
