            AZHavenRuceREF.AddScriptPackage(AZHavenRuceIntroPackage);
            AZHavenSerwaREF.AddScriptPackage(AZHavenSerwaIntroPackage);
            AZHavenWierzbowskiREF.AddScriptPackage(AZHavenWierzbowskiIntroPackage);
        } else {
            Disable();
            MarkForDelete();
        }
    }
