  CompiledScript: 
  SourceCode: >-
    name AZMalpaisOptioScript;


    OnDeath {
        if (!GetQuestCompleted(AZArizonaOpenSeason)) {
            AddItem(AZScalpFlaviusConstantinus, 1);
        }

        SetEnemy(AZMalpaisLegionFaction, PlayerFaction);
        SetStage(VMQCaesarFail, 5);
        AddReputationExact(RepNVCaesarsLegion, 0, 100);

        if (!GetQuestCompleted(AZMalpaisBountyQuest)) {
            SetStage(AZMalpaisBountyQuest, 255);
            StopQuest(AZMalpaisBountyQuest);
        }

        if (!GetQuestCompleted(AZMalpaisAbuseQuest)) {
            SetStage(AZMalpaisAbuseQuest, 255);    
        }

        if (!GetQuestCompleted(AZMalpaisAbuserQuest)) {
            SetStage(AZMalpaisAbuserQuest, 255);    
        }
    }
