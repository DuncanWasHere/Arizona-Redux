                SetObjectiveDisplayed(AZGOMAssassinationQuest, 15, 1);
            } else {
                SetObjectiveDisplayed(AZGOMAssassinationQuest, 11, 0);
            }
        }

        if (GetObjectiveDisplayed(AZGOMAssassinationQuest, 3) && !GetObjectiveCompleted(AZGOMAssassinationQuest, 3)) {
            SetObjectiveDisplayed(AZGOMAssassinationQuest, 3, 0);
        }
    }
