  CompiledScript: 
  SourceCode: >-
    scn AZNewtFishingQuestTimer02Script


    int DoOnce

    int QuestProgression

    float Timer



    BEGIN GameMode


    if DoOnce == 0
    	Set QuestProgression to GetGameDaysPassed
    	Set DoOnce to 1
    elseif DoOnce == 1
    	if Timer < QuestProgression + 2
    		Timer = GetGameDaysPassed
    	else
    		SetStage AZNewtFishingQuest 49
    		Set DoOnce to 2
    		StopQuest AZNewtFishingQuestTimer02
    	endif
    endif


    END
