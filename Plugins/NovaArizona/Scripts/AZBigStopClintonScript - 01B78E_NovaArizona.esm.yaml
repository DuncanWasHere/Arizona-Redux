  SourceCode: "name AZBigStopClintonScript;\r\n\r\n// Door Locking Stuff\r\nint bInit;\r\n\r\nint bLockedStore;\r\nint bLockedHouse;\r\nint bGetOut;\r\n\r\nref rStorePackage;\r\nref rStoreCell;\r\nref rStoreDoorREF;\r\n\r\nref rHousePackage;\r\nref rHouseCell;\r\nref rHouseDoorREF;\r\n\r\nref rKey;\r\n\r\nGameMode {\r\n    // Door Locking Stuff\r\n    if (bInit) {\r\n        ref rCurrentPackage = GetCurrentStablePackage();\r\n        \r\n        if (rCurrentPackage == rStorePackage) {\r\n            // Have actor try to kick player out if it's past closing time.\r\n            if ((GameHour >= 21 || GameHour < 6) && !bGetOut) {\r\n                SetPublic(rStoreCell, 0);\r\n                bGetOut = 1;\r\n            }\r\n\r\n        } else if (rCurrentPackage == rHousePackage) {\r\n            // Have actor try to kick player out if they're late for work.\r\n            if ((GameHour >= 6 && GameHour < 21) && !bGetOut) {\r\n                SetPublic(rHouseCell, 0);\r\n                bGetOut = 1;\r\n            }\r\n        }\r\n    }\r\n}\r\n\r\n// This is only triggered by the door locking activator during initialization.\r\nOnTriggerEnter::AZBigStopActivatorClintonDoorLockerREF {\r\n    rStorePackage = AZBigStopClintonStorePackage;\r\n    rStoreCell = AZBigStopGeneralStoreINT;\r\n    rStoreDoorREF = AZBigStopClintonStoreDoorREF;\r\n\r\n    rHousePackage = AZBigStopClintonHousePackage;\r\n    rHouseCell = AZBigStopMotelRoomINT01;\r\n    rHouseDoorREF = AZBigStopClintonHouseDoorREF;\r\n\r\n    rKey = AZKeyBigStopClinton;\r\n\r\n    bInit = 1;\r\n\r\n    AZBigStopActivatorClintonDoorLockerREF.EnterTrigger(PlayerREF);\r\n}\r\n"
