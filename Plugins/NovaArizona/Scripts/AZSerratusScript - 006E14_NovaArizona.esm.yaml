  CompiledScript: 
  SourceCode: >-
    name AZSerratusScript;


    OnDeath {
        if (!GetStageDone(AZMalpaisBountyQuest, 255)) {
            if (IsLimbGone(1)) {
                AddItem(AZserratusHeadMangled, 1);
            } else if (IsInCriticalStage(GooEnd) || IsInCriticalStage(DisintegrateEnd)) {
                AddItem(AZserratusHeadMangled, 1);
            } else {
                AddItem(AZserratusHead, 1);
            }
        }

        AZMalpaisBountyQuest.iSerratusDead = 1;

        SetObjectiveDisplayed(AZMalpaisBountyQuest, 23, 0);
        SetObjectiveDisplayed(AZMalpaisBountyQuest, 24, 0);
    }
