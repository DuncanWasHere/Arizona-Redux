  SourceCode: >-
    scn AZLGVCampfireActivatorScript


    int Button


    BEGIN OnActivate player


    ShowMessage AZLGVHMPActivator02


    END


    BEGIN GameMode


    Set Button to GetButtonPressed


    if Button == 1
    	if Player.GetAV Survival >= 50
    		ShowMessage AZLGVHMPActivator02b
    	else
    		ShowMessage AZLGVHMPActivator02a
    	endif
    endif


    END
