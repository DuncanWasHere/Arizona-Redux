  SourceCode: >+
    name AZLetiDialogueTriggerScript;


    int DoOnce;


    OnTriggerEnter::Player {
    	if (AZBigSparMineLetiREF.GetDisabled() == 0) {
    		if (DoOnce == 0) {
    			AZBigSparMineLetiREF.StartConversation(Player, GREETING);
    			DoOnce = 1;
    			Disable();
    			MarkForDelete();
    		}
    	}

    	if (AZBigSparMineLetiREF.GetDead() == 1) {
    		Disable();
    		MarkForDelete();
    	}
    }
