  CompiledScript: 
  SourceCode: >+
    name AZGreenwaySubstationSwitchScript;


    int DoOnce;

    int iButton;


    OnActivate::Player {
        if (!AZGreenwayJunctionBoxREF.iJunctionBoxRepaired) {
            ShowMessage(AZGreenwaySubstationNotReadyMessage);
        }

        if (AZGreenwayJunctionBoxREF.iJunctionBoxRepaired && !GetStageDone(AZGreenwayWindFarmQuest, 50) && !DoOnce) {
            ShowMessage(AZGreenwaySubstationSwitchMessage);

            if (iButton == 1) {
                SetStage(AZGreenwayWindFarmQuest, 50);
                Activate();
                DoOnce = 1;
            }
        }

        if (GetStage(AZGreenwayWindFarmQuest) > 25 && DoOnce) {
            ShowMessage(AZGreenwaySubstationReadyMessage02);
        }
    }


    GameMode {
        iButton = GetButtonPressed();

        if (iButton == 1 && !DoOnce) {
            SetStage(AZGreenwayWindFarmQuest, 50);
            Activate();
            DoOnce = 1;
        }
    }
