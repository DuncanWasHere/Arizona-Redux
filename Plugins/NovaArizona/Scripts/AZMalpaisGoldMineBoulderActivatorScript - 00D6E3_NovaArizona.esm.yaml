  CompiledScript: 
  SourceCode: >+
    name AZMalpaisGoldMineBoulderActivatorScript;


    int bDoOnce;

    int iButton;            // Current button pressed in menu

    int iMenu;


    OnActivate::PlayerREF {
    	ShowMessage(AZMalpaisGoldMineBoulderMessage01);
    	iMenu = 1;
    }


    GameMode {
    	if (iMenu == 1) {
    		iButton = GetButtonPressed();

    		if (iButton == 0) {
    			Player.RemoveItem(WeapNVDynamite, 3);
    			AZFreeformMalpaisGoldMine.bBoulderDemolished = 1;
    			AZMalpaisGoldMineBoulderActivatorREF.Disable();
    			PlaySound(FXExplosionGrenadeFragHigh);
    			IMOD(FadeToBlackAndBackQuickISFX);
    		} else if (iButton == 1) {
    			iMenu = 0;
    		}
    	}
    }
