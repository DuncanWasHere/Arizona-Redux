  CompiledScript: 
  SourceCode: >-
    name AZBigStopChildSoldierQuestRaftScript;


    int AllRaftsRepaired;

    int RaftRepaired;

    int Button;

    ref ThisRaft;


    OnActivate {
        if (!RaftRepaired) {
            if (IsActionRef(Player)) {
                ShowMessage(AZYTempleBarRaftMessage);
            }
        } else {
            ShowMessage(AZYTempleBarRaftMessageRepaired);
        }
    }


    GameMode {
        if (!RaftRepaired) {
            Button = GetButtonPressed();
            if (Button > 0) {
                if (Button == 1) {
                    if (Player.GetAv(Survival) >= 65) {
                        ShowMessage(AZYTempleBarRaftMessageRepaired);
                        AZBigStopChildSoldierQuest.RaftsRepaired += 1;
                        RewardXP(50);

                        if (GetIsReference(AZCassiaRaftREF01)) {
                            AZCassiaRaftREF01.Disable();
                        } else if (GetIsReference(AZCassiaRaftREF02)) {
                            AZCassiaRaftREF02.Disable();
                        } else if (GetIsReference(AZCassiaRaftREF03)) {
                            AZCassiaRaftREF03.Disable();
                        }
                    } else {
                        ShowMessage(AZYTempleBarRaftMessageLowRepaired);
                    }
                } else if (Button == 2) {
                    Player.RemoveItem(AZRaftRepairWire, 1);
                    ShowMessage(AZYTempleBarRaftMessageRepaired);
                    AZBigStopChildSoldierQuest.RaftsRepaired += 1;
                    RewardXP(50);

                    if (GetIsReference(AZCassiaRaftREF01)) {
                        AZCassiaRaftREF01.Disable();
                    } else if (GetIsReference(AZCassiaRaftREF02)) {
                        AZCassiaRaftREF02.Disable();
                    } else if (GetIsReference(AZCassiaRaftREF03)) {
                        AZCassiaRaftREF03.Disable();
                    }
                }
            }
        }

        if (AZBigStopChildSoldierQuest.RaftsRepaired == 3) {
            SetObjectiveCompleted(AZBigStopChildSoldierQuest, 20, 1);
            RaftRepaired = 1;
        }
    }
