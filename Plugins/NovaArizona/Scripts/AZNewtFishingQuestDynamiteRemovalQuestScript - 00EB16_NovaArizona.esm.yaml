  CompiledScript: 
  SourceCode: >-
    scn AZNewtFishingQuestDynamiteRemovalQuestScript


    int DoOnce

    int Dynamite

    int DynamiteDemand

    int DynamiteRemoved


    BEGIN GameMode


    if DoOnce == 0
    	DisablePlayerControls
    	Set Dynamite to Player.GetItemCount AZDynamiteFormList
    	Set DynamiteDemand to 100
    	Set DoOnce to 1
    elseif DoOnce == 1
    	if Player.GetItemCount WeapNVDynamite > 0
    		Player.RemoveItem WeapNVDynamite 1
    		Set Dynamite to Player.GetItemCount AZDynamiteFormlist
    		Set DynamiteRemoved to DynamiteRemoved + 1
    	elseif Player.GetItemCount WeapNVDynamite == 0
    		Player.RemoveItem WeapNVLongFuseDynamite 1
    		Set Dynamite to Player.GetItemCount AZDynamiteFormlist
    		Set DynamiteRemoved to DynamiteRemoved + 1
    	endif
    	if DynamiteRemoved == 100
    		EnablePlayerControls
    		Set DoOnce to 2
    		;StopQuest AZNewtFishingQuestDynamiteRemovalQuest
    	endif
    endif


    END
