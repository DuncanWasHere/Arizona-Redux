  CompiledScript: 
  SourceCode: >+
    name AZHeadScreamingEagleScript;


    OnAdd::Player {
        // Explode Serratus's head
        AZScreamingEagleREF.Kill(Player, 1);

        if (GetObjectiveDisplayed(AZMalpaisBountyQuest, 11) == 1) {
            SetObjectiveCompleted(AZMalpaisBountyQuest, 11, 1);
            SetObjectiveDisplayed(AZMalpaisBountyQuest, 20, 1);
        } else if (GetObjectiveDisplayed(AZMalpaisBountyQuest, 12) == 1) {
            SetObjectiveCompleted(AZMalpaisBountyQuest, 12, 1);
            SetObjectiveDisplayed(AZMalpaisBountyQuest, 20, 1);
        }

        if (GetStageDone(AZMalpaisBountyQuest, 255) == 0) {
            if (IsLimbGone(1)) {
                AddItem(AZScreamingEagleHeadMangled, 1);
            } else if (IsInCriticalStage(GooEnd) || IsInCriticalStage(DisintegrateEnd)) {
                AddItem(AZScreamingEagleHeadMangled, 1);
            } else {
                AddItem(AZScreamingEagleHead, 1);
            }
        }

        AZMalpaisBountyQuest.iScreamingEagleDead = 1;
        AZScreamingEagleREF.SetFullNameAlt("Screaming Eagle");
    }
