  SourceCode: >-
    scn AZDeejayScript


    ref bCurrentTarget			;for a script to swap to explosives based on target distance


    short bCanBeHired			;introduction is finished and she can be freely hired and fired

    short bCurrentlyHired		;duh

    short bSentToLucky38		;duh

    short bDoOnce				;redundancy to make sure her variables are correctly zeroed

    short bSentToAerotech		;take a guess


    int CombatStyleRanged

    int CombatStyleMelee

    int IsFollowingDefault

    int IsFollowingLong

    int FollowerSwitchAggressive

    int Waiting


    ;------------------------------------------------------


    begin OnCombatEND

    	if GetPlayerTeammate == 1
    		resethealth
    		restoreav perceptioncondition 100
    		restoreav endurancecondition 100
    		restoreav leftattackcondition 100
    		restoreav leftmobilitycondition 100
    		restoreav rightattackcondition 100
    		restoreav rightmobilitycondition 100
    	endif

    end


    ;---------------------------------------------------------


    begin gamemode

    	If (bDoOnce != 1)
    		Set bCurrentlyHired to 0
    		Set bSentToLucky38 to 0
    		Set bSentToAerotech to 0
    		Set CombatStyleRanged to 1
    		Set CombatStyleMelee to 0
    		Set IsFollowingDefault to 0
    		Set IsFollowingLong to 0
    		Set FollowerSwitchAggressive to 0
    		Set Waiting to 0
    		Set bDoOnce to 1
    	EndIf

    		;set bCurrentTarget to getcombattarget
    			;if getdistance3d bCurrentTarget > 500
    				;removeitem AZWeapNV357RevolverDeejay 1
    				;if getitemcount AZWeapNVGrenadeRifleDeejay == 0
    					;additem AZWeapNVGrenadeRifleDeejay 1
    				;endif
    				;equipitem AZWeapNVGrenadeRifleDeejay
    			;endif
    			;if getdistance3d bCurrentTarget < 500
    				;removeitem AZWeapNVGrenadeRifleDeejay 1
    				;if getitemcount AZWeapNV357RevolverDeejay == 0
    					;additem AZWeapNV357RevolverDeejay 1
    				;endif
    				;equipitem AZWeapNV357RevolverDeejay
    			;endif
    end
