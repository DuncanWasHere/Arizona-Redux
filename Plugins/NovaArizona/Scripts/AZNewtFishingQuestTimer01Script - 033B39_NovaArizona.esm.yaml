  CompiledScript: 
  SourceCode: >-
    scn AZNewtFishingQuestTimer01Script


    int DoOnce

    int QuestProgression

    float Timer



    BEGIN GameMode


    if DoOnce == 0
    	Set QuestProgression to GetGameDaysPassed
    	Set DoOnce to 1
    elseif DoOnce == 1
    	if Timer < QuestProgression + 1
    		Timer = GetGameDaysPassed
    	else
    		SetStage AZNewtFishingQuest 9
    		Set DoOnce to 2
    		StopQuest AZNewtFishingQuestTimer01
    	endif
    endif


    END
