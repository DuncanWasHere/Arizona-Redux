  SourceCode: >+
    name AZHDCharlieScript;


    int DoOnce;


    OnStartCombat::PlayerREF {
        if ((GetStageDone(AZHooverDamCheckpointQuest, 5) == 1) &&
            (GetStage(AZHooverDamCheckpointQuest) != 25) &&
            (GetQuestCompleted(AZHooverDamCheckpointQuest) == 0) &&
            (AZHooverDamCheckpointQuest.bBomberDisarmed == 0) &&
            (AZHooverDamCheckpointQuest.bBomberExploded == 0) &&
            (DoOnce == 0) &&
            (AZHooverDamCheckpointQuest.bBomberKilled == 0)) {

            AZSuiciderREF.PlaceAtMe(AZHDExplosion);
            PlayerREF.DamageActorValue(Health, 440);
            AZSuiciderREF.Kill();
            AZHDCheckpointOfficerREF.Kill();
            AZCharlieREF.Kill();
            AZHDNCRTrooper02REF.Kill();
            AZHDNCRTrooper02bREF.Kill();
            AZHDNCRTrooper03aREF.Kill();
            AZHDNCRTrooper03bREF.Kill();
            AZHHRefugee2aaREF.Kill();
            AZHHRefugee2baREF.Kill();
            AddReputationExact(RepNVNCR, 0, 12);
            SetStage(AZHooverDamCheckpointQuest, 25);
            AZHooverDamCheckpointQuest.bBomberExploded = 1;
            AZHDWireREF.MoveTo(AZHDWireMarker);
            EnableFastTravel(1);
            DoOnce = 1;
        }

        if (AZHooverDamCheckpointQuest.bBomberDisarmed == 1) {
            SetEnemy(NCRFactionNV, AZHHRCFactionCheckpoint);
        }

        if (AZHooverDamCheckpointQuest.bBomberUnconscious == 1) {
            SetEnemy(NCRFactionNV, AZHHRCFactionCheckpoint);
        }
    }


    OnDeath {
        if ((GetStageDone(AZHooverDamCheckpointQuest, 5) == 1) &&
            (GetStage(AZHooverDamCheckpointQuest) != 25) &&
            (GetQuestCompleted(AZHooverDamCheckpointQuest) == 0) &&
            (AZHooverDamCheckpointQuest.bBomberDisarmed == 0) &&
            (AZHooverDamCheckpointQuest.bBomberExploded == 0) &&
            (DoOnce == 0) &&
            (AZHooverDamCheckpointQuest.bBomberKilled == 0)) {

            AZSuiciderREF.PlaceAtMe(AZHDExplosion);
            PlayerREF.DamageActorValue(Health, 440);
            AZSuiciderREF.Kill();
            AZHDCheckpointOfficerREF.Kill();
            AZCharlieREF.Kill();
            AZHDNCRTrooper02REF.Kill();
            AZHHRefugee2aaREF.Kill();
            AZHHRefugee2baREF.Kill();
            AddReputationExact(RepNVNCR, 0, 12);
            SetStage(AZHooverDamCheckpointQuest, 25);
            AZHooverDamCheckpointQuest.bBomberExploded = 1;
            AZHDWireREF.MoveTo(AZHDWireMarker);
            EnableFastTravel(1);
            DoOnce = 1;
        }

        if (AZHooverDamCheckpointQuest.bBomberDisarmed == 1) {
            SetEnemy(NCRFactionNV, AZHHRCFactionCheckpoint);
        }

        if (AZHooverDamCheckpointQuest.bBomberUnconscious == 1) {
            SetEnemy(NCRFactionNV, AZHHRCFactionCheckpoint);
        }
    }
