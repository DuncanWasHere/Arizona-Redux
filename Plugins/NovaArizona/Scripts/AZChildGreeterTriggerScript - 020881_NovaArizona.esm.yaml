  SourceCode: >-
    name AZChildGreeterTriggerScript;


    int DoOnce;


    OnTriggerEnter::Player {
        if (!DoOnce
            && !AZMalpaisJournalistQuest.ChildGreetDoOnce
            && !AZStanleyHartfordREF.GetTalkedToPC()
            && !AZStanleyHartfordREF.GetDead()
            && (GetStage(AZMalpaisJournalistQuest) == 0)) 
        {
            AZMalpaisChildGreeterREF.AddScriptPackage(AZMalapisChildGreeterForceGreetPackage);
            AZMalpaisChildGreeterREF.SetSpeedMult(250);
            Disable();
            DoOnce = 1;
        }
    }
