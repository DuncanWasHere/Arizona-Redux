  SourceCode: >+
    name AZBomberTriggerScript;


    int DoOnce;


    OnTriggerEnter::Player {
        if (GetStageDone(AZHooverDamCheckpointQuest, 5) && !DoOnce && !GetQuestCompleted(AZHooverDamCheckpointQuest)) {
            if (!AZHooverDamCheckpointQuest.bBomberExploded) {
                if (!AZHooverDamCheckpointQuest.bBomberDisarmed) {
                    if (!GetStageDone(AZHooverDamCheckpointQuest, 15) || GetObjectiveDisplayed(AZHooverDamCheckpointQuest, 16)) {
                        SetStage(AZHooverDamCheckpointQuest, 50);
                        AZSuiciderREF.PlaceAtMe(AZHDExplosion);
                        AZCharlieREF.KillActor();
                        AZHDCheckpointOfficerREF.KillActor();
                        AZHDNCRTrooper02REF.KillActor();
                        AZHDNCRTrooper02bREF.KillActor();
                        AZHDNCRTrooper03aREF.KillActor();
                        AZHDNCRTrooper03bREF.KillActor();
                        AZSuiciderREF.KillActor();
                        AZHHRefugee2aaREF.KillActor();
                        AZHHRefugee2baREF.KillActor();
                        DoOnce = 1;
                        AddReputationExact(RepNVNCR, 0, 12);
                        AZHooverDamCheckpointQuest.bBomberExploded = 1;
                        EnableFastTravel(1);
                    }
                }

                if (AZHooverDamCheckpointQuest.bBomberTimetoFlee && !GetStageDone(AZHooverDamCheckpointQuest, 25)) {
                    SetStage(AZHooverDamCheckpointQuest, 50);
                    AZSuiciderREF.PlaceAtMe(AZHDExplosion);
                    AZHDCheckpointOfficerREF.KillActor();
                    AZCharlieREF.KillActor();
                    AZHDNCRTrooper02REF.KillActor();
                    AZHDNCRTrooper02bREF.KillActor();
                    AZHDNCRTrooper03aREF.KillActor();
                    AZHDNCRTrooper03bREF.KillActor();
                    AZSuiciderREF.KillActor();
                    AZHHRefugee2aaREF.KillActor();
                    AZHHRefugee2baREF.KillActor();
                    DoOnce = 1;
                    AddReputationExact(RepNVNCR, 0, 12);
                    AZHooverDamCheckpointQuest.bBomberExploded = 1;
                    EnableFastTravel(1);
                }

            } else if (AZHooverDamCheckpointQuest.bBomberExploded) {
                if (!GetStageDone(AZHooverDamCheckpointQuest, 40)) {
                    EnableFastTravel(1);
                    SetStage(AZHooverDamCheckpointQuest, 61);
                    AddReputationExact(RepNVNCR, 0, 6);
                    DoOnce = 1;
                }
            }

            if (AZHooverDamCheckpointQuest.bBomberDisarmed || AZHooverDamCheckpointQuest.bBomberReadytoBeDisarmed) {
                SetEnemy(NCRFactionNV, AZHHRCFactionCheckpoint);
                AZSuiciderREF.KillActor();
                SetStage(AZHooverDamCheckpointQuest, 61);
                DoOnce = 1;
            }

            if (AZHooverDamCheckpointQuest.bBomberUnconscious) {
                EnableFastTravel(1);
                SetStage(AZHooverDamCheckpointQuest, 61);
                AZSuiciderREF.PlaceAtMe(AZHDExplosion);
                AZHDCheckpointOfficerREF.KillActor();
                AZCharlieREF.KillActor();
                AZHDNCRTrooper02REF.KillActor();
                AZHDNCRTrooper02bREF.KillActor();
                AZHDNCRTrooper03aREF.KillActor();
                AZHDNCRTrooper03bREF.KillActor();
                AZSuiciderREF.KillActor();
                AZHHRefugee2aaREF.KillActor();
                AZHHRefugee2baREF.KillActor();
                AddReputationExact(RepNVNCR, 0, 6);
                SetEnemy(NCRFactionNV, AZHHRCFactionCheckpoint);
                DoOnce = 1;
            }
        }
    }
