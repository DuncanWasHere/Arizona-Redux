  CompiledScript: 
  SourceCode: >-
    name AZBigStopDeadDropScript;


    int HolotapeDelivered;


    OnActivate::Player {
        if (!HolotapeDelivered) {
            if (Player.GetItemCount(AZAhigaRangerHolotape) >= 1) {
                ShowMessage(AZDeadDropMessage);
                Player.RemoveItem(AZAhigaRangerHolotape, 100);
                HolotapeDelivered = 1;

                if (GetObjectiveDisplayed(AZBigStopAhigaQuest01, 31) && !GetObjectiveCompleted(AZBigStopAhigaQuest01, 31) && !GetQuestCompleted(AZBigStopAhigaQuest01)) {
                    SetObjectiveCompleted(AZBigStopAhigaQuest01, 31, 1);
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 33, 1);
                }
            } else {
                HolotapeDelivered = 1;
                Activate();
            }
        } else {
            Activate();
        }
    }
