  CompiledScript: 
  SourceCode: >-
    name AZSolitareBunkerAutoclosingDoorScript;


    float doorTimer;

    int closeDoor;


    GameMode {
        if (closeDoor) {
            if (doorTimer > 0) {
                doorTimer -= GetSecondsPassed();
            } else if (GetOpenState() == 1) {   ; // if the door is still open
                SetOpenState(0);               ; // close the door
                closeDoor = 0;
            }
        }
    }


    OnActivate {
        if (GetOpenState() == 3) {            ; // if the door is closed
            doorTimer = 10;
            closeDoor = 1;
        }
        Activate();
    }
