  CompiledScript: 
  SourceCode: >-
    name AZMalpaisSedonusSunsetSasparillaScript;


    int SaspButton;

    int Menu;

    int SasSpiked;

    int DoOnce;


    OnActivate::player {
        if (IsActionRef(Player)) {
            if (Player.IsInCombat()) {
                ShowMessage(AZSedonusSasparillaCombatMessage);
            } else if (!Player.IsInCombat() && !SasSpiked) {
                if (!AZMalpaisAbuseQuest.TempSmoochKnown) {
                    ShowMessage(AZSedonusSasparilla00a);
                } else if (AZMalpaisAbuseQuest.TempSmoochKnown) {
                    ShowMessage(AZSedonusSasparilla00b);
                }
            } else if (!Player.IsInCombat() && SasSpiked) {
                ShowMessage(AZSedonusSasparillaSpiked);
            }
        }
    }


    OnActivate {
        if (IsActionRef(Player)) {
            if (Player.IsInCombat()) {
                ShowMessage(AZSedonusSasparillaCombatMessage);
            } else if (!Player.IsInCombat()) {
                if (!AZMalpaisAbuseQuest.TempSmoochKnown) {
                    ShowMessage(AZSedonusSasparilla00a);
                } else if (AZMalpaisAbuseQuest.TempSmoochKnown) {
                    ShowMessage(AZSedonusSasparilla00b);
                }
            }
        }
    }


    GameMode {
        SaspButton = GetButtonPressed();

        if (!SasSpiked) {
            if (SaspButton == 0) {
                Return;
            } else if (SaspButton == 1) {
                Player.RemoveItem(MS09Ultrajet, 3);
                SasSpiked = 1;
                SetObjectiveCompleted(AZMalpaisAbuseQuest, 55, 1);
            } else if (SaspButton == 2) {
                Player.RemoveItem(Psycho, 5);
                SasSpiked = 1;
                SetObjectiveCompleted(AZMalpaisAbuseQuest, 55, 1);
            } else if (SaspButton == 3) {
                Player.RemoveItem(AZSmooch, 1);
                SasSpiked = 1;
                SetObjectiveCompleted(AZMalpaisAbuseQuest, 55, 1);
            }
        } else if (SasSpiked && !DoOnce) {
            ShowMessage(AZSedonusSasparillaSpiked);
            DoOnce = 1;
        }
    }
