  CompiledScript: 
  SourceCode: >-
    scn AZPirateLockerScript


    int Button


    BEGIN OnActivate player

    if AZFreeformLakeMead.GunsStored == 0
    	ShowMessage AZPirateLockerMessage
    else
    	Activate
    endif


    END



    BEGIN GameMode


    Set Button to GetButtonPressed

    if Button == 1
    	Player.RemoveAllTypedItems AZPirateLockerREF 1 0 40
    	Set AZFreeformLakeMead.GunsStored to 1
    	Set Button to 0
    endif


    if AZPirateLockerREF.GetItemCount NVAllWeapons == 0
    	Set AZFreeformLakeMead.GunsStored to 0
    endif


    END
