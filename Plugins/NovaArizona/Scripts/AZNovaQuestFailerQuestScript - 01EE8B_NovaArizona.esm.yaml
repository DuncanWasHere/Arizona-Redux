  CompiledScript: 
  SourceCode: >-
    name AZNovaQuestFailerQuestScript;


    GameMode {
        if (GetQuestCompleted(VMQCaesarFail)) {
            if (!GetQuestCompleted(AZBaseCampReservationQuest)) {
                SetStage(AZBaseCampReservationQuest, 255);
            }

            if (!GetQuestCompleted(AZBaseCampRomanceQuest)) {
                SetStage(AZBaseCampRomanceQuest, 250);
            }

            if (GetStage(AZBigStopAhigaQuest01) != 64 && GetStage(AZBigStopAhigaQuest01) < 70) {
                SetStage(AZBigStopAhigaQuest01, 255);
            } else if (GetStage(AZBigStopAhigaQuest01) >= 70) {
                if (GetObjectiveDisplayed(AZBigStopAhigaQuest01, 45) && !GetObjectiveCompleted(AZBigStopAhigaQuest01, 45)) {
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 45, 0);
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 46, 1);
                    AZAhigaMessageActivatorREF.Enable();
                }
                if (AZBigStopAhigaQuest01.AhigaMeeting >= 1) {
                    AZBigStopAhigaREF.RemoveFromFaction(ArmorVCaesarsLegionFaction);
                    AZBigStopAhigaREF.RemoveFromFaction(AZBigStopLegionFaction);
                    AZBigStopAhigaREF.RemoveFromFaction(VCaesarsLegionFaction);
                }
                if (GetObjectiveDisplayed(AZBigStopAhigaQuest01, 55) && !GetObjectiveCompleted(AZBigStopAhigaQuest01, 55)) {
                    SetObjectiveDisplayed(AZBigStopAhigaQuest01, 55, 1);
                }
            }

            if (!GetQuestCompleted(AZBigStopAugustQuest)) {
                SetStage(AZBigStopAugustQuest, 255);
            }

            if (!GetQuestCompleted(AZBigStopClariceQuest)) {
                SetStage(AZBigStopClariceQuest, 10);
            }

            if (!GetQuestCompleted(AZBigStopFindDogQuest)) {
                SetStage(AZBigStopFindDogQuest, 255);
            }

            if (!GetQuestCompleted(AZChlorideAntibioticsQuest)) {
                FailQuest(AZChlorideAntibioticsQuest);
            }

            if (!GetQuestCompleted(AZChlorideElectionQuest)) {
                SetStage(AZChlorideElectionQuest, 255);
            }

            if (!GetQuestCompleted(AZMalpaisAbuseQuest)) {
                SetStage(AZMalpaisAbuseQuest, 255);
            }

            if (!GetQuestCompleted(AZMalpaisAbuserQuest)) {
                SetStage(AZMalpaisAbuserQuest, 255);
            }

            if (!GetQuestCompleted(AZMalpaisBountyQuest)) {
                SetStage(AZMalpaisBountyQuest, 255);
            }

            if (!GetQuestCompleted(AZMalpaisJournalistQuest)) {
                SetStage(AZMalpaisJournalistQuest, 255);
            }

            if (!GetQuestCompleted(AZNewtLegionGraffitiQuest)) {
                SetStage(AZNewtLegionGraffitiQuest, 255);
            }

            if (!GetQuestCompleted(AZSmartArrayQuest)) {
                SetStage(AZSmartArrayQuest, 255);
            }
        }
    }
