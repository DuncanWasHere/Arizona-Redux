  CompiledScript: 
  SourceCode: >-
    scn AZHavenIntroQuestScript


    short RuceGreetVariable

    short MurrayGreetVariable

    short RuceEndVariable ; 1 = Ruce is not going to kill you, 2 = Ruce is going to kill you

    short BarksComplete


    BEGIN GameMode


    if AZHavenIntroQuest.BarksComplete == 2
    	Set AZHavenIntroQuest.MurrayGreetVariable to 3
    	Set AZFreeformHaven.HavenEntrance to 1
    	AZHavenBenjaminREF.evp
    	AZHavenCalREF.evp
    	AZHavenDocREF.evp
    	AZHavenJobREF.evp
    	AZHavenMurrayREF.evp
    	AZHavenRipleyREF.evp
    	AZHavenRuceREF.evp
    	AZHavenSerwaREF.evp
    	AZHavenWierzbowskiREF.evp
    	StopQuest AZHavenIntroQuest
    else
    	AZHavenBenjaminREF.AlwaysShowActorSubtitles 1
    	AZHavenCalREF.AlwaysShowActorSubtitles 1
    	AZHavenDocREF.AlwaysShowActorSubtitles 1
    	AZHavenJobREF.AlwaysShowActorSubtitles 1
    	AZHavenMurrayREF.AlwaysShowActorSubtitles 1
    	AZHavenRipleyREF.AlwaysShowActorSubtitles 1
    	AZHavenRuceREF.AlwaysShowActorSubtitles 1
    	AZHavenSerwaREF.AlwaysShowActorSubtitles 1
    	AZHavenWierzbowskiREF.AlwaysShowActorSubtitles 1
    endif


    if AZHavenIntroQuest.RuceGreetVariable == 1
    	AZHavenRuceREF.AddScriptPackage AZHavenRuceGreetPackageNEW
    endif


    if AZHavenIntroQuest.MurrayGreetVariable == 1
    	AZHavenMurrayREF.AddScriptPackage AZHavenMurrayGreetPackageNEW
    	AZHavenBenjaminREF.RemoveScriptPackage AZHavenBenjaminIntroPackage
    	AZHavenCalREF.RemoveScriptPackage AZHavenCalIntroPackage
    	AZHavenDocREF.RemoveScriptPackage AZHavenDocIntroPackage
    	AZHavenMurrayREF.RemoveScriptPackage AZHavenMurrayIntroPackage
    	AZHavenRipleyREF.RemoveScriptPackage AZHavenRipleyIntroPackage
    	AZHavenRuceREF.RemoveScriptPackage AZHavenRuceIntroPackage
    	AZHavenSerwaREF.RemoveScriptPackage AZHavenSerwaIntroPackage
    	AZHavenWierzbowskiREF.RemoveScriptPackage AZHavenWierzbowskiIntroPackage
    endif


    if Player.IsInCombat == 1
    	Set AZHavenIntroQuest.MurrayGreetVariable to 3
    	AZHavenBenjaminREF.evp
    	AZHavenCalREF.evp
    	AZHavenDocREF.evp
    	AZHavenJobREF.evp
    	AZHavenMurrayREF.evp
    	AZHavenRipleyREF.evp
    	AZHavenRuceREF.evp
    	AZHavenSerwaREF.evp
    	AZHavenWierzbowskiREF.evp
    	StopQuest AZHavenIntroQuest
    endif


    if Player.GetInCell AZHavenINT == 0
    	StopQuest AZHavenIntroQuest
    endif


    END
