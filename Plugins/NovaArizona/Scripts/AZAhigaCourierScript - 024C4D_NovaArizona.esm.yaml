  SourceCode: >-
    name AZAhigaCourierScript;


    OnDeath {
    	if (GetStage(VMQCaesarFail) == 5) {
    		AZ188CourierREF.AddItem(AZAhigaNote01, 1);
    	} else if (GetStage(VMQCaesarFail) == 0) {
    		if (GetReputationThreshold(RepNVNCR, 1) >= 4 && GetReputationThreshold(RepNVCaesarsLegion, 1) >= 4) {
    			AZ188CourierREF.AddItem(AZAhigaNote04, 1);
    		} else if (GetReputationThreshold(RepNVNCR, 1) >= 4 && GetReputationThreshold(RepNVCaesarsLegion, 1) < 4) {
    			AZ188CourierREF.AddItem(AZAhigaNote02, 1);
    		} else if (GetReputationThreshold(RepNVNCR, 1) < 4 && GetReputationThreshold(RepNVCaesarsLegion, 1) >= 4) {
    			AZ188CourierREF.AddItem(AZAhigaNote03, 1);
    		} else {
    			AZ188CourierREF.AddItem(AZAhigaNote04, 1);
    		}
    	}
    }
