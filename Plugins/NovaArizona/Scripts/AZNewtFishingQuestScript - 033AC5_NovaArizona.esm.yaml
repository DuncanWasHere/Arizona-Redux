  SourceCode: >-
    scn AZNewtFishingQuestScript


    int OriaConfront

    int DealNegotiated ; will be used for the timer to advance the quest for Ammon-Ra to negotiate with the raiders

    int DynamiteDelivered ; used for the timer to advance the quest to the Lakelurk stage

    int LakelurksKilled ; Attach this script to Lakelurk scripts and tick up like the Great Khans

    int BossLakelurksKilled

    int HiveCleared

    int BeccaPay

    int BeccaDisinterest

    int OriaReward

    int PiratesDiscussed

    int DoorsUnlocked

    int GeneratorsSettoBlow


    int DynamiteMethod ; 1 = Legion, 2 = Player, 3 = Union Mine, 4 = Ammon-Ra


    ; Use the global AZStoryEventNewt for ending, 1 = Lakelurks continue to attack, 2 = Legion clamps down, Newt grows more dependent, 3 = Lake Mead facility destroyed, Newt grows more independent

    ; Ending states will also affect the global



    BEGIN GameMode


    if GetStage AZNewtFishingQuest >= 5 && AZNewtFishingQuest < 10 && DynamiteMethod == 0
    	if Player.GetItemCount AZDynamiteFormList >= 100
    		SetObjectiveCompleted AZNewtFishingQuest 5 1
    		SetObjectiveCompleted AZNewtFishingQuest 6 1
    		SetObjectiveDisplayed AZNewtFishingQuest 15 1
    	else
    		SetObjectiveCompleted AZNewtFishingQuest 5 0
    		SetObjectiveCompleted AZNewtFishingQuest 6 0
    		SetObjectiveDisplayed AZNewtFishingQuest 15 0
    	endif
    endif


    if GeneratorsSettoBlow == 1 && Player.GetInCell AZLakeMeadLaboratoryINT == 0
    	if GetStage AZNewtFishingQuest == 50
    		SetStage AZNewtFishingQuest 60
    		Set AZNewtFishingQuest.HiveCleared to 1
    		Set AZNewtFishingQuest.LakelurksKilled to 10
    		Set AZNewtFishingQuest.BossLakelurksKilled to 5
    	elseif AZNewtFishingQuest < 50
    		Set AZNewtFishingQuest.HiveCleared to 1
    		Set AZNewtFishingQuest.LakelurksKilled to 10
    		Set AZNewtFishingQuest.BossLakelurksKilled to 5
    	elseif AZNewtFishingQuest == 100
    		Set AZNewtFishingQuest.HiveCleared to 2
    		Set AZNewtFishingQuest.LakelurksKilled to 10
    		Set AZNewtFishingQuest.BossLakelurksKilled to 5
    	endif
    endif


    END
