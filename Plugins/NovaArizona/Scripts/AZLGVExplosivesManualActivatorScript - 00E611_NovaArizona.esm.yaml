  CompiledScript: 
  SourceCode: >-
    scn AZLGVExplosivesManualActivatorScript


    BEGIN OnActivate player


    if Player.GetAV Explosives < 50 && Player.GetAV Perception < 5 && AZStatioFindFriendQuest.CarlosClue == 0
    	ShowMessage AZLGVMineMessage03
    elseif Player.GetAV Explosives >= 50 && Player.GetAV Perception < 5
    	ShowMessage AZLGVMineMessage04
    	SetStage AZStatioFindFriendQuest 25
    elseif Player.GetAV Explosives < 50 && (Player.GetAV Perception >= 5 || AZStatioFindFriendQuest.CarlosClue == 1)
    	ShowMessage AZLGVMineMessage01
    	SetStage AZStatioFindFriendQuest 25
    elseif Player.GetAV Explosives >= 50 && (Player.GetAV Perception >= 5 || AZStatioFindFriendQuest.CarlosClue == 1) 
    	ShowMessage AZLGVMineMessage02
    	SetStage AZStatioFindFriendQuest 25
    endif


    END
