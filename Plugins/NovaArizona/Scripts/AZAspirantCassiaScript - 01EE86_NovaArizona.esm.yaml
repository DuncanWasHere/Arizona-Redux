        if (GetObjectiveCompleted(AZMalpaisAbuseQuest, 36)) {
            SetObjectiveDisplayed(AZBigStopChildSoldierQuest, 40, 1);

            AZJawRipperREF.AddScriptPackage(AZJawRipperConfrontPackage);
            AZJawRipperREF.EVP();
        }

        if (GetStage(AZBigStopChildSoldierQuest) != 200) {
            AZJawRipperREF.AddScriptPackage(AZJawRipperConfrontPackage);
            AZJawRipperREF.EVP();
        }

        if (GetObjectiveDisplayed(AZMalpaisAbuseQuest, 160) &&
            !GetObjectiveCompleted(AZMalpaisAbuseQuest, 160)) 
        {
            SetObjectiveDisplayed(AZMalpaisAbuseQuest, 160, 0);
        }
    }
