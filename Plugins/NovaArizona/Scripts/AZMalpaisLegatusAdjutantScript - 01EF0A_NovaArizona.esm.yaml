  CompiledScript: 
  SourceCode: >-
    name AZMalpaisLegatusAdjutantScript;


    OnDeath {
        if (!GetObjectiveDisplayed(AZMalpaisAbuserQuest, 60)) {
            SetStage(AZMalpaisAbuserQuest, 255);
            SetEnemy(PlayerFaction, AZMalpaisLegionFaction);
        } else if (GetObjectiveDisplayed(AZMalpaisAbuserQuest, 60)) {
            if (!GetQuestCompleted(AZMalpaisAbuserQuest)) {
                SetObjectiveCompleted(AZMalpaisAbuserQuest, 60, 1);

                SetEnemy(PlayerFaction, AZMalpaisLegionFaction, 1, 1);
                SetEnemy(PlayerFaction, VCaesarsLegionFaction, 1, 1);

                AZMalpaisEquipmentConfiscationQuest.bHoldout = 0;
                AZFreeformMalpais.bNotGoingIntoCamp = 0;

                StartQuest(AZMalpaisEquipmentConfiscationQuest);
            } else if (GetQuestCompleted(AZMalpaisAbuserQuest)) {
                SetStage(VMQCaesarFail, 5);
            }
        }
    }


    OnStartCombat::player {
        if (!GetObjectiveDisplayed(AZMalpaisAbuserQuest, 60)) {
            SetStage(AZMalpaisAbuserQuest, 255);
            SetEnemy(PlayerFaction, AZMalpaisLegionFaction);
        }
    }
