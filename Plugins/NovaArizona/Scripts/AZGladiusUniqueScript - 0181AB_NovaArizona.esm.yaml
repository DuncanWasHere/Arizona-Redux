  CompiledScript: 
  SourceCode: >-
    name AZGladiusUniqueScript;


    // This script controls the bonus AP effect of the unique Gladius


    int bEquipped;


    OnSell::Player {
        Player.RemoveSpell(AZActorEffectGladiusUnique);
        bEquipped = 0;
    }


    GameMode {
        if (!bEquipped) {
            if (Player.GetEquipped(AZWeapGladiusUnique)) {
                Player.AddSpell(AZActorEffectGladiusUnique);
                bEquipped = 1;
            }
        } else {
            if (!Player.GetEquipped(AZWeapGladiusUnique)) {
                Player.RemoveSpell(AZActorEffectGladiusUnique);
                bEquipped = 0;
            }
        }
    }
