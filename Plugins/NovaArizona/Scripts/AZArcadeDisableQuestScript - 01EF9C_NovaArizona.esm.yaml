  CompiledScript: 
  SourceCode: >-
    scn AZArcadeDisableQuestScript


    short ArcadeTreatment

    short DoOnce


    int iTimer


    BEGIN GameMode


    if iTimer < ArcadeTreatment + 6 && DoOnce == 0
    		iTimer = GetGameDaysPassed
    else
    	ArcadeREF.enable
    	ArcadeREF.MoveTo ArcadeHomeMarker
    	Player.AddItem AZArcadeReturnNote 1
    	ShowMessage FollowerMessageLeaveArcade
    	Set DoOnce to 1
    	StopQuest AZArcadeDisableQuest
    endif


    END
