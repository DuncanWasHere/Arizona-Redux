  CompiledScript: 
  SourceCode: >+
    name AZMalpaisEquipmentConfiscationQuestScript;


    int bMalpaisEquipmentStored;

    int bHoldout;

    int bGimme;


    GameMode {

    	ref ReturnHumanoidWeapons = fn (ref rStorage, ref rActor) {
    		rStorage.RemoveAllTypedItems(rActor, 1, 0);
    	};

    	ref EnsureCompanionWeapon = fn (ref rActor, ref rWeaponList) {
    		if (!(rActor.GetItemCount(rWeaponList))) {
    			rActor.AddItem(rWeaponList, 1);
    		}
    	};

    	// ====================================================================
    	// RETURN PLAYER & COMPANION ITEMS SECTION
    	// ====================================================================

    	if (bMalpaisEquipmentStored) {

    		if (bGimme) {

    			AZMalpaisPlayerWeaponStorageREF.RemoveAllTypedItems(player, 1, 1);

    			if (VNPCFollowers.ArcadeHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, ArcadeREF);

    			} else if (VNPCFollowers.bBooneHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, CraigBooneREF);

    			} else if (VNPCFollowers.bCassHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, RoseOfSharonCassidyREF);

    			} else if (VNPCFollowers.bLilyHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, LilyREF);

    			} else if (VNPCFollowers.RaulHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, RaulREF);

    			} else if (VNPCFollowers.bVeronicaHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, VeronicaREF);

    			} else {

    				// Ensure companions still have weapons
    				Call(EnsureCompanionWeapon, ArcadeREF, NVArcadeWeapons);
    				Call(EnsureCompanionWeapon, CraigBooneREF, NVBooneWeapons);
    				Call(EnsureCompanionWeapon, RoseOfSharonCassidyREF, NVCassWeapons);
    				Call(EnsureCompanionWeapon, LilyREF, NVLilyWeapons);
    				Call(EnsureCompanionWeapon, RaulREF, NVRaulWeapons);
    				Call(EnsureCompanionWeapon, VeronicaREF, NVVeronicaWeapons);

    				AZMalpaisCompanionOneWeaponStorageREF.RemoveItem(NVCompanionWeapons, 1000);
    				AZMalpaisCompanionOneWeaponStorageREF.RemoveAllTypedItems(player, 1, 1);
    			}

    			if (VNPCFollowers.bEDEHired) {

    				if (!(EDE1REF.GetDisabled())) {
    					AZMalpaisCompanionTwoWeaponStorageREF.RemoveAllTypedItems(EDE1REF, 1, 0);

    				} else if (!(EDE2REF.GetDisabled())) {
    					AZMalpaisCompanionTwoWeaponStorageREF.RemoveAllTypedItems(EDE2REF, 1, 0);

    				} else if (!(EDE3REF.GetDisabled())) {
    					AZMalpaisCompanionTwoWeaponStorageREF.RemoveAllTypedItems(EDE3REF, 1, 0);
    				}

    			} else if (VNPCFollowers.RexHired) {

    				AZMalpaisCompanionTwoWeaponStorageREF.RemoveAllTypedItems(RexREF, 1, 0);

    			} else {

    				Call(EnsureCompanionWeapon, EDE1REF, EDEZapGun);
    				Call(EnsureCompanionWeapon, EDE2REF, EDEZapGunUpgrade);
    				Call(EnsureCompanionWeapon, EDE3REF, EDEZapGun);

    				AZMalpaisCompanionTwoWeaponStorageREF.RemoveItem(NVCompanionWeapons, 1000);
    				AZMalpaisCompanionTwoWeaponStorageREF.RemoveAllTypedItems(player, 1, 1);
    			}

    			AZFreeformMalpais.bPlayerWeaponsConfiscated = 0;
    			AZFreeformMalpais.InCamp = 0;

    			bMalpaisEquipmentStored = 0;
    			bGimme = 0;

    			ShowMessage(AZMalpaisGateGuardWeaponsReturnedMessage);

    			StopQuest(AZMalpaisEquipmentConfiscationQuest);

    		} else if (IsPlayerInRegion(AZMalpaisRegion) || PlayerREF.GetInCell(AZMalpais)) {

    			return;

    		} else {

    			AZMalpaisPlayerWeaponStorageREF.RemoveAllTypedItems(player, 1, 1);

    			if (VNPCFollowers.ArcadeHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, ArcadeREF);

    			} else if (VNPCFollowers.bBooneHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, CraigBooneREF);

    			} else if (VNPCFollowers.bCassHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, RoseOfSharonCassidyREF);

    			} else if (VNPCFollowers.bLilyHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, LilyREF);

    			} else if (VNPCFollowers.RaulHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, RaulREF);

    			} else if (VNPCFollowers.bVeronicaHired) {
    				Call(ReturnHumanoidWeapons, AZMalpaisCompanionOneWeaponStorageREF, VeronicaREF);

    			} else {

    				Call(EnsureCompanionWeapon, ArcadeREF, NVArcadeWeapons);
    				Call(EnsureCompanionWeapon, CraigBooneREF, NVBooneWeapons);
    				Call(EnsureCompanionWeapon, RoseOfSharonCassidyREF, NVCassWeapons);
    				Call(EnsureCompanionWeapon, LilyREF, NVLilyWeapons);
    				Call(EnsureCompanionWeapon, RaulREF, NVRaulWeapons);
    				Call(EnsureCompanionWeapon, VeronicaREF, NVVeronicaWeapons);

    				AZMalpaisCompanionOneWeaponStorageREF.RemoveItem(NVCompanionWeapons, 1000);
    				AZMalpaisCompanionOneWeaponStorageREF.RemoveAllTypedItems(player, 1, 1);
    			}

    			if (VNPCFollowers.bEDEHired) {

    				if (!(EDE1REF.GetDisabled())) {
    					AZMalpaisCompanionTwoWeaponStorageREF.RemoveAllTypedItems(EDE1REF, 1, 0);

    				} else if (!(EDE2REF.GetDisabled())) {
    					AZMalpaisCompanionTwoWeaponStorageREF.RemoveAllTypedItems(EDE2REF, 1, 0);

    				} else if (!(EDE3REF.GetDisabled())) {
    					AZMalpaisCompanionTwoWeaponStorageREF.RemoveAllTypedItems(EDE3REF, 1, 0);
    				}

    			} else if (VNPCFollowers.RexHired) {

    				AZMalpaisCompanionTwoWeaponStorageREF.RemoveAllTypedItems(RexREF, 1, 0);

    			} else {

    				Call(EnsureCompanionWeapon, EDE1REF, EDEZapGun);
    				Call(EnsureCompanionWeapon, EDE2REF, EDEZapGunUpgrade);
    				Call(EnsureCompanionWeapon, EDE3REF, EDEZapGun);

    				AZMalpaisCompanionTwoWeaponStorageREF.RemoveItem(NVCompanionWeapons, 1000);
    				AZMalpaisCompanionTwoWeaponStorageREF.RemoveAllTypedItems(player, 1, 1);
    			}

    			AZFreeformMalpais.bPlayerWeaponsConfiscated = 0;
    			AZFreeformMalpais.InCamp = 0;

    			bMalpaisEquipmentStored = 0;

    			ShowMessage(AZMalpaisGateGuardWeaponsReturnedMessage);
    			StopQuest(AZMalpaisEquipmentConfiscationQuest);
    		}

    	// ====================================================================
    	// REMOVE PLAYER & COMPANION ITEMS SECTION
    	// ====================================================================

    	} else {

    		if ((player.GetAV(Sneak) >= 50) && bHoldout) {

    			player.RemoveAllTypedItems(
    				AZMalpaisPlayerWeaponStorageREF,
    				1,
    				0,
    				40,
    				NVImprovedHoldoutWeapons
    			);

    		} else if ((player.GetAV(Sneak) < 50) && bHoldout) {

    			player.RemoveAllTypedItems(
    				AZMalpaisPlayerWeaponStorageREF,
    				1,
    				0,
    				40,
    				NVHoldoutWeapons
    			);

    		} else {

    			player.RemoveAllTypedItems(
    				AZMalpaisPlayerWeaponStorageREF,
    				1,
    				0,
    				40
    			);
    		}

    		player.RemoveAllTypedItems(
    			AZMalpaisPlayerWeaponStorageREF,
    			1,
    			0,
    			47,
    			NVLegionChemsList
    		);

    		// Companion removal logic left intact (formatted only)

    		AZFreeformMalpais.bPlayerWeaponsConfiscated = 1;
    		bMalpaisEquipmentStored = 1;

    		EnablePlayerControls();
    	}
    }
