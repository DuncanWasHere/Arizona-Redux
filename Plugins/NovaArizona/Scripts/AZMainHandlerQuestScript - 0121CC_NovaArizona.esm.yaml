    Enabled: 1
  CompiledScript: 
  SourceCode: >-
    name AZMainHandlerQuestScript;


    int DoOnce;

    int bDidStoryState;


    GameMode {
    	if (VHDBattleController.iBattleState > 0) {
    		if (FortCaesarREF.GetDead()) {
    			AZCenturionNervaREF.Disable();
    		}
    		AZHDCarStack01.Enable();
    		AZHDCarStack02.Enable();
    		AZHDCarStack03.Enable();
    		AZHDCollisionMarker01.Enable();
    		AZHDCollisionMarker02.Enable();
    		AZHDCollisionMarker03.Enable();
    	}

    	if (VStoryState >= 40 && bDidStoryState < 40) {
    		AZLegionaryVeteranEnableMarkerREF.Enable();
    		bDidStoryState = 40;
    	}

    	if (VStoryState > 60) {
    		AZHDCarStack01.Disable();
    		AZHDCarStack02.Disable();
    		AZHDCarStack03.Disable();
    		AZHDCollisionMarker01.Disable();
    		AZHDCollisionMarker02.Disable();
    		AZHDCollisionMarker03.Disable();
    		StopQuest(AZMainHandlerQuest);
    	}

    	if (Player.GetItemCount(vMarkOfCaesar) > 0) {
    		if ((GetStageDone(VMQ02, 7) == 0) && (GetStageDone(VMQCaesarFail, 5) == 0)) {
    			AZCampWillowCollisionMarkerREF.Enable();
    			AZCampWillowCollisionMarkerREF01.Enable();
    			AZCampWillowCollisionMarkerREF02.Enable();
    			AZCampWillowCollisionMarkerREF03.Enable();
    			AZCWBargeREF.Disable();
    			AZMoatWallParentREF.Disable();
    			AZCampWillowBargeStatic.Enable();
    			AZVanillaFortGateREF.Disable();
    		}

    		if ((GetStageDone(VMQ02, 7) == 1) || (GetStageDone(VMQCaesarFail, 5) == 1)) {
    			AZCampWillowCollisionMarkerREF.Disable();
    			AZCampWillowCollisionMarkerREF01.Disable();
    			AZCampWillowCollisionMarkerREF02.Disable();
    			AZCampWillowCollisionMarkerREF03.Disable();
    			AZCWBargeREF.Enable();
    			AZVanillaFortGateREF.Disable();
    			AZCampWillowBargeStatic.Disable();
    			AZBCMoatWallGateClosed01REF.Disable();
    			AZBCMoatWallGateOpen01REF.Enable();
    			AZBCMoatWallGateClosed02REF.Disable();
    			AZBCMoatWallGateOpen02REF.Enable();
    			AZBCMoatWallGateClosed03REF.Disable();
    			AZBCMoatWallGateOpen03REF.Enable();
    			AZMoatWallParentREF.Disable();
    			EnableFastTravel(1);
    		}
    	} else {
    		if (DoOnce == 0) {
    			if ((GetStageDone(VMQ02, 7) == 1) || (GetStageDone(VMQCaesarFail, 5) == 1)) {
    				AZCampWillowCollisionMarkerREF.Disable();
    				AZCampWillowCollisionMarkerREF01.Disable();
    				AZCampWillowCollisionMarkerREF02.Disable();
    				AZCampWillowCollisionMarkerREF03.Disable();
    				AZCWBargeREF.Enable();
    				AZVanillaFortGateREF.Disable();
    				AZCampWillowBargeStatic.Disable();
    				AZBCMoatWallGateClosed01REF.Disable();
    				AZBCMoatWallGateOpen01REF.Enable();
    				AZBCMoatWallGateClosed02REF.Disable();
    				AZBCMoatWallGateOpen02REF.Enable();
    				AZBCMoatWallGateClosed03REF.Disable();
    				AZBCMoatWallGateOpen03REF.Enable();
    				AZMoatWallParentREF.Disable();
    				EnableFastTravel(1);
    				DoOnce = 1;
    			}
    		}
    	}
    }
