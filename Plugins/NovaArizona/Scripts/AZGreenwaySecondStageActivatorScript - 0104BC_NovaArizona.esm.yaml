  CompiledScript: 
  SourceCode: >-
    scn AZGreenwaySecondStageActivatorScript


    int Menu

    int Button

    int Repaired


    BEGIN OnActivate player


    Set Menu to 0

    if Player.IsInCombat || AZGreenwayElectroBeetle01REF.GetDead == 0 || AZGreenwayElectroBeetle02REF.GetDead == 0 || AZGreenwayElectroBeetle03REF.GetDead == 0 || AZGreenwayElectroBeetle04REF.GetDead == 0 || AZGreenwayElectroBeetle05REF.GetDead == 0
    	ShowMessage AZGreenwayCombatMessage02
    else
    	if AZGreenwayWindFarmQuest.PipeRepaired == 0
    		ShowMessage AZGreenwayElectroBattleDamageMessage01
    	elseif AZGreenwayWindFarmQuest.PipeRepaired == 1
    		ShowMessage AZGreenwayElectroBattleDamageMessage02
    	endif
    endif


    END



    BEGIN GameMode


    Set Button to GetButtonPressed

    if Menu == 0
    	if Button == 1
    		ShowMessage AZGreenwayRepair04Message
    		Set Menu to 1
    	elseif Button == 2
    		if Player.GetActorValue Repair >= 60 && Player.GetItemCount AZGreenwayElectricalGloves >= 1
    			ShowMessage AZGreenwayRepair05aMessage
    			Player.RemoveItem AZGreenwayElectricalGloves 1
    			Set AZGreenwayWindFarmQuest.PipeRepaired to 1
    			SetObjectiveCompleted AZGreenwayWindFarmQuest 35 1
    			SetObjectiveDisplayed AZGreenwayWindFarmQuest 40 1
    			disable
    			Imod FadeToBlack5sISFX
    			Set GameHour to GameHour + 1
    			Set Button to 0
    		else
    			ShowMessage AZGreenwayRepair05bMessage
    		endif
    	elseif Button == 3
    		Set AZGreenwayWindFarmQuest.PipeRepaired to 1
    		SetObjectiveCompleted AZGreenwayWindFarmQuest 35 1
    		SetObjectiveDisplayed AZGreenwayWindFarmQuest 40 1
    		disable
    		Imod FadeToBlack5sISFX
    		Set GameHour to GameHour + 1
    		Set Button to 0
    	endif
    elseif Menu == 1
    	if Button == 1
    		if Player.GetItemCount AZGreenwayElectricalGloves >= 1 && Player.GetItemCount ScrapElectronics >= 3 && Player.GetItemCount SpareParts >= 3
    			Set AZGreenwayWindFarmQuest.PipeRepaired to 1
    			Player.RemoveItem AZGreenwayElectricalGloves 1
    			Player.RemoveItem ScrapElectronics 3
    			Player.RemoveItem SpareParts 3
    			ShowMessage AZGreenwayRepair06aMessage
    			disable
    			SetObjectiveCompleted AZGreenwayWindFarmQuest 35 1
    			SetObjectiveDisplayed AZGreenwayWindFarmQuest 40 1
    			Imod FadeToBlack5sISFX
    			Set GameHour to GameHour + 1
    			Set Button to 0
    		else
    			ShowMessage AZGreenwayRepair06bMessage
    			Set Menu to 0
    		endif
    	endif
    endif


    END
