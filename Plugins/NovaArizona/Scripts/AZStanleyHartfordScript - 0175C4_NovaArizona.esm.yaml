  CompiledScript: 
  SourceCode: >+
    name AZStanleyHartfordScript;


    int DoOnce;


    OnDeath {
        if (!GetQuestCompleted(AZMalpaisJournalistQuest)) {
            SetStage(AZMalpaisJournalistQuest, 150);
        }

        if (GetStageDone(AZMalpaisJournalistQuest, 100) && !GetQuestCompleted(AZMalpaisJournalistQuest)) {
            EnableFastTravel(1);
        }

        StopQuest(AZMalpaisJournalistQuest);
    }


    GameMode {
        if (!DoOnce) {
            if (GetQuestCompleted(AZMalpaisJournalistQuest) && AZStanleyHartfordREF.GetInCell(AZMalpaisRoadhouseINT)) {
                if (GetQuestCompleted(VMQ03a) || GetQuestCompleted(VMQ03a)) {
                    if (AZMalpaisJournalistQuest.bStanleyLegionDisapproval > AZMalpaisJournalistQuest.bStanleyLegionApproval) {
                        AZStanleyHartfordREF.KillActor();
                        AZStanleyHartfordREF.AddItem(AZStanleyDeathNote, 1);
                        DoOnce = 1;
                    }
                }
            }

            if (AZStanleyHartfordREF.GetInCell(AZMalpaisRoadhouseINT) && GetQuestCompleted(AZMalpaisJournalistQuest) && !Player.GetInCell(AZMalpaisRoadhouseINT)) {
                if (AZMalpaisJournalistQuest.bStanleyLegionDisapproval > AZMalpaisJournalistQuest.bStanleyLegionApproval) {
                    AZStanleyHartfordREF.KillActor();
                    AZStanleyHartfordREF.AddItem(AZStanleyDeathNote, 1);
                    DoOnce = 1;
                }
            }
        }

        if (GetStage(VHDBattleController) > 0 || GetStage(VHDLegionBattle) > 0 || GetStage(VHDHouseBattle) > 0 || GetStage(VHDIndependentBattle) > 0) {
            AZStanleyHartfordREF.Disable();
            AZStanleyHartfordREF.MarkForDelete();
        }
    }
