  CompiledScript: 
  SourceCode: >+
    name AZMalpaisCheckerQuestScript;


    int MalpaisConfiscationFailsafe01;

    int MalpaisConfiscationFailsafe02;

    int GateGuard01Position;

    int GateGuard02Position;

    int PlayerPositionMarker01;

    int PlayerPositionMarker02;


    GameMode {
    	GateGuard01Position = AZMalpaisGateGuardREF.GetDistance3D(AZMalpaisGateGuardPlayerNoEntryMarkerREF);
    	GateGuard02Position = AZMalpaisGateGuard02REF.GetDistance3D(AZMalpaisGateGuardPlayerNoEntryMarker02REF);
    	PlayerPositionMarker01 = Player.GetDistance2D(AZMalpaisGateGuardPlayerNoEntryMarkerREF);
    	PlayerPositionMarker02 = Player.GetDistance2D(AZMalpaisGateGuardPlayerNoEntryMarker02REF);

    	if (GateGuard01Position < PlayerPositionMarker01) {
    		MalpaisConfiscationFailsafe01 = 0;
    	} else {
    		MalpaisConfiscationFailsafe01 = 1;
    	}

    	if (GateGuard02Position < PlayerPositionMarker02) {
    		MalpaisConfiscationFailsafe02 = 0;
    	} else {
    		MalpaisConfiscationFailsafe02 = 1;
    	}

    	if (IsPlayerInRegion(AZMalpaisRegion) == 0 && Player.GetInWorldspace(WastelandNV) == 1) {
    		MalpaisConfiscationFailsafe01 = 0;
    		MalpaisConfiscationFailsafe02 = 0;
    		StopQuest(AZMalpaisCheckerQuest);
    	}

    	if (AZMalpaisOptioREF.GetDead() || AZMalpaisGateGuardREF.GetDead() || AZMalpaisGateGuard02REF.GetDead()) {
    		StopQuest(AZMalpaisCheckerQuest);
    	}
    }
