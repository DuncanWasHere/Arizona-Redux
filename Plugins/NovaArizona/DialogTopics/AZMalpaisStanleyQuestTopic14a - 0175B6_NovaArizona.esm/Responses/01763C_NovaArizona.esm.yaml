  ResponseText: If that's what you think. I'll print it, but that's it. After this, I'm done.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x320006
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I feel like I'm cresting a hill. This is the Legion. I saw them in full, talked to the commanders, shook hands. I got what I wanted.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: It isn't sustainable. One day, the Legion will kill me. I can't stay here just because of some morbid fascination.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x320006
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I guess I quit. I've got no more work for you. Good luck out there.
  ScriptNotes: ''
