- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x6F7720
    UseEmotionAnimation: True
    Unused3: 0x686520
  ResponseText: Make no mistake. Caesar owned him like he does all of his soldiers.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x6F7720
    UseEmotionAnimation: True
    Unused3: 0x686520
  ResponseText: When the Burned Man stopped following orders, he was thrown away. He was meant to die the same death as 100s of disobedient slaves before him.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x6F7720
    UseEmotionAnimation: True
    Unused3: 0x686520
  ResponseText: He didn't die. He continued his defiance.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x6F7720
    UseEmotionAnimation: True
    Unused3: 0x686520
  ResponseText: If you accept the truth that he was a slave, then you must open your eyes and realize slaves can do anything. There are no chains that can keep us.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x6F7720
