Responses:
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 1
    Unused2: 0x61626C
    UseEmotionAnimation: True
    Unused3: 0x616C70
  ResponseText: Hah.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x277265
    UseEmotionAnimation: True
    Unused3: 0x617465
  ResponseText: Put yourself in my position. You're a soldier, a commander. Well-respected. Important.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x61626C
    UseEmotionAnimation: True
    Unused3: 0x616C70
  ResponseText: Then, one day, you notice that you can't march as far as you used to. You can't spar as long. You start getting tired.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x61626C
    UseEmotionAnimation: True
    Unused3: 0x616C70
  ResponseText: What would you do in my place? Would you let your legacy slip away? Would you die an old decrepit fossil? I wouldn't.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x61626C
    UseEmotionAnimation: True
    Unused3: 0x616C70
  ResponseText: So, yes, I started taking Buffout. It made me stronger. Better.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x646F6E
  ResponseText: Then I came to my senses. I killed the drug runner who kept me supplied. I tried to move past it.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 7
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x646F6E
  ResponseText: But I can't find a way out. My body craves something. I'm restless. I'm irritable.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 8
    Unused2: 0x277265
    UseEmotionAnimation: True
    Unused3: 0x617465
  ResponseText: I only want to serve Caesar as I once did.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 9
    Unused2: 0x61626C
    UseEmotionAnimation: True
    Unused3: 0x616C70
  ResponseText: It was difficult before chems weren’t banned by the Legion. It used to be that you could get drunk after a battle, take a hit of something strong.
  ScriptNotes: ''
  Edits: ''
