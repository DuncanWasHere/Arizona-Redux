  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0xF6E71C
    UseEmotionAnimation: True
    Unused3: 0xF5E71C
  ResponseText: It breathed fire and had spikes all over its back. When I saw it in person, I was so scared. I froze in fear, and for some reason, it turned away.
  ScriptNotes: ''
