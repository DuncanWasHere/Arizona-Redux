  ResponseText: Nerva and I are of one mind on this. I dislike the Frumentarii. The Legion has core principles. Every nation should.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Ours are "nostra ab auctoritate", "qualitas potentia nostra", "quodcumque dixerit vobis, facite". Right from our might. Might from our quality. Follow orders.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: But the Frumentarii are not mighty. They do not go out in battle and meet the enemy head-on. They use disgraceful tactics of deception and subterfuge.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x617469
  ResponseText: So, they cannot possibly be right. Still, Caesar has a plan for them, and the third principle still applies.
  ScriptNotes: ''
  Edits: ''
