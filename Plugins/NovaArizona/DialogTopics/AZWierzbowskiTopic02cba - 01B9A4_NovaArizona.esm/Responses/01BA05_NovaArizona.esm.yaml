  ResponseText: The Rangers happened. They viewed the surrender of the confederacy as a sign that they had let the Legion get too strong.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: For the first few months, the Legion did not know what it was fighting. Entire camps would disappear over night, leaving scores of dead bodies.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The Salt River Valley erupted in rebellion, viewing this as a sign from Mars or their old tribal gods that they had told the Legion they had abandoned.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The Legion was aflame for the next seven years, fighting the Rangers and their failures alike. They grew so strong in fear of the Rangers.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: And they won. The Salt River Valley was again pacified, and the Rangers were forced to bring in the NCR.
  ScriptNotes: ''
  Edits: ''
