    Unused3: 0x000000
  ResponseText: The Lord God sent us His son once as a messenger, many years ago. The Profligates of that time turned on God's messenger and crucified him.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: This time, God is not so merciful. As Mars, He sent us the holy Caesar. It is Caesar's job to bring humanity to salvation.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
