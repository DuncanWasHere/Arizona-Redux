  ResponseText: That's everything south of Bullhead. We're doing great in Mexicali, but not so much everywhere else. We lost Blythe. Hell, we barely fought back.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I know there are some holdouts in the mountains down there, but they're not going to retake the town any time soon. And then, there's Bullhead itself.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: We lost it. We gave the Legion hell, practically leveled the city, but we still lost it. People back home are absolutely pissed. And there's Parker.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Might as well write that one off. No one cares that they're dug in like ticks on a dog's ear. Not enough to send them reinforcements, anyways.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Baja's the only place you can say we're winning, and we're doing it with only a handful of Rangers. You know why? It's because the Rangers do what we don't.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x417269
  ResponseText: They aren't afraid to play dirty. They aren't afraid of the press. They aren't afraid of the Brahmin Barons or wishy-washy voters. They're unrestrained.
  ScriptNotes: ''
