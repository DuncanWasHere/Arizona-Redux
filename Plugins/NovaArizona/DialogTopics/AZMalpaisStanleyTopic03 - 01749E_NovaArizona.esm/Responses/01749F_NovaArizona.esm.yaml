    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The Legion's done pretty well for itself in this front. Six months ago, the NCR abruptly left Bullhead. Not sure why. Maybe they lost. Don't know.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Can't imagine folks back home are happy about that. Bullhead's the city Kimball ran on to become President, so he probably got raked in the midterms earlier this year.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x657265
    UseEmotionAnimation: True
    Unused3: 0x696E20
  ResponseText: About a month ago, the Legion took Camp Willow. A week later, the Legion knocked the NCR off the spillway of Hoover Dam. But I've heard they've withdrawn.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
