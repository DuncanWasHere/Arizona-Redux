  ResponseText: Some years ago, the most devoted of us would celebrate the day of the Cleansing Fire by painting our foreheads with ash.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: After Hoover Dam, it became a fad among slaves. They wore ash with no respect to Mars. They said it was the ashes of the Burned Man!
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionType: Anger
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: They were doing it to mock us, as if that traitor still lives because they wear him on their faces. So Caesar banned the practice in its entirety.
  ScriptNotes: ''
  Edits: ''
