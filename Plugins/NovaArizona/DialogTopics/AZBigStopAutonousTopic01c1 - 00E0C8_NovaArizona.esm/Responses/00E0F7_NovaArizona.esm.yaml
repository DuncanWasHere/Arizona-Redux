    Unused3: 0x000000
  ResponseText: When I joined the Legion, I fought their battles. Their victories became my victory. And I was told that everything I did was inevitable. The Legion was inevitable.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: And the ghosts, the Rangers, fought us. And we exorcised them. Every spirit we kill brings peace to the god Mars.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: And yet, at Hoover Dam, I saw them. I saw them, and not only did I see them, they broke us! They routed us!
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Our inevitability was shattered. I rose through the ranks as a reward for being 'pure,' for being 'unsullied', 'untempted!'
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: But I had done nothing different than the comrades who died around me, the comrades I replaced! And I have done nothing different since!
  ScriptNotes: ''
  Edits: ''
