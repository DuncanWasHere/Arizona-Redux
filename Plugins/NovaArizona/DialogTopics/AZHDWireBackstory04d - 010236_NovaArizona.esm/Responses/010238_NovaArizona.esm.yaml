Responses:
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 1
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The Rangers have been fighting the Legion for over a decade. They burn crops, poison wells, blow up bridges. They wage war like it's a fucking war.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: And the things they're doing in Mexicali? They actually armed the regional warlords there. Could you imagine that happening here? Of course not.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x88083D
    UseEmotionAnimation: True
    Unused3: 0x88883E
  ResponseText: The press has been on our asses since Bullhead. They've been bitching non-stop that we lost it, and every front page of The Redding Times pisses me off.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: They can't seem to get it into their heads that artillery-leveling a city, civilians or not, is perfectly acceptable when you're denying it to the enemy.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: And we should. It's our government's mandate to its people. We spent years pacifying that city and rooting out the savages.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x88083D
    UseEmotionAnimation: True
    Unused3: 0x88883E
  ResponseText: Once Bullhead was cleaned up, it was a shining example of everything the NCR stood for. Like hell we should let the Legion take that city without a fight.
  ScriptNotes: ''
  Edits: ''
