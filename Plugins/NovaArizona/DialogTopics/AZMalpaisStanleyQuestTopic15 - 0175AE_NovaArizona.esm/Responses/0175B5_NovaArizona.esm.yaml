- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x61626C
    UseEmotionAnimation: True
    Unused3: 0x616C70
  ResponseText: Either way, I don't want to stick around here. Things are getting too hot. I can't take the stress. Maybe I'm not cut out for journalism anymore.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
