    Unused3: 0x000000
  ResponseText: There were two different goddesses that were supposed to guide us - Diana and Proserpina. Diana was *the* goddess, for the most part.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Diana was the custodian of the Nursery. That's what we called the world. Everything - the sun, the stars in the sky, the songs of the birds - it's all the Nursery.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Proserpina is the ground we walk on. She's the plants and the soil. It was important that we honor and respect her, feed into her cycle of life.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Proserpina's other aspect, Luna, is the moon. She's death and decomposition, but also rebirth, because the moon always passes from the underworld to the Nursery above.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: And then there's the Flower Child, but that's a whole different thing.
  ScriptNotes: ''
  Edits: ''
