    Unused3: 0x000000
  ResponseText: It's the hardest work assignment I've been in. I worked in the flue ash fields in Navajo territory. I thought that was bad, but this is worse.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: It's long work hours with almost no food and almost no water. The foreman is a tyrant who sometimes throws a couple of slaves off the Chainway when he loses his temper.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: And don't get me started on the early days. The Legion wouldn't give us rope. We had to climb the concrete with our bare hands
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Many of my friends died that day. If it's all the same to you. I don't really want to talk about it anymore.
  ScriptNotes: ''
  Edits: ''
