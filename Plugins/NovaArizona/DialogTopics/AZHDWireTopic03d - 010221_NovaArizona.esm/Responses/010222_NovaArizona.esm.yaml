  CompiledScript: 
  SourceCode: >-
    setstage AZDamNQuest2 15

    setstage AZDamNQuest1 20

    Set AZDamNQuest2.bAgreedtoKillRefugees to 2


    player.additem WeapNVMarksmanCarbine 1

    player.additem Ammo556mm 120

    player.additem Ammo556mmArmorPiercing 100

    player.additem AZOmarPass 1


    AddReputationExact RepNVNCR 1 8


    if (VNPCFollowers.bBooneHired == 1) && (VDialogueCraigBoone.nFinalState == 1)
    		if VNPCFollowers.nCurrentFollowers == 0
    			set VNPCFollowers.bPlayerHasFollower to 0
    		endif
    	CraigBooneRef.MoveToMarkerWithFade BooneHomeMarkerREF
    	set VNPCFollowers.bBooneHired to 0
    	set VNPCFollowers.bBooneFired to 1
    	set VNPCFollowers.bBooneQuit to 1
    	set VNPCFollowers.bHumanoidInParty to 0
    	CraigBooneREF.SetPlayerTeammate 0
    	CraigBooneREF.removeperk CompanionSuite
    	player.removeperk Spotting
    	showmessage FollowerMessagePerkBooneRemove
    	Player.RemoveFromFaction VBooneFaction;
    	CraigBooneREF.RemoveFromFaction FollowerFaction
    	set VNPCFollowers.nCurrentFollowers to (VNPCFollowers.nCurrentFollowers - 1)
    endif
