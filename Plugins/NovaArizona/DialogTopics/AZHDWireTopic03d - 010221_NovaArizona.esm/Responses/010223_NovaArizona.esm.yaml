  ResponseText: Interesting. I thought you might have been just another bleeding heart.... But you think just like I do.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I'll spread some rumors about how you're a hero to Oliver to give you some cover. Oh, and here's your reward.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Plus a little something extra. Got this here street sweeper, for taking out the trash. I used during the Vault City Riots a couple years ago.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: You have fun with it now. Oh, and don't talk to the press. They wouldn't get it.
  ScriptNotes: ''
