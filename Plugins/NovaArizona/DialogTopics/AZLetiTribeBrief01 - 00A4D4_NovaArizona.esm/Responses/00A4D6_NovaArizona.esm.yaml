    ResponseNumber: 2
    Unused2: 0x415A42
    UseEmotionAnimation: True
    Unused3: 0x6C6570
  ResponseText: The North Pines and the Twist-Hairs traded with us both. During trouble, we defended our herd with great guns, but not often.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x415A42
    UseEmotionAnimation: True
    Unused3: 0x6C6570
  ResponseText: We slept under the stars and rested at the base of trees. It wasn't our way to stay in one place.
  ScriptNotes: ''
  Edits: ''
