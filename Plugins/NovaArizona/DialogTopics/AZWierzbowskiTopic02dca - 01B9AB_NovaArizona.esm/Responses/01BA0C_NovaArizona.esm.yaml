  ResponseText: The Legion offers many things that the Wasteland needs. Its values are good. It recognizes that justice, loyalty, brotherhood and sacrifice are needed.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: But its methods prevent such values from taking root in the world. The Legion uses fear, hatred and anger to enforce these values.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: But justice through fear is not justice at all, brotherhood without love is coercion, and sacrifice without meaning is a waste.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
