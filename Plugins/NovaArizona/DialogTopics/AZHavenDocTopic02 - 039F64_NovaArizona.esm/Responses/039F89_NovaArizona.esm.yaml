  ResponseText: The Legion usually allows your town to stay safe from their wrath if you can give them something valuable.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: For my town, Weevil, it was hydroponics. Our mayor managed to get us a good deal with the local Centurion.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Mayor wanted me to follow in his footsteps, so I cozied up to that Centurion, too. Just friendly.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Anyways, that Centurion ended up getting caught with Jet, and the next one ordered the execution of him and a lot of other people in retaliation.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: So I fled to Ranger territory, got brought here, and here I am.
  ScriptNotes: ''
  Edits: ''
