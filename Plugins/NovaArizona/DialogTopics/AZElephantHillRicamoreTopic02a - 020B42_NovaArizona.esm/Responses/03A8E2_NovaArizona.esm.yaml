- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: When the Legion first started rollin' through this neck of the woods, I had hoped they wouldn't make it up to Elephant Hill. For a while, they didn't.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The supply, though? Slowed down everywhere, even long before the Legion showed up. Customers wanted booze and I couldn't get my hands on any.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: My supplier down in Kingman got killed. The ones in Bullhead? Ran back home to the NCR. I was screwed - mighty screwed. So I got creative.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Moonshine, kiddo. Sunset moonshine. And it shined like hell. I even indulged, myself. Maybe a little too much.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x64646F
    UseEmotionAnimation: True
    Unused3: 0x736574
  ResponseText: Eventually it came to an end, like it had to. Methanol left me with a parting gift - poison in my blood and bad eyes.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 7
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: That's the story. If you ask me, the takeaway ought to be don't mess with methanol. Just ain't worth it.
  ScriptNotes: ''
  Edits: ''
