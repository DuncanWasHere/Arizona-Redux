  ResponseText: Every tribe from Arizona that you see in the Legion fought them at some point. Every Legionary fears them and rightly so.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x6F7570
    UseEmotionAnimation: True
    Unused3: 0x656D6F
  ResponseText: The most devoted Legionaries believe that they are Mars' fallen angels. Others believe that they are evil spirits from before the Great War.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x6F7570
    UseEmotionAnimation: True
    Unused3: 0x656D6F
  ResponseText: The younger Legionaries view them as no different than the common NCR dregs. They are fools and will have to educated accordingly.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x6F7570
    UseEmotionAnimation: True
    Unused3: 0x656D6F
  ResponseText: I confess that I have no desire to fight them again. I am not sure we will win, especially since they have stirred the NCR against us.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: We must drill intensively and continuously to defeat these demons.
  ScriptNotes: ''
