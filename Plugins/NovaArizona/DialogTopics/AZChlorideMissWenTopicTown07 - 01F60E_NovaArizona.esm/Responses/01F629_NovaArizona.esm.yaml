    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: My family's lived here forever. At one point, a great great great great grandmother of mine ran the town's Historical Society.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: That's not to say everyone stayed here. It's a small town. Some of 'em got bored and left. I can't blame them.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I know one of them hit it big in Vegas, before the war. Another got arrested in Kingman - I'd rather not talk about him.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: A great uncle of mine actually started a raider band around here. I heard he got killed by the Legion, or maybe it was Rangers.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Sorry, I'm sure this is all strange to you. It's just our tradition. My pa kept a book that tracked our family history.
  ScriptNotes: ''
  Edits: ''
