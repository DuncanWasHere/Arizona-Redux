  ResponseText: It was successful. They returned with enough coin to keep us fed for weeks. That level of hard work is... uncharacteristic of Sketch.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x696D20
    UseEmotionAnimation: True
    Unused3: 0x696E20
  ResponseText: I wasn't the only one who suspected that there was something happening on the side, many of us assumed chem dealing or maybe theft.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x696D20
    UseEmotionAnimation: True
    Unused3: 0x696E20
  ResponseText: I'm partially telling you this so you know that the rest of the Hooks aren't involved in whatever you think Sketch and Gristle are wrapped up in.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x696D20
    UseEmotionAnimation: True
    Unused3: 0x696E20
  ResponseText: If you want to talk to them about it you can do by the holding pen. You may be able to convince one of them to spill on what they've been up to.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x696D20
    UseEmotionAnimation: True
    Unused3: 0x696E20
  ResponseText: Oh, and one more thing. Don't press Kyle on this. He and Sketch are family and he takes that bond seriously. He won't budge, trust me.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x696D20
    UseEmotionAnimation: True
    Unused3: 0x696E20
  ResponseText: If there's anything that needs to be discussed about Sketch or Gristle or any of their actions, come to me. I'll see what I can do to help.
  ScriptNotes: ''
  Edits: ''
