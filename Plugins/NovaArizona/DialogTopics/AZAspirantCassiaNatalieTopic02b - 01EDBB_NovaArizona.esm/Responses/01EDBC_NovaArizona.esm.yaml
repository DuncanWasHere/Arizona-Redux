  ResponseText: We created him, and the Legion, in a way. We share knowledge freely to all. That way, the knowledge will never be lost.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x6B696E
    UseEmotionAnimation: True
    Unused3: 0x20766F
  ResponseText: Sometimes, that knowledge is shared with very bad people.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x6B696E
    UseEmotionAnimation: True
    Unused3: 0x20766F
  ResponseText: It was a Follower doctor - Bill Calhoun - who brought Sallow to the Grand Canyon in the first place. Practically set him up to play warlord.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x6B696E
    UseEmotionAnimation: True
    Unused3: 0x20766F
  ResponseText: Sallow was just some punk in New Adytum who read too much Edward Gibbon, and we gave him the tools to become a monster.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x6B696E
    UseEmotionAnimation: True
    Unused3: 0x20766F
  ResponseText: He used the knowledge we gave him to create this farcical army. That's our responsibility. We own this apocalypse. It's ours to make amends for.
  ScriptNotes: ''
  Edits: ''
