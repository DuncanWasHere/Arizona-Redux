Responses:
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 1
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Well, it may help to take a step back and look at the bigger picture. If you think hard enough, you'll start to notice a pattern.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: You see, everything in our world makes up or is made up of circles. You and I are made up of millions of small circles.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The Moon, the Sun, the stars, all big circles, and they circle around us in the sky. The Earth? Also a circle.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Nature is circular because it is a cycle. We are born, we live, we reproduce, and die. Generations pass like days, weeks, and years pass on the calendar.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: You might also notice that clocks are circles. No coincidence there.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Where armies meet in battle, like millstones they grind the men in between into bone meal, which feeds the earth that feeds the plants that feed the armies.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 7
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: It is a great comfort to know that we are never the first or the last in our shoes. We are never isolated from the gears that turn our world.
  ScriptNotes: ''
  Edits: ''
