    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Before the Legion, our leader was a guy named Byrd. He had this big fat iron hook where his left hand was supposed to go.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Things were looser. We could smoke and get high. Byrd didn't give a shit.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: We'd hit caravans, rob farmsteads. One of my favorite things to do was something we called slavejacking.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Slavery is huge in El Burque. Someone was always delivering slaves somewhere. We'd find a good spot to lay low, then pop an ambush.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionType: Happy
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Bam bam, pop pop. Guards are dead and the cargo is ours. We deliver it and get the money.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 7
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Can't do something like that anymore, though. Not if you like your head attached to your body.
  ScriptNotes: ''
