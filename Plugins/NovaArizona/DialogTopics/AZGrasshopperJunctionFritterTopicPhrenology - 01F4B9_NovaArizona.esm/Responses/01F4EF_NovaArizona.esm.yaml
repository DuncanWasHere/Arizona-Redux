  ResponseText: Ah, well, actually I'd rather not. It's a very... delicate process. I need time, and my tools, and ideally a nice office somewhere.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: But I can tell you, broadly, how it works. By examining skull size and shape, I can accurately read your personality, and even your destiny.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: For example, I met a man who was rather green, and quite large. I measured his skull and found something incredible.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: His woes in life were not because of random bad luck, but because of his brain. His massive skull contained an enlarged aggression center.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: He was so aggressive, so angry, that it had eroded every other part of his brain. He couldn't even remember what year it was!
  ScriptNotes: ''
  Edits: ''
