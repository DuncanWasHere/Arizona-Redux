  ResponseText: Fallen soldiers are cremated when possible, so as to return to Mars most easily.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: When our soldiers die in great numbers, the site of the battle is consecrated and a rite is given.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
