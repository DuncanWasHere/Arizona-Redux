  ResponseText: When I was talking with my brothers and sisters at Camp Golf in '76, they were so upset with him.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x616E6C
    UseEmotionAnimation: True
    Unused3: 0x732068
  ResponseText: They told me how he kept ordering us to help fight the Brotherhood, Baja, protests in Vault City, tribals in Oregon.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x616E6C
    UseEmotionAnimation: True
    Unused3: 0x732068
  ResponseText: Then, I talked to Hanlon, and he seemed just as upset as them. I could tell that he fought for us at every opportunity.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x616E6C
    UseEmotionAnimation: True
    Unused3: 0x732068
  ResponseText: He just kept failing to stop his bosses from leaving us out to dry. I almost pity him. To answer your question, I don't know if he's a good man.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x890080
    UseEmotionAnimation: True
    Unused3: 0x8EFDC5
  ResponseText: I think he tries to be, though. Maybe that's all that matters.
  ScriptNotes: ''
  Edits: ''
