  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: And it inspired them. They sent out the call from California to Texas. Rangers never turn their banks on other Rangers, and so we came.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: Oh, you should have seen it. An army of 10,000 glorious troops in black armor. The best and brightest of the New West.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
