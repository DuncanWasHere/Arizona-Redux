    Unused3: 0x000000
  ResponseText: That is correct. I was found by Cal in the year 2265. He and a few other Rangers managed to subdue me in the Corridor of the Sun, near old Casa Grande.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: They took me to their headquarters in Quartz Site, seeking information that only a Frumentarius like myself would possess.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I tried to kill myself many times but was thwarted each attempt. For the next three weeks, I screamed at my captors, hurling insult upon insult.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: After that, I went quiet. For the next four months, Cal administered his knowledge to me. His knowledge of morality, of Caesar, of justice.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: "It took another week before I asked a single question: 'How can a civilization built on a lie have done so much good for the Wasteland, then?'"
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: That was the beginning of my enlightenment.
  ScriptNotes: ''
  Edits: ''
