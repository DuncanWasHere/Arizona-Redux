  ResponseText: Before the war, the Legion spent the past two decades building up its strength to take on the major powers of Arizona.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: After that, we launched a continuous push westwards. The Rangers had been weakened by their own continuous war with the raiders.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: Unlike us, the Rangers never exterminated or fully assimilated the tribes they warred with. It proved to be their weakness.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: Ultimately, we took Quartz, forcing the Rangers to flee to the NCR.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: But the war was long and costly, killing so many Legionaries that we thought it might be the end.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: And the Rangers are returning. They may wear different uniforms now, but it's them.
  ScriptNotes: ''
  Edits: ''
