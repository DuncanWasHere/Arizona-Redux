    Unused3: 0x000000
  ResponseText: I was a common degenerate in the Salt River Valley. When the Legion was purifying the land, a Centurion took pity on me and allowed me to redeem myself in Caesar's eyes.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: For the next three weeks, I was forced into sobriety. I screamed for days on end and begged for death. The Legion did not grant it.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: During all of this, my superiors beat me over and over again. They screamed that I was weak and pathetic.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: When I awoke from my stupor, I looked and saw that I had no wounds. The Maiden told me that I had survived and that it was now time for my reeducation.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: For the next six months, I was taught the values I was to carry into the Wasteland in Caesar's name. After my rebirth, I was a new man.
  ScriptNotes: ''
  Edits: ''
