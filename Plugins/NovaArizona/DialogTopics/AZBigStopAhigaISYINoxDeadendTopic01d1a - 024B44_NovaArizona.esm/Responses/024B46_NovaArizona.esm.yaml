  ResponseText: Look, I know you're a devoted Legionary, so I'll tell you this. I've been keeping it a secret for now, but this is the truth.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x616964
    UseEmotionAnimation: True
    Unused3: 0x6F756C
  ResponseText: Cato's unit, that is the cell Nox operates as a part of, has a rat known as Corvus.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x616964
    UseEmotionAnimation: True
    Unused3: 0x6F756C
  ResponseText: Several months ago, he disappeared after warning the Chainway was doomed to collapse.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x616964
    UseEmotionAnimation: True
    Unused3: 0x6F756C
  ResponseText: Then, the Chainway collapsed. The connection is obvious between the two, but what is less obvious is the connections between Corvus and Nox.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x616964
    UseEmotionAnimation: True
    Unused3: 0x6F756C
  ResponseText: Nox was a friend of Corvus, a close confidant. And Nox, whose procurement speciality is somewhat legendary....
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x616964
    UseEmotionAnimation: True
    Unused3: 0x6F756C
  ResponseText: Well, where could Corvus gotten his explosives from?
  ScriptNotes: ''
