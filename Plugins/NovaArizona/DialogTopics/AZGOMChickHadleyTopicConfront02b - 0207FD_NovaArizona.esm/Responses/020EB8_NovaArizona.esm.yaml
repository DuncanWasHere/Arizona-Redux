    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: We used to be soldiers in the NCR. Can you believe it? You're looking at Private Hadley. It sucked. Never join the army.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Things fell apart when we got ambushed near Oatman. This must've been 15 years ago. NCR was still fighting tribals at Bullhead.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Sarge made a bargain, he promised to lead a raid on an NCR convoy, so long as the tribals let us live. It worked.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: So, we kinda just kept doing it. The tribals joined up with us. We robbed fuckers in Bullhead, in Kingman. Became a gang.
  ScriptNotes: ''
  Edits: ''
