  ResponseText: I made it down to the town of Quartz. It's a pretty big deal in some of the Ranger legends.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The story goes that a raider named King Devil lorded over the town. He had everybody payin' tribute to him. He killed for fun and ruled with fear.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Then, the Rangers show up. They drive King Devil off, and set up a fort at the town that they use to wage war on the raiders.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
