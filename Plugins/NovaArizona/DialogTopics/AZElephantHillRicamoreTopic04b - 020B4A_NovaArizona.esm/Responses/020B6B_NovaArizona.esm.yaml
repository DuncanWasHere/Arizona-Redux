  ResponseText: Can't you tell? Look around you. Sunset Sarsaparilla everywhere. This here hill is a genuine fake ghost town.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: You see, back in the old days, all those ruins you see 'round the desert used to be a curiosity. City folk would come from miles to see a ghost town.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: It must've been the 2060s or so when Sunset Sarsaparilla decided they wanted in on the business. Somethin' to compete with Nuka-Cola's theme parks.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Me, I've been here since, oh... I can't remember. But they brought me on as a cast member and had me playin' a bandit. Whistlin' Willie, I was.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Eventually, Whistlin' Willie was no more, and they put me on as a bartender. Damn good at it, too, I tell you.
  ScriptNotes: ''
  Edits: ''
