  ResponseText: You would do better to ask the historians at the Universitas Caesaris. As a Priestess, I only know our stories, which I'm sure are incomplete.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Originally, the Cult was a small council of women - wives of the chieftans of the First Tribe. Head Priestess Pompeia is said to be of this group.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: There were no Maidens, only Priestesses. Together, they codified the Legion's holy doctrine.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The Cult was small and insular, with little influence. Mars was displeased by this. He demanded the Cult to grow.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: He struck many women infertile, and Caesar understood this as a sign. Those women were being called to a new purpose. They were made into Maidens.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: It was a lifeline. The war with the ghouls had bled the Legion for months. The Maidens were crucial support in a time when the Legion was in disarray.
  ScriptNotes: ''
  Edits: ''
