  ResponseText: The Legion is not supposed to fight in the same places it has already fought. When we took Solitare, the spirit of war there should have died.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: But not long ago, the spirit woke up again. The Rangers returned. They killed. They destroyed.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: And when we finally slew them, {shouting}all two of them, we ripped through the town. The people we had cleared as Liberti, as liberated from degeneracy?
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: We butchered them. I watched the Frumentarii kill in the night, night after night. We were wrong, again!
  ScriptNotes: ''
  Edits: ''
