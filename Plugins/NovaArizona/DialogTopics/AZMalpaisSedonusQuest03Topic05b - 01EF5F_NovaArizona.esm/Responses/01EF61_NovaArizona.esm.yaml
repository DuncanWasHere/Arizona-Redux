- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x734261
  ResponseText: The Buffout made me so strong, just like the olden days. But, it didn't matter. Caesar did not choose me. He chose the mask, Lanius.
