  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x696421
    UseEmotionAnimation: True
    Unused3: 0x642074
  ResponseText: I told Caesar of my sacrifice for him. What I had done to my body. He was angry. He threatened to behead me if I didn't clean up.
