    ResponseNumber: 2
    Unused2: 0x61626C
    UseEmotionAnimation: True
    Unused3: 0x726565
  ResponseText: We rode the wave of unearned pride after defeating the army of King Devil. For hours, we celebrated in unholy degeneracy.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x696D61
    UseEmotionAnimation: True
    Unused3: 0x746861
  ResponseText: We were so dulled that we did not notice the return of King Devil. His reinforcements swept over our camp.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x696D61
    UseEmotionAnimation: True
    Unused3: 0x746861
  ResponseText: The Malpais Legate, the man known as Graham, executed one-tenth of the Legion that one day.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x5AAE1C
    UseEmotionAnimation: True
    Unused3: 0x57AE1C
