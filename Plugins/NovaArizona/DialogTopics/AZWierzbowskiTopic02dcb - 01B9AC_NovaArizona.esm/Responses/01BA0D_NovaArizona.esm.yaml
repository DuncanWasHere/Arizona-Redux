  ResponseText: A lie is nothing to be shamed of. Humans are not capable of building civilizations based on the truth. The great truths are veiled behind our own inadequecies.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Many people have been saved through lies and deception. The question is what does that lie promote?
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The Legion's lie offers the values of justice, loyalty, brotherhood and sacrifice. Those are necessary for the Wasteland to rebuild into something greater.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: But, the Legion's methods in service of that lie are not capable of bringing about those values in any form of permance.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: These values have to be cultivated from within, not formed as the product of stripping away the negative facets of a man's nature.
  ScriptNotes: ''
  Edits: ''
