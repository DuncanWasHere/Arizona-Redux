  ResponseText: The Tan Caps were a tribe in southern Colorado prior to our induction into Caesar's Legion. The Tan Caps valued discipline and order above all else.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: So, naturally, when confronted with a civilizing force that held our exact same ideals, we voluntarily joined the Legion.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x207761
    UseEmotionAnimation: True
    Unused3: 0x696F75
  ResponseText: The Tan Caps dutifully served the Legion during the Hangdogs Campaign.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: Following that, the tribe was deemed completely free of Profligate elements and was merged with no loss of life.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
