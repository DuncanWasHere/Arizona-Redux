    Unused3: 0x000000
  ResponseText: I am.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: At the time, I worked adjacent to the Followers of the Apocalypse, with a paper called the Free Republican Post.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: We were incredibly critical of this war. They called it a war, but it wasn't really. It was an extermination campaign.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: We published accounts of the atrocities. We listened to the victims. We actually did our damn jobs as reporters.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: One day, a gang of NCR soldiers kicked down our door. They were in uniform, with their service guns.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: They had some sort of warrant. They told us we were a threat to public safety. They took everything we had and put us in cuffs.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 7
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Don't get any fanciful ideas about your rights as an NCR citizen. *That* is how they treat their citizens.
  ScriptNotes: ''
  Edits: ''
