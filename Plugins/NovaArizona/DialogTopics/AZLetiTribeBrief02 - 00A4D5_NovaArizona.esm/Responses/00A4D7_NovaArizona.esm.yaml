  ResponseText: The Caesar called us and the Twist-Hairs to Burro Creek. He asked us to help him in war. We take no joy in war.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionType: Anger
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x656172
    UseEmotionAnimation: True
    Unused3: 0x652061
  ResponseText: The Twist-Hairs agreed. They were nomads like us, but had appetite for war, saw triumph in hunting a man like beast.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x206265
    UseEmotionAnimation: True
    Unused3: 0x656E20
  ResponseText: We could not join him. Impossible for us. We tend our herd, not fight. This was our doom.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: They killed our livestock, butchered us. We fled to the west. We hide in caves. Prospectors find us, we kill and move to a new cave.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Now, there is no more west for us to go. We are stuck here.
  ScriptNotes: ''
  Edits: ''
