  ResponseText: My previous Centurion was going to launch a foolhardy attack on a heavily-fortified tribal camp in Roswell.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I told him that we did not have enough manpower or supplies to do so.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: He disagreed and stabbed me in the eye and broke five of my ribs. So, he led the attack himself and was beheaded when it inevitably failed.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I was subsequently promoted and given enough supplies to bring Roswell to its knees, which I did. They fought fiercely but ultimately surrendered.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: After that, I was transferred here.
  ScriptNotes: ''
  Edits: ''
