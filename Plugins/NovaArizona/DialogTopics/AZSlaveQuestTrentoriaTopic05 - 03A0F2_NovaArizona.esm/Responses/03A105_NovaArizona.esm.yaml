    UseEmotionAnimation: True
    Unused3: 0x616C70
  ResponseText: Hm. A part of me suspects the poaching of slaves, it is not unheard of. But I don't dare imagine such a thing happening in the shadow of Caesar.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x61626C
    UseEmotionAnimation: True
    Unused3: 0x616C70
  ResponseText: Here is what I want you to do. Find the mutant and the man from the drawing and ask them about it, prayers to Mars they are still near.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x61626C
    UseEmotionAnimation: True
    Unused3: 0x616C70
  ResponseText: From there you should be able to follow a trail to my slave's attackers. I refuse to believe this sketch of them was a mere coincidence.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x61626C
    UseEmotionAnimation: True
    Unused3: 0x616C70
  ResponseText: Once you've rooted them out I will write up an account that can be presented to Aristophanes in Chloride. On behalf of us both, of course.
  ScriptNotes: ''
  Edits: ''
