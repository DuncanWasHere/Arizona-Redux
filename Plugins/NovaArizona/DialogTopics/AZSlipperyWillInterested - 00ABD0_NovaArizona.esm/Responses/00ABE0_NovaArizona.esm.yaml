  ResponseText: You ever hear of Big Spar Mine, wastelander? It's a big one, got passages that run all over like some kinda maze. They say no man's seen all of it.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I learned of it on account of a dying man I met baking in the sun in the Utah years back. Told me he would reveal his treasure for a sip of water.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: He gave me this, a map of the mine with an 'X' where he buried a cache of silver. I swear on my mama's mama that's what he said it was.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Now, Slippery Will ain't who he used to be, so I'll need you to hike out there for the silver. Bring it back for 50 percent of the split. Sound fair?
  ScriptNotes: ''
  Edits: ''
