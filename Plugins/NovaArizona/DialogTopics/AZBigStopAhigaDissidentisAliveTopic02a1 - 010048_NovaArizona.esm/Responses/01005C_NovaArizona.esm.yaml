  ResponseText: For guns, the NCR's main supplier are the Gun Runners. Buying such a large stock in person would be suspicious to Frumentarii operatives.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Fortunately for us, they have a salesman at Camp McCarran, which I understand has its own black market problems.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: As for explosives, there exists a tribe known as the Boomers to the north of Vegas.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Previous attempts at contact have been unsuccessful, but I know that Caesar has plans for you to meet with them if you haven't already.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Make the deals and tell them to deliver to Echo Bay. We will pay them there.
  ScriptNotes: ''
  Edits: ''
