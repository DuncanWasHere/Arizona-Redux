  ResponseText: Arizona was always infested with raiders, even before the Great War. Poor soil, little water and lots of guns are a bad combination.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: It's also the crossroads of the Mojave and the Sonora, so the raiders came from everywhere else.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: The NCR pushed a bunch east, but the worse problem was Mexico. I have no idea what happened down there, but it must have been bad.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: We spent the entirety of the 2250s pushing back the hordes from the south. Left us blind to the Legion in the north.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: On the topic of the Legion, when they came back from New Mexico, they pushed raiders to the west, too.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x6F6620
    UseEmotionAnimation: True
    Unused3: 0x656769
  ResponseText: Bad situation over all. Our bad luck that we launched the war when we did.
  ScriptNotes: ''
  Edits: ''
