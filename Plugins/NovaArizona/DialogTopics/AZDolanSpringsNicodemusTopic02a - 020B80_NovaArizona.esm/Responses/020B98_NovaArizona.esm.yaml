  ResponseText: Okay. When you look at art, a painting or a photo, you're looking at it from the outside. You're the observer. A voyeur.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: See, there's no place for you *in* it, no place for you to feel it in your body. Things like height and depth can be *seen*, but not experienced.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Taxidermy, tableau, whatever the fuck you want to call it - it's that third dimension.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: When I make something tall, it feels real fucking tall. You feel it loom over you.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Similarly, think of motion. It probably sounds ass-backwards but statue is the best way to convey motion, because every part has real physical mass. It's not a flat canvas.
  ScriptNotes: ''
  Edits: ''
