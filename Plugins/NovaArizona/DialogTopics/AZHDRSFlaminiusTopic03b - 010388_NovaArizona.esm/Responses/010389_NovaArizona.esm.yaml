    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x617469
  ResponseText: In battle, when so many Legionaries' souls travel to the halls, the souls of the still-living Legionaries attempt to do so as well.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x697573
    UseEmotionAnimation: True
    Unused3: 0x6E7573
  ResponseText: This happened to me in the Battle of Dry Wells. Three entire contubernia, including my own, were utterly obliterated in the span of several minutes.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x697573
    UseEmotionAnimation: True
    Unused3: 0x6E7573
  ResponseText: My soul was in torment and sent me into visions, tempers and brain fog for days. As such, I was moved to a less active outpost, where I could recover from my mania.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
