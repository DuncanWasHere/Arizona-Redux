    Unused3: 0x000000
  ResponseText: Oh, it's you! I never expected to see you again.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I wanted to thank you for everything you did for me. I still don't have much to my name, I don't make any money as a maiden, but that's no excuse.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: So, I've been cultivating this plant, a broc plant, and it has the prettiest flowers I've ever seen.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The petals curve up into a kind of bowl shape, and the orange is the richest orange ever, like the sunset.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: So I wanted you to have it. I know it's barely anything, but it's really all I have, and I wanted to give you something.
  ScriptNotes: ''
  Edits: ''
