  ResponseText: He was a man in Caesar's servitude as a Legate. He believed he was Caesar's strongest soldier, and acted the part. Cruel and egotistical.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x6F7720
    UseEmotionAnimation: True
    Unused3: 0x686520
  ResponseText: He was cast out of Caesar's kingdom for failing in a war. Caesar stripped his rank, his possessions.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x6F7720
    UseEmotionAnimation: True
    Unused3: 0x686520
  ResponseText: He was set alight and thrown into Magna Chasma; the great womb of the world.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x6F7720
    UseEmotionAnimation: True
    Unused3: 0x686520
  ResponseText: On that day he was baptized. The holy waters of creation, Magna Chasma's rivers, broke his fall. He emerged reborn.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x652077
    UseEmotionAnimation: True
    Unused3: 0x707469
  ResponseText: Officially, the Burned Man is a mortal. Soldiers insist he is dead. Yet they cower at his name.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
