    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Pater Mars supernus, nomen tuum invoco ut tua filia ex utero Terrae nata, unde cuncta creata sunt...
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: '...nox et dies, bonum et malum, lupus et bos, ex tuo semine minore genita...'
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: '...in humili devotione erga Caesarem magnum, ex tuo semine maiore genitum, quem iusto imperio omnium rerum benedixisti in perpetuum.'
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Pater Mars, precor ut huic filio minori suam debitam fortunam largiaris, nam et ipse devotionem suam tibi, atque Caesari, probavit.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Protege eum a scelere et morbo. Animum eius confirma, cum hostem in proelio iterum obiturus sit. Sapientiam novam ei tribue, eumque ad maiorem victoriam duc.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Pro his tibi laudes perpetuas gratiasque offerimus, Pater Mars. Sic fiat semper.
  ScriptNotes: ''
  Edits: ''
