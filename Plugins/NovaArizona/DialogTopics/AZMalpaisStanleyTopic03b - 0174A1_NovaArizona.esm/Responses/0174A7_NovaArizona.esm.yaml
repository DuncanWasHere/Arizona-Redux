    Unused3: 0x000000
  ResponseText: Truthfully, I can't tell you a whole lot. Yes, I'm a reporter, but I'm not a stupid reporter. When the Legion delivers punishment, it's final.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Nosing around would only get me killed too.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionType: Sad
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: What I do know is that the townsfolk were collaborating with NCR Rangers.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionType: Sad
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Not sure where they came from, considering Big Stop's been under Legion control for the past year.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: But, it's over now. There were executions, tortures, and more executions.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The Legion isn't usually cruel to its subjects the way it is to Profligates, but those people were made to suffer.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 7
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The commander there, Dominicus Rex, seems to be satisfied for now. But who knows? Maybe he'll change his mind and start killing again.
  ScriptNotes: ''
  Edits: ''
