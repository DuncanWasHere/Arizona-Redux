  ResponseText: Maybe. Maybe he could. And if we changed the Legion's mind on this even a little, then it might be worth it.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: Either way, I think I'm taking a break from journalism. Things are getting too hot. I can't take the stress anymore. Maybe I'll just relax in the roadhouse for a while.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x686520
    UseEmotionAnimation: True
    Unused3: 0x2E2041
  ResponseText: You, though... you've got moxie. You make yourself worthy of that Mark you're wearing, and maybe one day I'll be writing your biography.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x61626C
    UseEmotionAnimation: True
