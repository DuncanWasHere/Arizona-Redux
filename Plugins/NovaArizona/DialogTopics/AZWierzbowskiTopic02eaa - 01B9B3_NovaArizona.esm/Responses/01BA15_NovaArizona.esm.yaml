    Unused3: 0x000000
  ResponseText: The Legion beat new values into me. New values to suppress the degenerate flame within me.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: But, the Legion was never interested in snuffing out that flame, only in making sure that it burned at only their command.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: You kill, torture, rape and devour at their command.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: It was Cal who taught me how to use those values to snuff out that degenerate flame, and to make something new with it.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: The flame that consumed all was flame no longer. Its ashes were fertile ground for new values to grow and prosper under Cal's gentle guidance.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: It was only then that I was reborn. My flame was no longer, replaced with a towering redwood of new values. That is how I became a Ranger.
  ScriptNotes: ''
  Edits: ''
