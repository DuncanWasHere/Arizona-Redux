    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: It is easier to relinquish our womanhood than to get a Legionary to accept us as women with authority. Many of us keep our hair short for this reason.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
