  ResponseText: Legionaries are taught that women are subordinate to men. We're meant to be homemakers, mothers. For a woman to be a holy agent of Mars? Unfathomable.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
