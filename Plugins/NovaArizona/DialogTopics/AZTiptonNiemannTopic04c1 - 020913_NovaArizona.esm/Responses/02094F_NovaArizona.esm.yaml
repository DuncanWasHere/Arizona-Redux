    Unused3: 0x000000
  ResponseText: For four months, I was Joe's soldier. I dropped a lot of bodies for that man. But, he had a limited vision.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x2C2069
    UseEmotionAnimation: True
    Unused3: 0x206469
  ResponseText: He began to obsess over the new territories I got for him, started wars we had no business fighting.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I realized that most of the crew agreed, so during one of his war council meetings, I snapped his neck and declared that the wars were over.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: I was wrong. The other crews thought we were weak and kept fighting, but we rallied and broke them.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: For the last three years, I have forged an empire over the whole of the Colorado.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: It's amazing how a gang of not more than a hundred people solely interested in profit can do more against the Legion than an entire army of Rangers did.
  ScriptNotes: ''
  Edits: ''
