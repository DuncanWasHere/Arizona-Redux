Responses:
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 1
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: You better be right about this. Can't believe I'm going to abandon my last report.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 2
    Unused2: 0x207269
    UseEmotionAnimation: True
    Unused3: 0x626F75
  ResponseText: I don't think I can do this anymore. Things are getting too hot.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x6C7061
  ResponseText: If men like Rex and Lanius are the future of the Legion, I can't keep risking my neck to report on them.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 4
    Unused2: 0x000000
    UseEmotionAnimation: True
    Unused3: 0x000000
  ResponseText: Maybe I'll write about you instead. The Mark of Caesar is a high honor, after all. If you make yourself worthy of a biography, I promise I'll be the first guy on it.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 5
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x417269
  ResponseText: In the meantime, come find me in the roadhouse. I doubt the Legion will let me leave anytime soon.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 6
    Unused2: 0x696365
    UseEmotionAnimation: True
    Unused3: 0x417269
  ResponseText: Be seeing you, kid. Good luck out there.
  ScriptNotes: ''
  Edits: ''
