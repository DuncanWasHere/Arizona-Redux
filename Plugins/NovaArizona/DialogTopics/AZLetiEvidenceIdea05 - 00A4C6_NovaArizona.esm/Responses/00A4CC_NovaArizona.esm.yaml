    ResponseNumber: 2
    Unused2: 0x617420
    UseEmotionAnimation: True
    Unused3: 0x6E6420
  ResponseText: But you are right. This is the end of us. The things we shared, our love, our bond, it isn't in our possessions.
  ScriptNotes: ''
  Edits: ''
- ResponseData:
    EmotionValue: 50
    ResponseNumber: 3
    Unused2: 0x617420
    UseEmotionAnimation: True
    Unused3: 0x6E6420
  ResponseText: Here, take this. When you give it to that Decanus, tell him we survived every Legion rat they sent after us.
