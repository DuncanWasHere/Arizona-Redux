  Text: >-
    From: Clark Weathers

    CC: Deb E. Welles Construction


    FWD: Danilo Reuben


    SS wants this all done in the old mine just behind the park, so that should save some time and money. Just make it structurally sound. You have a copy of the coaster specs. I’ll get you a line to the design team so you can hash out the details. Can you put me in contact with Daniel Ruben? I like to be able to speak to our foremen directly.
