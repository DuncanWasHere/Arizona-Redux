  Text: >-
    CONFIDENTIAL//SPECIAL ACCESS REQUIRED-BIRCH

    10-22-77

    From: Gen. Edward McClellan of YPG Bloomfield

    SUBJECT: (U) Waiver of inspection


    (U) This convoy is to be given free passage through the Hoover Dam military checkpoint. Inspection of the cargo will be treated as insubordination.


    (C//SAR-B) Assets are being lawfully transferred to Hopeville from Goldwater Detention Facility in accordance with Executive Order 99066.
