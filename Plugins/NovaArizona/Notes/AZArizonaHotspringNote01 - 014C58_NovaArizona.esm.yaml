  Type: Text
  Text: >-
    Mine Supervisor Ben did some surveying of the local cave system, and as we all predicted, it turns out we've been mining directly through the natural hot spring, which means we can't mine here anymore.


    Don't know why the Bureau of Land Management approved this spot to conduct mining operations at despite our warnings, but now we're shit outta luck. We need to bring in some profit or else our families will starve.


    God, with the way this country's going today, we might not even make it the next 20 years.
