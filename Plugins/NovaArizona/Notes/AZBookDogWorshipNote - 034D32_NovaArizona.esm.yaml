  Text: >-
    Written by Caius Marcurio Corinth and compiled by Leber Helvetica


    In memory of the honorable Caius Corinth. May all of Colorado bow to Caesar.


    Foreword: Caius Corinth spilled much blood for the Legion. He was among the Frumentarii who infiltrated the Flagstaff city hall in that fateful act of deliverance so many years ago, and as such, could be considered a founding father of the Legion. Close personal friend to both [DAMNATIO MEMORIAE] and the hallowed Caesar, Corinth’s aged years were spent teaching at the Universitas Caesaris and documenting the Legion’s enemies.


    This treatise is a compilation of Corinth’s studies regarding a religious phenomenon observed in the tribes of Colorado. Contained herein will be detailed profiles of the Wastewolves, the Hangdogs, the Smoke Dogs, and the Zorros de Cerros. Corinth’s speculation on the origin of the Smoke Dogs and the analysis of their practices through the lens of snake worship has been edited for clarity and brevity.
