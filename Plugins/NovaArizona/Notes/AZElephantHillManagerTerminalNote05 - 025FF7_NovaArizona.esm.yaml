Data:
  MutagenObjectType: NoteStandard
  Type: Text
  Text: >-
    To: William Radison, Melissa French, Harry Delgado, Billy Douglass and more

    Subject: Limited operations


    Body: Heads up, the next couple of weeks will be slow. Maybe the next couple of months. Sunset Sarsaparilla is reconsidering their commitment to the project. Nobody will be fired or laid off - we have contracts that are still good for a couple years. But don’t expect the contracts to be renewed. If worse comes to worst and Sunset Sarsaparilla pulls out, it won’t be the end. Remember how this place started. Just a lone saloon off the highway. No corporate backing, nothing. Just Andy and his wife, making the drinks and homestyle food we’ve come to love. We will weather this storm. That’s all. Keep up the good work.
