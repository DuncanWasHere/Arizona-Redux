  Text: >-
    Marla,


    It is my greatest regret that I won't see you again. Not in this life, or the next. I'm haunted by dreams of you, wandering tortured in a great desert void. I want to give your soul the rest it deserves. Many times I've considered returning to you, but I'm sure your body is gone. Legion wouldn't have left it. Perhaps you're strung up somewhere, watching the sun set on our way of life. Our horses are all gone. As are the brahmin and the horners. We live like vermin now. We hide underground, only surfacing to kidnap travelers. It's shameful. These walls strangle me. I miss the vastness of the plains, the blue sky and the wind. We were not meant to live like this. We are so far from Prescott. There's no further west for us to go. We will die here. Until then, I will keep you alive in my memory, and the tribe alive in my heart.


    Yours forever,

    Wakeem
