  Text: >-
    You made your career selling yourself as a friend of the military. Now you’re called to service. Think long and hard about this list of charges:


    Embezzlement

    Fraud

    Perjury

    Racketeering

    Seditious conspiracy

    Treason


    Whenever you waver, look at these charges again and consider what kind of sentence they’ll earn you.


