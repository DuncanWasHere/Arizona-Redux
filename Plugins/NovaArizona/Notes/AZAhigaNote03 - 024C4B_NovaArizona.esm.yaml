  Text: >-
    Your contact is a tired man outside Searchlight. He is under the impression that the Confederacy seeks to help the NCR against Legion. Play along. Payment will be delivered upon return to Solitare. Don't be concerned that he's awfully far from the road. Going off the beaten track broadens the mind.


    - A


