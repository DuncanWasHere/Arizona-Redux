  Text: Back at him stared the glowing eyes of the Ancient One. At beast at least twice the height of a regular man, and more than three times as sturdy. It clawed and gnashed its teeth at the centurion, forcing him into a defensive position. At the edge of his raft and running out of ideas, all felt hopeless. Realizing this beast had the potential to massacre his entire centuria, Pinna Fulgent heroically leapt onto the beast's back, plunging his machete deep into it. The Ancient beast screamed in anger, deafening all those who dared not cover their ears. It sinks its teeth into the centurion's waist in retaliation. The centurion calls for help, and his men fire upon the beast -  but to no avail. The monster dives under the sea, retreating from the fight - with the brave centurion still in its maw...
