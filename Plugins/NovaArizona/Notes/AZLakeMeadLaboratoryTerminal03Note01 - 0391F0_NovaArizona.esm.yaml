  Text: >-
    Rebecca liked the Black Lagoon joke. I guess I should be calling her Dr. Lee. We have about 20,000 protein-coding genes, so I was thinking maybe something like 20,000 Genes Under the Sea, but maybe it’s too contrived to be funny. She said she’s sketching up a concept for the look of the monster. Fingers crossed it’s humanoid.


    A concept of my own I was thinking about: Locke. A little bit John, a little bit Ness Monster. Long and serpentine could be a reflection of the Chinese dragon, which would be very powerfully demoralizing for any infiltrators. If it’s taken that route, obviously we would need to figure out the fire breath. The closest thing would be the bombardier beetle, so maybe some sort of chemical spray that won’t extinguish underwater.
