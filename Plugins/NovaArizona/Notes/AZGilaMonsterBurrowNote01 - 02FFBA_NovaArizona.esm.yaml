  Text: >-
    My research has led me to believe that the Gila Monsters have always been a force to be reckoned with, even before the Great War. Hell, I found an old encyclopedia once and even back then they were referred to as Monsters. I believe radiation or some other mutation has caused them to rapidly grow in size, but for now I will assume that their aggressive behavior has always been present within the species.


    I got into a scuffle earlier and got bit trying to escape. If I recall correctly, the pre-war texts on Gila Monsters says that their venom is not considered deadly for a healthy adult. I'm not feeling too nauseus, so I'll try to sleep it off. Will report in the morning.
