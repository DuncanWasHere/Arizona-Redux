  Text: >-
    Hey Deb. Tell Bill that I'm not going to play spy for him. I'm a meteorologist. I don't give a crap about Poseidon or the damn lawsuit. If he cares so much about the "environmental impact" he can come out here and conduct his tests by his damn self. That's my final word on it. Let him threaten all he wants. He can't actually fire me. Who else is going to come all the way out here, to the middle of nowhere, and look at data all day?


    Cam
