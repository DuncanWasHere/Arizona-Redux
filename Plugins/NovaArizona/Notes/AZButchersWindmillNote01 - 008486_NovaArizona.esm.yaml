  Text: >-
    Here's the last of this week's haul. Emilio wants to stick around for a few more days, but I'm done. I'm tired of these fucking lizards, and assuming he actually cures the meat right this time, this should be more than enough for us to make ends meet. And I know it sounds crazy, but I swear I saw one of those geckos following behind us on the way back to camp. It ain't just the darkness playing tricks on me either. Call me a coward, but I'm leaving with my cut - and my life. My gear is already packed, so I'll be gone by the morning. See you all at the trading post in a few days.


    P.S. Tell that moron to stop smoking the meat on a pile of tires. It's absolutely disgusting.
