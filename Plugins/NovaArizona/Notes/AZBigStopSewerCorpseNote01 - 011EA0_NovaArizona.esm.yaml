  Text: >-
    It is only by the grace of Mars that the profligate Rangers were unable to arm the turrets in the sewers. Those profane devices must be removed before a rite can be performed to release the souls of your brothers. Go to the machine controlling the turrets and destroy them for good.


    - Suboptio Dominicus Rex
