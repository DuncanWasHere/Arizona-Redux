    This agreement is made and entered into by and between the United States Department of Defense, and Solitare Gas Company, for the improvement of the highways of the Four States and Southwest Commonwealths.


    Improvements of the roads in and around following locations are to be included in this amended contract: Hopeville Ballistic Defense Station, Big Mountain Research and Development Center, and Trumbull Aerospace Development Complex.


    All terms and conditions of the preceding contract remain applicable, as this contract is considered an amendment and not a new agreement.
