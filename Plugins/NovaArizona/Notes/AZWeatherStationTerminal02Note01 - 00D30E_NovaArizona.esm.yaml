  Text: >-
    Hey, do you know anything about that weather station up on Fortification Hill? Tracy reached out to me because some of the data they've been sending out is really strange. Just big chunks of noise and numbers that don't make any sense. I know it isn't one of ours but do we know who operates it? I tried checking it out myself but it looked like it was set up through a shell company(?). Someone's gotta tell them that their equipment is busted.


    Cameron
