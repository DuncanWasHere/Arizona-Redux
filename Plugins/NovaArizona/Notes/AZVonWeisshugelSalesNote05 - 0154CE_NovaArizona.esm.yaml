  Text: >-
    Beanie (3 months)

    Policeman. He made a strange request. He told me to phone him whenever a dog reached three months, someone would come to collect the dog and compensate me accordingly. I told him that'd mean all new dogs go to him, I'd never be able to sell to someone else. He told me to consider it. He gave me the contact information for a General Wellesley. Took Beanie. Paid cash



    Hans (4 months)

    Couple with a young son. Wanted a dog to guard the house from looters. Paid with a check



    Mac (3 months)

    Policeman. The nervous woman in glasses came again, but she didn’t seem to recognize me. Introduced herself as Gail. Overheard them arguing while Mac was playing in the yard, caught the words “cybernetic joints” but nothing else. Paid cash
