  Text: >-
    Day ???

    Some more caravaneers tried to travel through our territory last night. Part of me wanted to warn them off, but I didn't want to be seen by anybody, so I just let the geckos do their thing. They didn't stand a chance. Took all their supplies, fed the rest of the dead to the young. After that, we ran into some scavengers near the road on the way back. They tried taking shots at the geckos. Geckos tore them apart too. Feel kinda bad for them, but they shot first. One survivor dropped their claims and ran. It's ours now. Only a little bit of food - lots of junk and Legion coins. Shiny, but worthless to me. The highlight of the loot, however - is that one of the scavengers was carrying a flamethrower. Now, I can be even MORE like my geckos...


    ..They're all I have now. But they're all I'll ever need.
