  Text: Having reached the confluence of the Virgin and Boulder Basins, Pinna Fulgent prepared to bring his men further west through the lake - when suddenly, without warning, a monsterous creature emerges from the lake. Unidentifiable at first, the beast violent charges through the water, capsizing many boats in the chaos. In a flash, Pinna Fulgent's raft is also struck by the beast, snapping clean in two, and knocking him into the water. Swiftly, he resurfaces and mounts himself upon a floating piece of his raft and turns downward to the deep to face his enemy, Gladius in hand, completely unaware of the dangers in store for him...
