  Text: >-
    Producty Safety Recall Notice:


    Product name: Sunset Sarsaparilla Company's "Blue Sass"


    Hazard: Product is known to contain high levels of mercury, which can be harmful to ingest.


    Consumers are advised to dispose of any Blue Sass product immediately. Store owners are advised to dispose of any Blue Sass as shrinkage or return any remaining inventory.


    Contact Sunset Sarsaparilla Company's legal team for a full* refund for any defective product that is disposed of. For more information, contact: sunsetsarsparillaco.legal@pipmail.com
