  Text: "Your contact is a tired man outside Searchlight. You are persona non grata in Legion territory, so your payment will be in a dead drop with a location determined by the contact. Don't be concerned that he's awfully far from the road. Going off the beaten track broadens the mind.\r\n\r\n- A\r\n\r\n[The rest of the note is a series of map, with instructions written is a very complicated language with its own cipher. You have no way of translating this document.] "
