  Text: Many claim to know the legend of Pinna Fulgent, the drowned Centurion of Lake Mead, but few know the truth behind the story of one of Caesar's most honored veterans. True to the common slave's fables, Pinna Fulgent was known not only for his great strength and skill, but also his sailing prowess. Before the First Battle of Hoover Dam, he was tasked with establishing territory around Lake Mead. Followed by his centuria, they moved through the lake via boats and rafts in great numbers. The humble centurion carved through the lake with little resistance from anything aside from local wildlife. Wildlife that would swiftly perish under the might of Pinna Fulgent and his centuria... until they faced the Ancient One.
