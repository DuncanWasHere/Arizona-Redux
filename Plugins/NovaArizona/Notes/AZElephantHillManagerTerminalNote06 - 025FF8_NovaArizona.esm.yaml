  Text: >-
    From: Clark Weathers

    Subject: Product recall URGENT


    Body: I won’t beat around the bush here - do you remember that “limited test run” drink you were sent? Management is pulling the product. Urgently, actually. Stop all sales and prepare everything to be picked up; someone will collect it tomorrow and everything will be destroyed on-site here at the HQ. You may hear from an investigator. There may be accusations of mercury poisoning. You’re a smart guy, and reasonable enough to know that this is textbook defamation. It’s best for everyone involved that you exercise good judgment and ignore these baseless rumors.
