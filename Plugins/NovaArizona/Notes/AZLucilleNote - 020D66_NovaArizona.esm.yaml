  Text: >-
    I've hated you for awhile. 


    You stopped replying to our letters. Every time the supply caravan would return home, Mom was always the first to greet them; hoping for a letter from you. I had to write her a fake one from you, just to make her feel fulfilled before she passed. She knew it wasn't from you. She could always tell apart our handwriting. The way you write your F's. She smiled all the same. I think she just liked seeing your name on the parchment. 


    The Roost has grown to be a thriving community. I've grown to love the slopes we used to slip down when we were younger. I could ascend that rock with my eyes closed. I've grown to love it as a home. 


    And yet, I want to leave. I need to leave. 


    I finally understand you. After all this time. I couldn't when you left. But now, finally, I get it. 


    It's scary to feel at home. To let your guard down. 


    The Roost has outgrown me. Mrs Paya's whole family is sleeping on a single mattress. They could use the space.

     I'm heading North. 

    I'm not sure where yet. Parker's taking me as far as Zion. After that I'm on my own. 


    I don't hate you anymore. I can't. You did what you needed to. You lived your life the way you wanted. Parker's told me you've helped many people with our medicine. I know you're a good person. I know you would never leave if you didn't truly believe it was for the best. 


    I just wish I got to talk to my ni:ya some more.


    Goodbye
