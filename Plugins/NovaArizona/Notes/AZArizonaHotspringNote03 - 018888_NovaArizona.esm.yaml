  Text: >-
    It's taken awhile to find a new home for us, considering what the legion did to us before at (insert here later). Apparently this place was an old mining cave, seems most of that part of the springs caved in after the war, because we couldn't find a way in there. 


    Considering where we're at, i've pitched the idea of a business to the others. Opening this hot spring as a resort could get us the money we need to travel further into Nevada, to get away from the legion. I just hope this goes over well for us. 


    - Melony Harkin
