  Text: >-
    Arthur lost his shit over the computer again. It's amazing how he can go from playing poker and cracking jokes to full red-face. I mean, I do my job, so what does it matter if I spend my relative free time playing RobCo games?


    Have plenty of time, too. We had five customers last week and 14 before that. Been like that ever since the Army locked the dam down. Between that, the plague in Denver and the seemingly never-ending maintenance on Highway 93, it seems like no one wants to travel here anymore.


    Anyways, I'm expected to be fired soon. I've seen my paychecks get smaller and smaller, and the prices get bigger and bigger. The only thing I'll miss are the poker games with Arthur to pass the night shift.
