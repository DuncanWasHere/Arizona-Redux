  Text: >-
    Sorry, Cameron. Bill's not budging. He's in a tizzy about his lawsuit. He keeps telling me we ought to have a water monitoring station out there, that it's a great spot for one. He told me to ask you for details about what, exactly, you do. He made it sound like a threat. I don't know how to tell him that we're not the EPA.


    Debra
