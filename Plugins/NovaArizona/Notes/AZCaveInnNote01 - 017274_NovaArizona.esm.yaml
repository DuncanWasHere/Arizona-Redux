  Text: >-
    So.... I haven't ever written more than an invoice on this thing, but there aren't many ways to pass the time down here once you've grown bored of counting stalagtites.


    World went to hell on the 23rd (that was two days ago). I guess I shouldn't be too surprised, but honestly nobody really thought things were gonna get this bad.


    It'll probably all blow over before the end of the year. Still, I don't know how we're gonna walk back from this and ever be the same again. All those people dead... entire cities wiped off the map... can't even imagine the cost to rebuild it all.


    I was sitting in this exact spot when Ida turned the radio on. Guess it had already started some time before we tuned in. Wasn't expecting any danger all the way out here but the broadcasts were going on and on about avoiding the fallout so we stayed put. Family's too far to reach anyways. Phone lines got fried or something.


    Some tourists came in yesterday and said they saw a really bright flash coming from the west. When they pulled over and got out to look, there was a mushroom cloud over the horizon. I can't imagine they would have been able to see all the way to Vegas from here but maybe that's what the missile was aiming for? Scary to think that we came that close to being hit accidentally.


    Figure this place makes for a pretty decent shelter. But if Ida coulda just swallowed her damn pride and sold out to Vault Tec like everyone told her to... I think we'd all be resting a hell of a lot easier right now. I don't know... We'll see what happens I guess.
