  MutagenObjectType: NoteStandard
  Type: Text
  Text: They don't mingle with us. Not us simple folk. They have total communism. The big wigs in Washington pull the strings from their little bunkers. Only one nation on Earth with the motive and the means to fracture Europe like it did. Blue Flu is just advanced population control. They want us gone so they can use the rest of the oil for themselves. It's their lifeblood. I'm smarter than them. I can survive out here for years. No plague will touch me. Someone tried to refuel yesterday but I shot my gun and scared ‘em off.
