  Type: Text
  Text: This is miserable. How are we to create opposable thumbs from claws and fins? It took 500 million years the first time! And, as much as I am loath to admit it, the Kill-Man is dull. It is not on par with a human infant. It is, at best, about as intelligent as a shark. I have been briefed on a project called Birch. I am told it can supply us with consistent human tissue samples. I believe that may be our only option if we’re to fulfill the specifications required of us.
