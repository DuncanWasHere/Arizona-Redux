  Text: >-
    What happens when they find out that you heard about this “safehouse project”? How do you plan to weather that storm? Hiram, I need you to understand that this is serious. There’s a paper trail on this. It says right in Heath Cliff’s termination papers that we changed the guidelines of the overpass project.


    They wouldn’t find out, Lydia. Why would they find out?


    Because you’ve been showing up and shaking their hands for years! Do you think they don’t have eyes on us? We’re practically a part of the military logistics network. You can’t take that job and expect to get away with this. It’s fraud.


    There’s nothing fraudulent about it. I resent the word. The overpass was built, and it continues to be worked on. There have been zero failures, none. Yes, the guidelines were changed. So what? What’s my crime? Creating jobs? Is it a crime to create jobs?


    Hiram, please listen to me. You’re taking money from the government to build an overpass that is deliberately unsound and unsafe. We cannot keep doing maintenance on it forever. That’s a strategy that only works as long as nobody is paying attention, and now people are going to be paying attention.
