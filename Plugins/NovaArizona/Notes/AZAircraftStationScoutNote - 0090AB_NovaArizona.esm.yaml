  Text: January 3rd, 2278. Private First Class Hinkley reporting. Airfield is a no go. Whole place is mined to hell. It was a stroke of pure luck, but a wild dog wandered onto the strip and got blown to pieces. Would have been me otherwise. I crept a little closer and the landmines seem consistent with what we've observed the Legion using. Going to have to strongly advise against setting up a FOB here.
