  MutagenObjectType: NoteStandard
  Type: Text
  Text: >-
    Local: REM link established. HD1 recon team reporting.

    Remote: Verify.

    Local: TJ Everett and Lawrence Mackey. Callsign Squaw.

    Remote: Confirm. OP secure?

    Local: Built like a bunker. Two exits and both require access codes.

    Remote: Need a list of people with codes.

    Local: Already done - just us and the asset.

    Remote: Copy. Keep eyes on him.


    Local: Contact HD1 sublevel 1C. Confirm.

    Remote: Copy. Notifying.

    Local: Chinese?

    Remote: Hostile.

    Local: Copy.

    Remote: JCS advising.

    Local: Copy. Ready to mobilize.

    Remote: Hold. Dam security Oscar Mike.

    Local: Copy.

    Remote: It's been taken care of.

    Local: Just one?

    Remote: Two.

    Local: RobCo's gonna be pissed if HD1 ends up like Yangtze.

    Remote: Papa Charlie can't fly.


    Local: APCs on HD1. Did Birch get updated orders?

    Remote: Birch is need-to-know.

    Local: APCs need-to-know?

    Remote: HD1 infiltrators were Dragoon. JCS wants a FOB.

    Local: They know about us?

    Remote: No. And not about Birch.


    Local: Asset's jumpy about the HD1 checkpoint.

    Remote: OPSEC compromised?

    Local: Not yet, but might need HUMINT. Already tried the patriot angle.

    Remote: Can do. Meanwhile bring up the UAF investigation, see if it shakes him.

    Local: Apple falls pretty damn far from the tree. Disposal not an option?

    Remote: Negative.

    Local: Fucker made us reliant on him.

    Remote: And, unit. Need you splitting duty. Sewers need to be secure.
