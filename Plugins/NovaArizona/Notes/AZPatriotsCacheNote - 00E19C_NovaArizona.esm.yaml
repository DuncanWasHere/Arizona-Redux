    To any federal agents who may be reading this -- "And I looked, and beheld a pale horse: and his name that sat on him was Death, and Hell followed with him. And power was given unto them over the fourth part of the earth, to kill with sword, and with hunger, and with death, and with the beasts of the earth. Lo, there was a great earthquake; and the sun became black as sackcloth of hair, and the moon became as blood; And the stars of Heaven fell unto the earth, even as a fig tree casteth her untimely figs, when she is shaken of a mighty wind."


