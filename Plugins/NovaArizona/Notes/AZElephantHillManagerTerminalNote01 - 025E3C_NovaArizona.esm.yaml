  Text: >-
    From: Nathan Stanley, Director of PR

    Subject: Uncertain future


    Body: The headlines coming out this past week have been troubling, to say the least, and I’m sure you’re all wondering how this may affect the Sunset Sarsaparilla brand. The impact of the Chaco Riot will be felt throughout the entire southwest, but it will be the worst in our key markets. We’re in discussion as to what this could mean for Elephant Hill, but for the time being, all future projects will be paused until we have a clearer picture of the situation.
