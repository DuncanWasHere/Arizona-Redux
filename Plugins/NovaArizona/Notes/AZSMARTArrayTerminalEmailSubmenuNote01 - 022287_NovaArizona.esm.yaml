    SUBJECT: Director's Statement on the "October Signal" Discovery

    FROM: F.Gladwell@USRAO.ORG

    TO: All


    Good morning USRAO colleagues,


    As many of you are now aware, last Friday, 10/1/77, USRAO researchers at the Super Massive Arizona Radio Telescope Array detected a strong narrowband radio transmission originating in deep space. The signal lasted approximately twenty minutes.


    Subsequent analysis has identified a rocky planet within the Lowell 722 system (G3V; ~800 lyr from Earth) as the strongest candidate for the signal source, with a calculated confidence interval of 73.3%!


    I would like to extend my congratulations to Dr. Kiera Ultman and her team for this capstone achievement, which is undoubtedly among the most significant discoveries of this century of astronomy.


    While the data from the signal itself is of extraordinary value, the precision to which it was localized would not have been possible without rapid coordination with our friends at USSA and USTRI. Within minutes of being notified by our staff, they were able to track the signal's exact point of origin using the Lorenz Space Telescope. We are deeply grateful for their partnership.


    Naturally, the implications of this discovery remain uncertain. We should approach our findings with rigorous skepticism (in spite of whatever the media is speculating) and not expect such fortunate opportunities to recur in the foreseeable future. Nonetheless, this could very well go down in history as the turning point in mankind's long search for intelligent extraterrestrial life.


    Thank you all for your continued dedication to our shared mission. I look forward to what lies ahead as we continue to peer into the ever-brightening future!


    Fitz Gladwell

    Director, United States Radio Astronomy Observatory
