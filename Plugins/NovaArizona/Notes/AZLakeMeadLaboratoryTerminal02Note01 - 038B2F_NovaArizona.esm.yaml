  Text: Obviously, it’s a tragedy that the war has gotten to this point. A terrible loss of life. It’s unthinkable that we’re having to take measures to defend Hoover Dam. All that said, I’m giddy with excitement for this project. I’ve been paired with Dr. Patricia Milicent, and we get along wonderfully. Swimmingly? Ha. She’s taken to calling it Research from the Black Lagoon. I actually laughed so hard I snorted, which was very embarrassing. I rest assured that we will not be bored while we’re down here.
