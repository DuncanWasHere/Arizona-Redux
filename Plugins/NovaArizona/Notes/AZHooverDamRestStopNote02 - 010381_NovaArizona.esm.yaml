  Text: >-
    Notice - 22 October 2077


    I've tried to avoid this for as long as I can, but the numbers have been against us for too long. The Happy Hoover Rest Stop has been operating at negative profits for two consecutive quarters. I'm going to have to some layoffs, and you're my only employee. Joel, you're furloughed.


    It's been a horrific storm of disasters. Maintenance on Route 93 been behind schedule for two months. The Army's locked down the dam due to claims that Chinese infiltrators were seen on the dam. Willow Beach is closing due to low traffic, too. Big Stop is bleeding us dry and seems to be as far as anyone goes anymore.


    Joel, I'm sorry about yelling at you over the computer. I know things got boring. If you come in tomorrow, I'll give you a discount, and it's yours.
