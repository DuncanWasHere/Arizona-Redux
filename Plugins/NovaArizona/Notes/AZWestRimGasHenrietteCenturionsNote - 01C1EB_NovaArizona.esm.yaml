Name:
  TargetLanguage: English
  Value: The Lost Centurions
Data:
  MutagenObjectType: NoteStandard
  Type: Text
  Text: >-
    The following Centurions have fallen honorably in the field, yet their armor remains unrecovered. Until proper rites are observed, they are unable to join their brothers in the Eternal Battle. Mars is blind to their sacrifices.


    D. M. Leonidas, XI Diamond Centuria - Presumably killed in the fighting at Boulder City.


    L. C. Scorpius, Skull Valley Centuria - Vanished during a reconnaissance operation along the edge of the Divide. Presumed dead.


    C. Julianus, Vespertine Centuria - Mortally wounded during raid on Camp Golf. Died somewhere near the scene of engagement. Body was unable to be recovered.


    F. O. Maius, October Centuria - Entered Fire Root Cavern alone. Did not return.


    If found, please return their armor to the shrine of Maiden Henriette, Magnum Chasma West, for proper consecration.


    Mars favet adiuvat.
