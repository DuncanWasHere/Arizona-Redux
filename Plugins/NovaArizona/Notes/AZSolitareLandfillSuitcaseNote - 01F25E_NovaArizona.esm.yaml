    Look, we're running out of space here. It doesn't matter if it's inside of the perimeter of the fence or not. As long as it's on the property, it's fine to dump it. I don't care what the permit says. So the next time you want to get on your soap box about some idiot getting sick because THEY tresspassed on a filthy fucking landfill, just keep your mouth shut and dump the barrels in the caves. Vince has been in a shitty mood all week, and he's just looking for a reason to fire your ass. Don't give him one. Just do your job.


    Antonio
