    This agreement is made and entered into by and between the United States Department of Defense, and Solitare Gas Company, for the maintenance of the highways of the Four States and Southwest Commonwealths, active from the date of January 1st 2070, to the date of January 1st, 2078.


    The United States Department of Defense acknowledges the high cost and upkeep of the Kennedy Lee Udall Memorial Overpass, and agrees to allocate more funds for maintenance, to be paid to Solitare Gas Company as per the original contract. Solitare Gas Company understands that they may be subject to inspections and investigations at any point during the contract period.
