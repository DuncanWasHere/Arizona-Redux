    [The note is scrawled in a strange tribal dialect. You can still make out most of the words.]


    YOU will haf nown OUR greatest fear now. For US the ---- ARMY woud again be coming tourd this way out of the sunrise way. Surely THEY will ---- the land. YOU will haf nown WE woud leaf this plase before THEY come.


    YOU will go down the trail leading thru the TALL ARCH. Behind is an alckove. Within is a ---- hidden well. I woud leaf YOU few OUR ---- of helth herbs and tools. YOU will take every thing and go quick. Quick! YOU will haf not wasted time.


    YOU will go north way around the MALAPAISE and sunset way thru N-C-R CAMP ---- and into NAVADA. Thair WE woud ALL try to find the tribe of the N-C-R. WE do not nowe exactly whair it is. YOU must learn this too. WE nowe that the lands of N-C-R are unruly. YOU will not feel needed to come thair. Whair ever you decide to go: do not ever come back to here. YOU will find only YOUR DETH.
