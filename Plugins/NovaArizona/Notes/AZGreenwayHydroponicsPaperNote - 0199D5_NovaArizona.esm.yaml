  Text: >-
    I am presently putting in my two weeks. My patience was run out  in administering the Dolan Springs Wind Farm for the following reasons:


    1) Lack of outside stimulation. Dolan Springs is an unimaginably boring town. Its only place of interest, the local ostrich ranch, was shut down due to a prolonged case of avian flu.

    2) The Wind Goddess cult is a daily nuisance and has been for the past four years. They accost me daily. Those burnouts apparently couldn't afford their way into the Valley of Fire Festival, and now, they swarm the town.

    3) Lack of transparency. Diana Stone used to call me when I spoke to corporate. I understand that her surgery was intense and that she's been busy with the Nursery Project, but this is nonetheless a decline.


    Thank you for your employment, and for the skills you have taught me, but I presently cannot continue to work in these conditions.


    - Sally Mayhew
