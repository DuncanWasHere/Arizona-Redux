  Text: Customers seem fewer and further between. I threw out my TV. Wasn’t doing me no good. Who cares about some wars in the Middle East? That place always has wars. And there’s no chance the oil troubles hit us. We’ve got Alaska and Texas and Mexico. Still, I’ve been feeling the squeeze. It’s getting harder to buy and it’s costing more every time I do. Maybe that’s why nobody’s flying anymore.
