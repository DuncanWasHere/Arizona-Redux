  Text: >-
    1 Americus was the son of Europa

    2 and Europa was the son of Romulus

    3 and Romulus was the son of Mars.

    4 Saturn was the son of no one.

    5 Americus rejected Mars and courted Saturn to be his consort.

    6 Mars said, “My son, you stand in Empire’s wake. Look back upon your kin before you walk his path again.”

    7 Americus rejected Mars and gambled and cheated with Saturn.

    8 Mars said, “My son, you stand in Empire’s wake. See the sand-worn skulls of the bankers just behind you and know where this soon will go.”

    9 Americus rejected Mars and spread lies and heresy with Saturn.

    10 Mars said, “My son, you stand in Empire’s wake. See what such lies have brought the silver-tongued serpent men who now lie dead.”

    11 Americus rejected Mars and consummated his love for Saturn, and Saturn bore child.

    12 Mars said, “My son, you stand in Empire’s wake. You are of course your father’s son, and he tested with these things, but you stray much further still, out from underneath my wings.”

    13 And Mars lit a holy flame to cleanse the world, killing Americus,

    14 But sparing the immortal Saturn, whose child would be named

    15 Californius.
