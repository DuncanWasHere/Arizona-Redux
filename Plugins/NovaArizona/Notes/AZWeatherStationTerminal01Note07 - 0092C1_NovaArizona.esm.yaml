  Text: >-
    CC: Cameron Dobbs, Randy Vasquez


    Debra, don't tell anyone I told you this. You know how Greenway is about "corporate espionage." Anyway, word is Poseidon bought some land nearby the river and are drafting up designs for a power plant. Everyone's been talking about it. Don't ask how they got the permissions because I don't know. Bribes? The EPA isn't what it used to be. I know your department head has some beef with Poseidon, so this'll probably make him go ballistic, if he hasn't heard about it already. Try to keep him from tilting at windmills too hard, yeah?


    Janice
