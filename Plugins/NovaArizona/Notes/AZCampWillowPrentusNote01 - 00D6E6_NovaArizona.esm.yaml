  Text: >-
    To Scribonius Prentus, Officium Logisticum, Camp Willow,


    I am once again inquiring, on behalf of myself and the good Legatus, as to the status of the sweetener shipment. As of writing, it has been three weeks since the requisition was placed, and the Legatus grows beyond impatient. Of course, the Legatus gets what the Legatus wants.


    Then surely I do not have to remind you that once he has driven a stake through the Camp Malpais Scribonius, the Camp Willow Scribonius will be next in line. Though I understand you care not about mine, please think carefully about how much your life means to you. I expect the shipment by next Monday.


    With regards,

    Scribonius C. Crassus &c, Officium Logisticum, Camp Malpais
