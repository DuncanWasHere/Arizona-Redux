  Text: >-
    To Scribonius C. Crassus, Officium Logisticum, Camp Malpais,


    I am once again responding, on behalf of myself, regarding the status of the sweetener shipment.


    Look asshole, I have priority requisitioned it FOUR TIMES at your insistence and have received no updates since the second. What do you expect me to do, abandon my post to go personally scrounging through the warehouses? I'm sure Legatus Magnus would love to see that.


    If this response does not satisfy you, I can have your correspondence delivered to Dry Wells directly. I doubt they will answer though.


    Go fuck yourself,

    Scribonius Prentus, Officium Logisticum, Camp Willow
