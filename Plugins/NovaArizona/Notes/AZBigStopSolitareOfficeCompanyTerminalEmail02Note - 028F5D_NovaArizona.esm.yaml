  Text: >-
    Hi all. I'll be blunt: the war in Alaska is going to result in fundamental changes to the way we do business. There is no doubt that the United States will be pivoting away from the southwest. Were we based in Canada, this would be no issue, but that's unfortunately not the case. Worse, the construction contract that has been sustaining the company for the last 15 years is set to expire this year. I'm assessing all possible options. At this point in time, my chief concern is getting that 15 year contract renewed. That's all. Be well.


    - Hiram Spade, CEO of Solitare Gas Company
