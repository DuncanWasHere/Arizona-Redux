  Text: Rebecca and I were written up. She convinced Corporal Nguyen not to report the trespassing. The other infraction remains. I am on probation. Rebecca is getting off lighter than I, because I am more expendable than she is. Frustrating. Patronizing. Not that I wish to see her punished. Corporal Nguyen confiscated my blue laboratory key card. Said he'd be keeping it in the barracks downstairs.
