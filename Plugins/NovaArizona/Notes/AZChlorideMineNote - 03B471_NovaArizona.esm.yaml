  Text: >-
    Nick,


    Heard about some potential claims in an unmarked cave north of Chloride. Thought it might be worth checking out, evne if it's so close to town. Heard there might be some fire geckos or something in there, but nothing too crazy. Wish me luck.


    P.S. Did some shopping in Cyanide Springs while I was in town. Got you that new plasma rifle you wanted. Gonna take it for a test drive in that mine. You still owe me for it, though.


    Orson
