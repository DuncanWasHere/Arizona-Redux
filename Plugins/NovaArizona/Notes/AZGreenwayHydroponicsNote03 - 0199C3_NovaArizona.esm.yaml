  Text: >-
    RECIPIENT: Diana Stone, Nursery Project

    FROM: Sally Mayhew, Dolan Springs Wind Farm

    DATE: JUN 23, 2072


    Hey, I messaged Derek about this already, but he hasn't responded in several days. I'm wondering what the hell was up with those recruiters that he sent to the hippies passing through Dolan Springs on their way to the Valley of Fire Festival. 


    We've never sent in recruiters to those types of people before. Literally none of them looked like they were sober enough to operate a monkey wrench, let alone one of the most advanced renewable energy stations in Arizona.


    When I first asked the recruiters about it, they told me that I was blowing their cover. Why on earth are they trying to infiltrate a "Wind Goddess" cult? What possible value can we get from a group of New Age morons that believe that the wind turbines are owned by a fictional goddess instead of a real-world company?


    Is there something I'm missing here? Because all I got from the recruiters when I pushed them was that it has to do the Nursery Project. What are you guys doing over there?




    RECIPIENT: Sally Mayhew, Dolan Springs Wind Farm

    FROM: Diana Stone, Nursery Project

    DATE: JUN 24, 2072


    This was a simple recruiting drive for test subjects for the Nursery. Nothing dangerous, or anything like that. We're just building some focus groups for figuring out the appeals of renewable technology to the average consumer. I hope this satisfies your curiosity.
