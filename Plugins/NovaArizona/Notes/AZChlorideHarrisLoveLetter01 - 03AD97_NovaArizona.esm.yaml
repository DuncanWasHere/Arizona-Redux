  Text: >-
    Dulcissimus, I thank you for showing me what the Priestesses could not. I have never before felt so deep an understanding of the dichotomy of Mars. He is war and harvest both. You showed me there are some things that can only be brought about by a spear - virility, fertility. It was our Lustratio, our purification. If you are ever in Prescott again, find me. There is a beautiful spot in the forest I'd show you. 


    -Irenaea
