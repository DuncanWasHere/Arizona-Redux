  MutagenObjectType: NoteStandard
  Type: Text
  Text: God willing, if we ever take this town back, if anyone ever finds this letter, in five years, ten years, fifty, please know that I tried with all my might to return home. I tried so hard, but I had no way out. I don't want my family to wonder. I wish I could return in a body bag, at the least. I don't want to go missing. I don't want to be MIA. Fuck. I love you honey. I'm so sorry. If I'm to die in Arizona, then I will die fighting.
