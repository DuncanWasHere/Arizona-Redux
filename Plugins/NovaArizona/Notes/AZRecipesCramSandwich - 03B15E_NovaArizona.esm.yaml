  Text: >+
    This recipe allows you to make The Winnin' Kid's Cram Sandwich.


    2 Slices of Bread (Hardtack can substitute when real bread is scarce)

    1 Box of Cram

    Pepper

    A little bit of Mustard

    Spread cram on the toast, add mustard and pepper to taste, toast until cram starts to melt
