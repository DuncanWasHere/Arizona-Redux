  Text: I think Agu will probably be one of the ones that I can reverse the indoctrination. He's a really smart kid, and I don't think he likes killing people. He gets that rush in the moment, but it doesn't last long. He has the classic signs of PTSD afterwards, tremors, isolation and fatigue. Jaw Ripper telling him that he did nothing wrong doesn't look like it's working. There's only so much a lone Follower of the Apocalypse can do right now.
