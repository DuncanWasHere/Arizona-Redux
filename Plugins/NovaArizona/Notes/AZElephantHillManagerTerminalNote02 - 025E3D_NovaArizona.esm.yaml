  Text: >-
    To: Misty Perez

    Subject: Meeting with upper management


    Body: Hey Misty, can you get me in contact with Kenneth? It seems he must’ve forgotten the terms of the contract we signed. ‘Full commitment to the future of Elephant Hill in accordance with Andy Madison’s vision,’ were the words used. I stepped back from my very well-paying design career for this park. I’m all-in, but it’s sounding to me like I’m just a dupe to throw under the bus. And for what? A union protest?



    From: Misty Perez

    Subject: RE: Meeting with upper management


    Body: I understand your frustration, but I don’t think you understand the gravity of what happened. We’re looking at a sea-change in public opinion. People think of miners, they’re gonna think of those union miners hand-in-hand with Indians and firing at FBI officers, not William Clark. For this to be a Prometheus mine? Klaus, we have Prometheus board members on our board. It’s close to home and we need to create distance ASAP.
