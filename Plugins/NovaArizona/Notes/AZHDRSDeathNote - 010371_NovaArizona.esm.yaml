  Text: >-
    Publius Veranus, upon review of your request for promotion to centurion ahead of the upcoming Hoover Dam Campaign, the Legate has denied your request.


    Although you showed great promise in the Two-Sun Campaign, you have failed to do anything noteworthy since. Your service in the Mojave Campaign has been too limited to justify any promotion at this time.


    You will still serve the Legion in your old age, likely in the fields of education, light labor and personal servitude to your betters.


    True to Caesar.
