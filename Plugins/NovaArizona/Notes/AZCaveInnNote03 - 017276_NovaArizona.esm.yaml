  Text: >-
    I don't know how much more of this I can take. The incessant crying, the screaming, the fucking stench of rotting flesh seeping into every crevice of this damn pit.


    I've seen CHILDREN without skin or hair clinging to the bones of their parents who hadn't eaten for days. Saw a mother go ballistic and get shot in the head because there wasn't enough medicine to spare for her baby.


    I've been skimming by but this isn't a life worth living. Not even close. It's been months and we've barely heard any news at all. Certainly nothing good. The supply convoys are becoming more and more infrequent.


    The soldiers don't even talk anymore. Ida seems out of it too today. I think she might've caught something. Maybe even Blue Flu. Doctor won't look at her because he's busy with the radiation victims and catatonia is kind of par for the course these days. If there's an outbreak in here I think I'd sooner take my chances with the radiation.
