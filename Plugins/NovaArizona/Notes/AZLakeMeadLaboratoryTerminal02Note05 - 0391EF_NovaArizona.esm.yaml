  Text: Intelligence testing of the Kill-Men has consistently placed them on par with a 4-year-old human child, but I’m beginning to worry that the numbers are not the whole picture. The obvious elephant in the room is that human children have highly advanced linguistic capabilities - that is the most characteristic thing about human intelligence. The Kill-Men have demonstrated no ability to communicate verbally. This unsettles me, because their brains have all the markers that indicate capacity for language. These things are made from river dolphins and humans, for God’s sake. They should be speaking. I think I’m going to order psychometric testing.
