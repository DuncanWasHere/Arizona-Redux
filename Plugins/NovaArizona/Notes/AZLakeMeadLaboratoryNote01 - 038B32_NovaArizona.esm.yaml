  Text: Following a breach of security at Hoover Dam, this outpost is being activated as a national security installation. Reconnaissance and monitoring are now considered secondary objectives, with weapons development being the primary objective. A batch of Pan-Immunity Virion is being transferred to this location, along with a team of researchers who will lead the development of a weapon fit to keep Hoover Dam secure from Chinese infiltrators.
