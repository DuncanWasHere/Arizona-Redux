Name:
  TargetLanguage: English
  Value: Testament of Blood Gunner
Data:
  MutagenObjectType: NoteStandard
  Type: Text
  Text: I, Blood Gunner, have taken it upon myself to follow Autonous across the entirety of Legion territory, if need be. Autonous has displayed seditious thoughts to me and other Legionaries. He has abandoned his post not in an effort to prove to himself that he is a true Legionary, but to defect, to travel to the land of the Profligates. I, Blood Gunner, will find him and kill him. If Autonous kills me, may my soul be cursed by Mars, then I direct Legion scouts to search White Hills for traces of Autonous.
