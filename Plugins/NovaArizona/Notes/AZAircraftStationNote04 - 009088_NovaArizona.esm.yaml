  Text: Someone dropped by today. Not a tourist. He didn't want to talk much. He said it ain't safe, with the plague and all. I listen to it on the radio. All the reporters and pundits. Peoples’ cells choking to death, killing them, turning their bodies blue. Sometimes I feel like the world is falling out from under me. War, plague, recession, rioting. They're calling it the Blue Flu. President is gonna close the borders, it seems. Don’t know what good that’ll do if it’s already here. Man got his gas and left.
