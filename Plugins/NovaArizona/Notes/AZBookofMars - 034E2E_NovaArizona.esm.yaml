  Text: >-
    1 When the Holy Mars spake into existence the Earth,

    2 He spoke of the Earth as a dark nothing.

    3 When the Holy Mars spoke again,

    4 He spoke of a loving flame that brought light to the Earth.

    5 The light of the Earth was the Sun of Mars,

    6 for Mars so loved this light that he considered it his firstborn.

    7 This firstborn son loved the Earth like a father,

    8 and fathered much life.

    9 This life angered his brother Saturn,

    10 for Saturn was barren.

    11 And the brother’s anger grew,

    12 and Saturn raised his anger as his own child.

    13 Saturn’s children grew legs and walked the Earth as curses.

    14 The cursed men had skin like mirrors and black charcoal eyes,

    15 and these black eyes were so blind to Mars that they turned their heads down

    16 and their downfacing heads had noses that reached into the dirt

    17 where they drank of the Holy Mars’s hearth.

    18 The cursed men drained Mars’s hearth until the Earth had no more love to give.

    19 Loveless were the cursed men, who, starving, clawed at the soil with their noses.

    20 Mars could watch no longer as the curse took root in his creation.

    21 He created a holy fire that burned the land,

    22 and the land cracked open,

    23 and in that open fertile land, Mars spoke a third and final time

    24 and it bore him a Son.
