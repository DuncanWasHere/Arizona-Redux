  Text: >-
    Dear people of 2076, hello from the Chloride Elementary class of 1976! Our town is small with less than 200 people, but we hope there will still be Chloridians to read this for America’s tricentennial.


    In 1976 it’s an election year. President Nixon is running for reelection. Jaws is the highest grossing movie ever and James Dean is the most popular actor in America. Elvis Presley is still performing in Las Vegas. The top song on the radio is Love Hangover by Diana Ross. What kind of music do you have in 2076? It probably sounds very different to what we have now.


    To celebrate the bicentennial, the whole school had a pizza party. Do you still have pizza in the future? In 1976, our cars still have tires and drive on the ground. Some people got in a spaceship and landed on the moon, but didn’t stay there. You probably have all sorts of space bases on Mars.


    Back here in 1976, America is at war with the Reds. We have to do drills where we hide under our desks in case the Reds shoot bombs at us. We hope you live in a future where nobody has to hide under their desks.


    From the children of 1976, we wish you in the future happy and healthy lives!
