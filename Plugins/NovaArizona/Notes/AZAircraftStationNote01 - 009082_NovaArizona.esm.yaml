  Text: Been getting a lot of visitors lately. Asked 'em what they're dropping by for, why my little airstrip. Tourists, every single last one. Hoover Dam, Lake Mead, that marina up north, Temple Bar? Grand Canyon too. Just flying around, sightseeing. Private company with a fleet of helicopters, I guess. One said she wanted to see the Valley of Fire next. I asked her what that was. She said it's a state park up in Nevada. All orange rock with stripes of white strata, swirling along the canyon walls, tracing it like a ribbon. Green grass in every crevice and on every plateau. She showed me a postcard. Maybe I'll visit one day.
