    This agreement is made and entered into by and between the United States Department of Defense, and Solitare Gas Company, for the maintenance of the highways of the Four States and Southwest Commonwealths, active from the date of November 1st 2066, to the date of January 1st, 2070.


    Hiram Spade agrees to full continuity with the original contract as negotiated with Solitare Gas Company under Obadiah Spade. Solitare Gas Company acknowledges that their involvement in the military supply line will be in a diminished capacity, as the United States no longer considers Mexico to be a threat necessitating a joint warfare occupation. Furthermore, the United States Department of Defense can no longer guarantee that Solitare Gas products will be prioritized for fueling the military fleet.
