  Text: The subject’s psychometric activity indicates intelligence on par with a human child aged 3 to 6. Analysis of the subject’s “invisible attack” was inconclusive, but given the presence of Inia geoffrensis DNA, I’m confident in saying that it’s likely a form of biosonar and not anything paranatural. That said, we’ll continue to monitor the subject. Should anything unusual present itself, we will contact our liaison with the Center for Extra-Typical Research.
