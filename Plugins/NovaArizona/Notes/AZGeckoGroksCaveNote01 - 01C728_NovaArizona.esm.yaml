    Day 27

    It happened! It finally happened! All those weeks of lathering myself in gecko oil and leaving meat offerings has paid off. The golden geckos are no longer hostile to my presence. Most of them don't even hiss at me anymore, and they haven't shown any other signs of aggression in weeks. It was difficult, but I knew that with enough time, they would come to see that I mean them no harm. Surely, nobody else has ever managed to get this close to golden geckos before - and lived to speak of it. I'll use this opportunity to study their species. There's so much for me to learn...
