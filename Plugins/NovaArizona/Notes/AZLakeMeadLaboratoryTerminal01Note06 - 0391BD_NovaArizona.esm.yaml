  Text: The Mariposa installation has been placed on lockdown as a preventative measure after the attending Army detachment declared their loyalty to China. All NBC projects are hereby paused. You are asked to remain at your post until a unit arrives to relieve you. All personnel will be interrogated and tested to ensure full commitment to the United States. If you have nothing to hide, you have nothing to fear. Once cleared, your team will be transported back to your installation and your work may resume. God bless America.
