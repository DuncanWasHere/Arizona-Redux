  Text: >-
    Bailey (4 months)

    Single male, previously purchased Rover. Said Rover is doing good. Had a pistol holster on his belt, probably police. Paid cash



    Trina (7 months)

    Married couple with a pug. Discussed dog aggression. Let Trina and pug meet, no problems. Payment plan created



    Dodger (10 months)

    Single male, middle aged, no other pets, said he has a girlfriend but she doesn’t live with him. Wanted a reliable hunting dog with a friendly temperament. Paid with a check



    Jax (2 months)

    Policeman again, but came with a friend this time, a nervous woman in glasses, said her name is Richardson. Much less talkative than the other times he visited. Paid cash
