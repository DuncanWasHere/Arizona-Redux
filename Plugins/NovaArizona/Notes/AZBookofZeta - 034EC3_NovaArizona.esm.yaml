  Text: >-
    I sat before that marked man, cross-legged in the dirt, open to his holy word. He said, “There are many things you don’t understand. First, tell me who you think I am.”


    I told him, “You are he who has fallen from grace, you are he who has been cast away. You are the sinner of sinners, the devil of devils.”


    And he spoke, “I am from a long line of devils. Lift my bandage so you can see my cursed skin.”


    And I lifted his bandage to see that his skin was cursed, for it had been made into scales as black as charcoal.


    “My skin is marked by Satan. My people are those of Satan. All those who came before are cursed as I.”


    I asked of him, “Are your people marked as you are?”


    “No. My people worship the marked. My people believe that Mars was a mortal man from another world. My people believe that Mars is from a race of Satans.”


    I told him I do not understand, and he grabbed my chin, and I, the supplicant learner, drank of his succor and knowledge. He said, “You see Mars in the sky. You see His holy light. Do you see Satan?”


    I had no answer.


    “He is the second of size, bearer of the circlet. His children bear his name with the first letter inverted. See my scales, child. See the scales of the great monuments to those bones we find in the soil. My people worship the scaled men. They worship Mars as if He was born cursed. Saturn has inverted his S. Speak his name aloud. Hear his true nature.”


    And I whispered, “Zetan.”


    [Scribbled in the margins are notes speculating that the author of this text must be from some sect of New Canaanites. The notes also condemn the text as dangerous blasphemy.]
