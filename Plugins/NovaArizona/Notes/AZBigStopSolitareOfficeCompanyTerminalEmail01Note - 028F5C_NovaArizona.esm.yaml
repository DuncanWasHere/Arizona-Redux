  Text: >-
    Greetings all. I know we're all deeply affected by my father's passing. Solitare was his baby, and the future may seem uncertain without him, but I promise that nothing will fundamentally change. Obadiah Spade ran Solitare as an honest, all-American company, and I will honor that commitment and that vision going forward. Further details to come, but I'd like to end this with a few words about Obadiah.


    Dinosaurs. Very few put much thought into them, but they're the reason we're here today. That crude oil deep in the ground, that liquid gold, was the dinosaurs' gift to us. Obadiah was a dinosaur. He was a titan, a goliath, an economic force of nature much like the T Rex was a dinosauric force of nature. But he was also a man out of time. His rightful peers - Carnegie, Rockefeller, Vanderbilt. But that wouldn't have made him happy, because what really mattered to him was standing tall and telling the Robert Houses of the world: "Oil is what made this country great." That was him in a nutshell. An oil baron in the atomic age.


    RIP Obadiah Spade 1984 - 2057


    - Hiram Spade, CEO of Solitare Gas Company
