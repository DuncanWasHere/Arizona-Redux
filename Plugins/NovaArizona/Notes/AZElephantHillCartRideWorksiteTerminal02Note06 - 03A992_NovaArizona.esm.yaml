  Text: >-
    From: Clark Weathers


    Mr. Ruben, I’m saddened to say that our partnership has come to an end. Sunset Sarsaparilla Company is no longer interested in the Authentic Uranium Mine Experience cart ride. Don’t take this personally. We here in the office love you and the work you’ve done, but unfortunately the numbers just don’t shake out. Best.


    -Clark Weathers,

    Vice-President of Operations

    Sunset Sarsaparilla Company
