  Text: >-
    Guys from the National Guard pulled up today and said they wanted to use this place as an aid station. Ida was hesitant to have so many desperate people pouring in but I told her we might need the supplies too and she bit her tongue after that.


    They also confirmed that a bomb hit about 10 miles west of Dolan, by the river. Must have been what those tourists saw. Blew out a lot of glass and there's already been a wave of radiation poisoning cause apparently some folks haven't been taking the fallout warnings seriously.


    If the livestock get sick, and the crops aren't safe to eat, a lot of people are gonna go hungry. It's not like anyone around here has more than a week's worth of food stockpiled at most. We don't. I assume that's why the soldiers are acting almost like they're expecting a riot. I stand by what I said to Ida but I don't know if I'm mentally prepared to deal with a mob of starving refugees.


    I guess if there are enough rations to go around then everything should be fine. We can always fall back to the camp in Kingman.
