  Text: >-
    Working off the accelerated aging embryo base, we intend to hit the ground running with swapping genome segments. As of the official project start date - today - we’ll be working with Ophiodon elongatus, Chelydra serpentina, Inia geoffrensis, Trichechus inunguis, Lepidosiren paradoxa, Periophthalmodon schlosseri, and Amia calva. The required specifications are as follows:


    Self-sufficient and capable of autonomous reproduction

    Infrasound and ultrasound perception

    Strength on par with or exceeding the average black bear


    Dr. Rebecca Lee
