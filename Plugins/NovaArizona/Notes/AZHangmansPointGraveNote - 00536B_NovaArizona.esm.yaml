  Text: >-
    When I bled hard on the rocks at Ash Creek, I was not afraid. I laid flat on those jagged stones for fifteen minutes knowing that I would not die that day. I opened my eyes and saw my amicis.


    Did you do the same?


    Flavius always told us that a legionary's blood pools quicker than his resolve exits his wounds. 


    I am sorry that I was not as quick as you were.
