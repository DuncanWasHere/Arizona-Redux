  Text: Cara, it's me. Of course it is. Who else would send you a letter in the mail? So old fashioned of me, I know. I miss you. Truly and deeply, I miss you. I know I screwed up. I mean, Christ, I'm the king of scewups and this one was my Magna Carta. But I can't believe that it's over between us. Please call me. Any time, on any number. You know I'll pick up. I'll drop everything to answer that call. Just please give me the chance.
