  Value: Greenway Hydroponics Orientation
Data:
  MutagenObjectType: NoteStandard
  Type: Text
  Text: >+
    Hello! Welcome to the Dolan Springs Wind Farm, a proud component in the sprawling Greenway Hydroponics family.


    Greenway Hydroponics is the preeminent developer of renewable sources of energy in the entire world. Greenway was founded by Derek Greenway, a Poseidon Energy employee who realized that the future wasn't in oil but in nature. Greenway is dedicated to fulfilling his vision of sustainable energy and peace for the next generation of producers. 


    You, employee, are one of those producers. You have been specially selected to carry out the development of a grand new world. 


    Remember the following rules:

    1) Monitor all potential sources of waste.

    2) Maintain secrecy on all trade secrets. The Chinese are always looking to steal technology, even our peaceful ones.

    3) Be good to your fellow employees.

    4) You and your fellow employees are responsible for all functions of this wind farm. Should you encounter any problems that you cannot solve, consult 720-981-5601.

