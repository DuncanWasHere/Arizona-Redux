    This agreement is made and entered into by and between the United States Department of Defense, and Solitare Gas Company, for the improvement of the highways of the Four States and Southwest Commonwealths, in accordance with Federal Defense Highways Act of 2051, up to the date of January 1st, 2066. The United States Department of Defense hereby agrees to fund the necessary expansion of Solitare Gas Company's midstream logistics and transportation processes to complete the aforementioned construction.


    Solitare Gas Company acknowledges that the following locations are of particular import: Nellis Air Force Base, Homey Airport, Yuma Proving Ground, Marine Corps Air Station Yuma, and Barry Goldwater Missile Range. Should the military operation in Mexico result in any damages to Solitare Gas Company property or personnel, the United States Department of Defense agrees to fairly compensate all parties affected. In addition, the United States Department of Defense agrees to prioritize purchasing from Solitare Gas over its competitors in all situations.
