  Type: Text
  Text: Scrubbed all the data off this thing, so I guess this'll be the only entry. Better safe than sorry. Wasn't anything of value anyway, just invoices and ramblings. NCR lost. Legion's real mad. Guess a stalemate is the sort of thing that pleases no one. Whole town's itching with something violent. People getting beaten in the streets, others going missing. Legion doesn't even pretend to be peacekeepers anymore. They're bleeding us dry all the same as the raiders. I've been living out of the vault downstairs and the last of the shop's supplies. I think there are Rangers in town now too. Haven't seen them myself, but people are talking. Janet's been buying more than usual lately. Dylan too. From me, from the caravans, from anyone who has anything left to sell. If we're harboring NCR, we're all as good as dead.
