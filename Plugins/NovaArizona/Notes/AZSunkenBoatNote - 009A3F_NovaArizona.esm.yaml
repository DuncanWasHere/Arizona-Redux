Data:
  MutagenObjectType: NoteStandard
  Type: Text
  Text: "Stealing this boat was the best decision I've ever made. I don't have to stick people up like some goddamn gangster punk, I don't have to lay in the dirt for hours waiting for a caravan to rob. All I have to do is sit pretty on this fine vessel and wave my gun around. There are so many villages along this river and none of them have been able to offer any resistance at all. I don't even touch the ground anymore. I just fire a few shots, kill a few savages, and then make my demands. \"Everything you've got or I won't let go of the trigger til you're all dead.\" And they listen! They come out with their little sacks of food and toss them on board! I'm a fucking king in this wasteland! If I ever see some other punk with a boat, I'll show him that this river's only got room for me. "
