  Text: >-
    Keep this note a secret, Scott. It's time we do something about the treasure vault. It's unfair that Katherine gets access to it and we don't. And why? Just because she's good with computers? We helped scavenge that loot, why do we have to keep everything locked up in there just because she says so? It's ridiculous. So tonight, when she's asleep, you and I are gonna find her password, break into that vault, and take what's ours. 


    Here's how we'll do it: First, you find her password while she's asleep. She's your bunkmate, so it only makes sense. Once you find it, we'll meet by the main gate. From there, we'll enter through the caverns. I know you'd rather use the main door, but Marshall locks it at night, and I don't know where he keeps the key. Once we reach the vault, you'll keep watch while I use the password to open it. Then we run in and take the goods - only what actually belongs to us. If we're lucky, the geckos will be asleep, and then we'll have extra time to sneak outta here and pawn some of this loot in Chloride. Hell, maybe you can even pay a visit to that girl you like in Cyanide Springs... think about it, and reply to me via written note. Don't talk about this at all - don't want the others overhearing you.


    Jmir
