  Text: >-
    To Scribonius Prentus, Officium Logisticum, Camp Willow,


    Next Monday. If the Legatus does not see it by then, you'll be wishing you were dealing with the wrath of Magnus.


    With regards,

    Scribonius C. Crassus &c, Officium Logisticum, Camp Malpais
