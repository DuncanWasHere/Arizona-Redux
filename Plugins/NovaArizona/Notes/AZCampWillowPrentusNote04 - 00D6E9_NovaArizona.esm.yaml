    To Scribonius C. Crassus, Officium Logisticum, Camp Malpais,


    I have just placed a requisition downstream for one (1) Automatic Pistol, Caliber .45, M1911A1, and one (1) box of Cal. 45 Automatic Pistol Ball Cartridge, Model of 1911.


    When the shipment arrives, I will have it dispatched to your office A.S.A.P., purpose being, for you to fucking KILL yourself with.


    Y.M.H.O.S.,

    Scribonius Prentus, Officium Logisticum, Camp Willow
