  Text: Secret caves. I know it. Vaults and tunnels sprawling across the US like veins. They don’t even come to the surface anymore. State of the Union address? Digital technology. He wasn’t actually there. He can’t be. Someone’d kill him if he was. Evil cabals. They’re demons. That’s why they can get by underground. It ain’t just vaults, it’s the underworld itself. Vault-Tec contracts like Faust’s bargain. They’re trying to bring hell to Earth. They’ll burn the land with fire and dance around in the ashes as the new lords of the overworld, eating our children, melting them down to parts and drinking the broth. Someone has to do something.
