  Text: >-
    Project: Turbo Plasma Multi Rifle Log 5


    Model: 14

    Status: Failure

    Notes: The T-14 is slightly higher than the energy output of T-13 and T-12, but the prototype is even more unstable now, Stabilization was at a respectable 89.83%. Somehow, it dropped to 62.57%? This isn’t the progress we were hoping for, I wouldn’t even call this progress. It’s a regression. What the hell is this tech the other researchers found and insisted we use?


    Model: 15

    Status: Progress?

    Notes: T-15 was shaping up to be more promising. We increased the stabilization by 12.97% from T-14, not on the level of T-13 but we managed to triple the energy output. The bolts melted the targets. . . and made a hole in the wall behind it, at the cost of draining the entire microfusion cell with one trigger pull. It’s highly doubtful an output like this could keep up more than one shoot with the current standard cells.


    Model: 16

    Status: Failure

    Notes: T-16 so far was the most unstable model by far. Stabilization was as low as 21.52% yet we took the risk anyway. Private [REDACTED] was the main volunteer for the project to fire the prototype. It exploded in his face. Or what was his face. The craziest part, we were able to salvage some parts of the prototype. So we can resume the project still.
