  Text: >+
    The mission has been a complete waste of our time. This so-called "Santa Claus" is nothing like the legends spoke of. The degenerates living here offered no challenge or resistance whatsoever. It was like slaughtering brahmin, if the brahmin could do nothing but beg and cry for mercy. We did not kill them; they were already dead. We showed them the evil of their degeneracy and punished them accordingly. Though there may not have been a flying chariot like the legends fortold, Santa Claus has is no more. Only Mars remains.


    Glory to him. True to Caesar.
