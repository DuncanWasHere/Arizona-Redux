  Text: >+
    As the water settled, the survivors realized that Pinna Fulgent was gone. Some considered diving in after the beast, but nothing came of it. Just like that, that was the last anyone had ever seen of the brave Centurion. From that day forward, Pinna Fulgent became known as the centurion who died honorably so that his centuria may continue to serve Mars, and Caesar declared most of Lake Mead as off-limits for legionaries. Some still question the validity of the facts of that fateful day, taking it for a mere slave's tale; others embellish the truth of the events for dramatic effect. But let it be known that this centurion was a real servant of Mars who died a genuine warrior's death.


    However... to this very day, little is known as to what happened to the ancient beast that claimed Pinna Fulgent's life. Some say it still swims the waters of the Virgin Basin... even now.

