  Text: >-
    You're aware that I've been back and forth from Hopeville and Bloomfield this past week. I know the official excuse is that I was going to discuss the diesel we've been supplying for the military's non-nuclear fleet. Actually, the topic is rocket fuel, both for the ICBMs and the space programs. This isn't classified information, so don't be alarmed. Just wanted you to know.


    But that's besides the point. I heard something alarming while on one of these trips. There was mention of a "Project Safehouse." A vault for the military elite. The language these men were using, Lydia... it scared me. Truly. I hesitate to use the word but I can think of no other way to describe it but "nihilism." Or, forgive me my Baptist upbringing: "millenarian." This made me start thinking about dad's old plans with the sewer system. His paranoid streak. It doesn't feel like paranoia anymore. There's a hatch in the foundation of the Solitare office that leads directly to a reinforced "bunker" room in the sewer system. I'm going to start preparing it for habitation, so we can keep our employees safe, should anything happen.


    I thought you should know all of this. That's all. Thank you for sticking with me, Lydia.
