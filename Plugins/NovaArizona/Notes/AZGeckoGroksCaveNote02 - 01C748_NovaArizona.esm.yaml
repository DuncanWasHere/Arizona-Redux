    Day 50+

    Over a month and a half of living with the geckos. I've lost track of exactly how many days it's been, but they have more or less accepted me as one of their own. One of the larger ones has taking a liking to me, and they've begun bringing me scraps of meat and bone like I'm one of their young. It isn't easy getting real food out here, but I'm always safe in this cave. Nobody will ever bother me in here with all these geckos. We're like a family now - it's a perfect symbiotic relationship. And all those fools back at Dolan Springs doubted me. Said I'd be better off staying home, said the geckos would kill me before the Legion would. Well, I'm here living safe and with total freedom, and everyone else back at Dolan is now the Legion's bitch. So who's the crackpot now, huh?
