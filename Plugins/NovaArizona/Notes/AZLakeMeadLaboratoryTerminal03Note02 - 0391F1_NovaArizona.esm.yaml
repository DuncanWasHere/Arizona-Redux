  Text: Rebecca and I snuck away last night to observe the subject. Fascinating and morbid. I’m very impressed with the sophistication of it. The viral sample develops the tissues at an almost exponential rate. The mutations are highly unpredictable of course. Requires fine-tuning the genetic sequence. Intelligence seemed quite low. In my view, unsuitable as an autonomous weapon. Human tissue harvesting was proposed. I will leave that decision to Rebecca. I do hope she takes me to observe again.
