Data:
  MutagenObjectType: NoteStandard
  Type: Text
  Text: >-
    From: Marcus Brody

    Subject: Shelved projects


    Body: Mr. von Reiter. Going into 2075, we’re going to be shelving the following Elephant Hill projects: Sarsaparilla Hot Spring, Kemple’s Stamp Mill, and the expansion of the petting zoo. The Authentic Uranium Mine Experience will be canceled in its entirety, including the animatronics. I understand they’ve already begun the work of setting up the rail cart system - someone will dispose of all of that at a later date. The gunfight shows will stay for now. Analytics show they’re very popular. Kenneth may change his mind on this, so be aware. Best.
