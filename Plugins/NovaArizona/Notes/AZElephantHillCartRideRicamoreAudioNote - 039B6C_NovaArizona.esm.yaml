  Text: "Billy Douglass: Klaus isn’t going to be mad that we’re down here?\r\nHarry Delgado: Not a chance. Plus, Klaus loves Willie. Ain’t that right, Will?\r\nWilliam Radison: {sarcastic}Yeah, he loves me. That’s why he took my gun and made me pour drinks all day.\r\nMelissa French: Billy, you said you’re recording?\r\nBilly Douglass: Just in case.\r\nHarry Delgado: {theatrically}Just in case the ghost of a dead miner speaks to us from beyond the grave…\r\nWilliam Radison: Or the ghost of Danilo.\r\nMelissa French: I miss him.\r\nHarry Delgado: Miss him? He's right here. Ain't that right Danilo?\r\nMelissa French: Shut up.\r\nHarry Delgado: Danilo, we are speaking to you from the other side. Do you hear me?\r\nBilly Douglass: I still think Sunset Sass did it. They have guns that can do that, you know - cause heart attacks.\r\nWilliam Radison: He lost his job in the middle of a recession. Anybody would have a heart attack.\r\nHarry Delgado: Imagine how much it would suck to work all day, die, and then your soul gets stuck at your job.\r\nMelissa French: That would just mean that your work was important to you in life. {beat}I'd haunt Willie.\r\nWilliam Radison: {sarcastic}Oh, it's an honor.\r\nHarry Delgado: Nah, screw that. I’d find a way to die a second time.\r\nBilly Douglass: {freaked out}Wait, did you hear that?\r\nMelissa French: Hear what?\r\nWilliam Radison: It’s probably just some old wood creaking somewhere.\r\nBilly Douglass: No, listen closer. What the hell is that?\r\nHarry Delgado: I hear it too.\r\n\r\n<Screaming, chair falling to the floor, feet scrambling to leave. Beat.>\r\n\r\nProtectron: False alarm. Standing down. "
