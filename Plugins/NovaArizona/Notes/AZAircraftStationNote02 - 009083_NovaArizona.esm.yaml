  Text: Been watching too much news lately. Making me sick. Some sort of coup going down in Mexico, has something to do with sanctions. I really ought to know more, given they’re our neighbor. I know the new president down there is talking about how he wants to start selling us more oil. Or maybe he wants to stop selling us oil? Course there’s the business in Europe with the Emirates. I know which way the wind blows.
