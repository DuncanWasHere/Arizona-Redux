Data:
  MutagenObjectType: NoteStandard
  Type: Text
  Text: "Hi all. I won't mince words. I take full responsibility for the kerfuffle with Heath Cliff yesterday. I behaved in an unprofessional manner, brought upon by stress about the company. War is hard on us all. But I must also make myself clear: the new construction guidelines for the Kennedy overpass project are non-negotiable. This goes for everyone in every division, in every office. Some of you have engineering degrees. I don't, but I think it's quite clear that I have enough gumption and grit to understand the crux of the thing, given that I've taken us this far. Still, I am humble enough to rely on others, and I have done so. I have consulted with the best engineers in Arizona and ensured that these guidelines are in accordance with what is best for the company. Any backtalk, any feet-dragging, any eyerolls and groans, will be treated as a threat to company secrets and dealt with appropriately. And I shall remind you that Solitare's secrets are the US Government's secrets. Should any of you quit, it is your right to do so, but please remember that your employment contract included a non-disclosure agreement and a non-compete clause. For the rest of you, I'm glad to have you on board. Let's do things the Red White and Blue way."
