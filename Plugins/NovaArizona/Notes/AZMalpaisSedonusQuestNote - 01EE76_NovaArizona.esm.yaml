  Text: >-
    10-14-2281

    Preliminary meetings with potential suppliers went poorly. No one appears willing or able to consistently supply the legate with what he needs. We're looking into possibly setting up a deal with the Sonoran cartels, but doing that without the Frumentarii getting wind of it will be exceedingly difficult. For now, the plan will have to be sending negotiating agents to meet with caravans. 


    10-18-2281

    The meeting with Ahiga went well. It's good to know that some Frumentarii aren't backstabbing schemers. He agreed to look into setting up a Sonoran connection for us but that it would take a significant amount of time. He also noted Jem to be a fairly weak link in terms of security. We might have to deal with her sometime in the future.
