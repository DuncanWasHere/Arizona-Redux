  Text: >-
    Research Log #819


    Cuz came by today. Said West-Tek is closing his division so he's laid off. Damn rotten luck. But lucky for me he snuck out a couple research eggs in his jacket as a 'fuck you' to corporate and now they're mine. Mighty thoughtful of him to remember his old hillbilly cousin. I was worried they all forgot about me, don't talk about me at the family reunions. Or just, "Oh he's out in the desert with his weird fuckin' crabs." Nothing weird about 'em, ma! Crabs is beautiful creatures. Gonna get to incubating these babies and see what comes out (government super-crabs??).
