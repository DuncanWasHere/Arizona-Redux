    This agreement is made and entered into by and between the United States Department of Defense, and Solitare Gas Company, for the improvement of the highways of the Four States and Southwest Commonwealths.


    This contract is amended a second time to include the development of the Kennedy Lee Udall Memorial Overpass (hereby referred to by the abbreviation KLUM). KLUM Overpass will connect Dolan Springs to Hoover Dam along the Colorado River. Present U.S. Route 93 from Dolan Springs to Hoover Dam will be redesignated State Route 69, and KLUM Overpass will be designated as the new Route 93. Solitare Gas Company affirms that KLUM Overpass will be completed within the year, and acknowledges that they may be held liable for any damages caused to the United States Armed Forces as a result of delays in construction.
