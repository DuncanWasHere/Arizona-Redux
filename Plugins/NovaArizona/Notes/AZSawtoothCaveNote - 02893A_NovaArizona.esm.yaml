  Text: Damn mongrels showed up at Temple Bar late in the night again. Didn't wanna lose anyone else, so we're holed up in Sawtooth Cave until they leave. Stashed some supplies and denarii in here a while back in case of something like this. I don't know how long we have, but we should be safe in here for at least a week. Sure am sick and tired of all these damn caves, though. Really thought Temple Bar would be safer with the Legion close by, but turns out they don't give a shit about us.
