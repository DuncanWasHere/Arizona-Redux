  Text: This holotape contains documents regarding charges of gross negligence brought against the Sunset Sarsaparilla Company for its Blue Sass line of product. The plaintiff alleges that they were sickened after consuming Blue Sass at Sunset Sarsaparilla's Elephant Hill attraction. Medical testing revealed heightened levels of mercury.
