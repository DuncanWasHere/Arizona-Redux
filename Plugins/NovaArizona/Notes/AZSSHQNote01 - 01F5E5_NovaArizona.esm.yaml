  Text: >-
    ATTORNEY PRIVILEGED LETTER FOR GRANT LEVY ESQ.


    What's the status on the inquiry? Did your guy find anything? I've been thinking on it some more and M.A.D really seems like the way to go. They want to allege that we're selling contaminated product? We can do it right back. Force them to settle. Drag everyone's name through the mud. Scorched earth. Or they can forget the mercury bullshit and drop the case. Everybody wins.
