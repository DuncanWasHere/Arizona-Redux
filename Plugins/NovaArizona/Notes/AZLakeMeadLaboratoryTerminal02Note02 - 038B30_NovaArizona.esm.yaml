  Text: Kill-Man! The team is heavily favoring the humanoid approach. Privately, I’ve coined the name Kill-Man, but I’ve been too shy to share it with the others. So, I’m recording it here. Kill-Man. I believe it’s quite funny. Dr. Milicent shared with me her concepts for a more serpentine monster, which was very enticing. Her explanation was enthralling as well. Her mind is very unique, though I’d never tell her this because I am technically her superior. Unfortunately, I believe that approach would ultimately become a public safety issue.
