  Text: The creature spoke to me. I was the only one who heard it. “Heard” itself is a misnomer because it felt more mental than sensory. Words appeared in my mind. I have tried to reassure myself, because it clearly had no comprehension of the words. It was like a parrot speaking without meaning. I do not feel reassured. I worry that I may be suffering from the isolation of living down here. For the time being, I will not report this. I need evidence to protect myself, should they accuse me of hysteria.
