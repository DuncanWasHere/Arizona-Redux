  Text: >+
    Project: Turbo Plasma Multi Rifle Log 7


    Model: 22

    Status: Failure?

    Notes: This model was looking to be the one. But before we could get someone to test it out, I noticed the energy output was the same as the T-16. Not wanting a repeat of what happened with T-16 I had the test called off. Unsure why the energy output spiked so much when I turned it on…


    Model: 23

    Status: Failure 

    Notes: Probably the most interesting model by far. We were able to get the stabilization up to 91.27% this time around. The most stable model by far. And the most interesting part is that we tried to make it automatic again and it went way better than last time we tried it. The main downside was how energy inefficient this model was, it drained the battery in 3 seconds. I have a theory on how I can make the battery last longer, and if my math is correct, we can make the automatic fire system work. 


    Model: 24

    Status: Success

    Notes: After almost a year we finally got a good enough model that the boys upstairs would like to see. With the estimated predictions, we should be able to produce more of these and start phasing out the Multiplas Rifles by 2281. Still, it's not ready for mass production. There's espionage concerns, since we're unsure how easy this tech will be able to replicate since the scientists that found this tech won’t say what it is. All they say is “A patrol found it after they picked up some strange signals in the middle of nowhere.” I’ll keep it locked in a password locked safe. Better safe than sorry. Don’t want this tech landing in Chinese hands and being used against us.
