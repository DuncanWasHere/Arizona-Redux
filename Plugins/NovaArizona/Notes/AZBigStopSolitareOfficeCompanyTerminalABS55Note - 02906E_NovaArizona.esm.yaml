  Text: This contract affirms the 2055 purchase of the Arizona Big Stop by Solitare Gas Company. All buildings within the stated area, henceforth referred to as Solitare Big Stop Travel Center, are hereby property of Solitare Gas Company. Development of the sewer system and expansion of the town are to be completed at the expense of Solitare Gas Company. Solitare Gas Company reaffirms its right to hire or fire any worker employed on the premises of the Solitare Big Stop Travel Center. Furthermore, Solitare Gas Company reaffirms its right to evict any tenant living on a property within Solitare Big Stop Travel Center. All parties have agreed to these terms.
