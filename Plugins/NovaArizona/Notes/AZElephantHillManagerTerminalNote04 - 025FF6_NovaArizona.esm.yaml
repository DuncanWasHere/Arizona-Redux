  Text: >-
    To: Misty Perez

    Subject: This is bullshit


    Body: Misty, I swear to god, put me in contact with Kenneth. Hell, I’ll settle for Nathan.This park has generated consistent profit for nearly 10 years and it will CONTINUE to generate profit as long as it is invested in. This is an abortion, is what it is. This is abandonment, it’s dereliction of duty. They canceled the petting zoo expansion, Misty. The petting zoo! Me and Andy signed onto this project in good faith that you would be fair custodians of the location. And frankly, I’m not even seeing the connection. What the hell does some mining riot have to do with our park?



    From: Misty Perez

    Subject: RE: This is bullshit


    Body: Klaus, I like you, so I’m telling you as a friend that you need to shut the hell up and keep your head down. You want to bring Andy into this? He didn’t have to go out there and play environmentalist about that Navajo uranium spill. Out of nowhere, the charming cowboy was going around apologizing to everyone for his offensive movies. It was loony behavior, Klaus. It was completely out of the bounds of the contract. He made his brand utterly toxic, and this Chaco business has his stink all over it. I’m not saying he’s involved, God no, but it reeks just like him. The company can’t risk the association. Wild west nostalgia just doesn’t play anymore.
