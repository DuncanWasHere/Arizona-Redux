  MutagenObjectType: NoteStandard
  Type: Text
  Text: >-
    To: Kenneth Aguilar, Clark Weathers, Marcus Brody, Nathan Stanley

    Subject: Is anyone still alive?


    Body: This is Klaus von Reiter at Elephant Hill, in Mohave County. I don’t know the situation in Vegas but me and the staff are still here at the park. We’ve been hunkering down since everything happened. Kenneth, you’re the CEO, how do we handle this? Are emergency services still functioning in Vegas? I don’t know how bad it is for you guys. We’re in the boonies out here, only seen a couple highway patrol. If you’ve got any ideas, we’re still here, just give the word.
