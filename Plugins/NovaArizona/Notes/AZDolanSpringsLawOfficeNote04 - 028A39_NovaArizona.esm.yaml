  Text: >-
    First reports of Pierce Ferry radio/electrical phenomenon start around mid-late 2076.

    Centralized around Super Massive Area Radio Telescope Array?

    Array origins hard to track. USSA involvement. Less than a dozen on board of directors. Board members from University of Colorado, University of Arizona, General Atomics.


    RobCo weather station 60ish miles north. RobCo absent from the aerospace industry until 2076 hostile takeover of REPCONN (Steeple business). RobCo and General Atomics both in Mohave County, both involved in 2076 controversies connected to aerospace. Coincidence or not?


    Threads to follow up on: USSA and University of Colorado research west of Boulder. Need to submit another FOIA re: Bloomfield and the Kofa Riots


    FTCA angle? Need just one documented injury, just one! Not bullshit and hearsay, something that can stand up in court - then, money rolls in
