  Text: >-
    In 1918, two events occurred which would change the course of the American southwest forever. Uranium was discovered in the Navajo Nation of Arizona, and Sunset Sarsaparilla Company was founded.


    The Navajo, long believers in the medicinal properties of sarsaparilla, welcomed the miners who had come from far and wide to mine this essential ore.


    These miners brought with them a sarsaparilla like no other - Sunset Sarsaparilla.


    Soon, Sunset Sarsaparilla and uranium became inseparable. Our liquid gold fueled the miners who would bring home the ore that fueled our nation.
