  Text: >-
    From: Clark Weathers


    Mr. Ruben. So sorry about that. The company is trying a new approach with the marketing. You were supposed to be informed, but it must’ve slipped through the cracks. Rest assured - silver was mined at your location. However, we believe the uranium angle will play better for tourists. There will be shipments of fake “uranium ore” and “toxic barrels” arriving at your location. Some may have already been there when you started construction. These are 100% fake and not to be worried about.


    In other news, the prototype Mr. Handy at the bar received a firmware update that made it particularly sensitive to the waves coming out of a Geiger counter. We’re in discussion with RobCo as to how this can be solved. In the meantime, please remove ALL Geiger counters from the premises. They will fry the electronics of the Mr. Handy, and I don’t even want to imagine how much it would cost you to cover the repairs. A terrible amount, I’m sure. I wouldn’t want you to be forced into a situation where your wages are garnished.
