Description: >-
  The name of "Temple Basin" dates back to the persistence of one pioneer family known as the Bonellis. Daniel Bonelli and his wife cast the only "No" votes in 1870 when the Mormon settlers of St. Thomas, Nevada voted to abandon the town. While all the others left, the Bonellis decided to stay and cultivated over 100 acres of land at the confluence of the Virgin and Colorado rivers, about 8 miles upstream.


  A stonemason and an explorer at heart, Daniel Bonelli built a nine-room house out of stone and lumber. He started a flatboat ferry service and prospected for salt and other minerals. He named the large geological formation across the lake in Nevada known as "the Temple," which reminded him of the Mormon temple in Salt Lake City, Utah. Later on, the peak of the nearby mountain would be named Bonelli Peak in his honor. The first cabins were built in Temple Bar around 1947, and by the 1960s, it was a popular destination for boaters, fishermen and tourists alike, complete with a resort and campground.
Name: Temple Basin
