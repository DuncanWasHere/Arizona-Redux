Description: >-
  A quality stuffed specimen towers over you, although its panache is questionable.


  What could have prompted the human imagination to do this to one of God's great creatures? Likely, the same thought is crossing your mind now: "This would look awesome in my pad."


  Unfortunately, it's far too big to carry. Papa Bear won't be leaving this cabin today.
