Description: You  tap the bookshelf. The bookshelf is heavy, but it doesn't actually look bolted the floor. There is a slight gap, too big for the bolts to cover. You feel your way along the side of the bookshelf and find a latch. You press on the latch, and the bookshelf leans open. There is a door on the other side.
