Description: Overlooking the beautiful Colorado River, the Liberty Bell Arch is a natural rock formation named for its resemblance to the famous Liberty Bell located at Independence National Historic Park in Philadelphia, Pennsylvania, formerly known as the Pennsylvania State Hall. Over hundreds of millions of years, nature formed this geologic structure by erosion through wind and water, resulting in this unique arch formation you see today.
Name: The Liberty Bell Arch
