Description: >-
  This is the most perfect rock you have ever laid eyes on. So perfect that it makes every other rock look like a pale imitation in comparison. Forget those other rocks; they don't even really meet the criteria to be called rocks anymore.


  The realization sets in that this very encounter, between you and the rock, puts to rest thousands of years of human philosophical hypothesis and debate, by confirming that, in fact, true perfection does exist on this Earth, in a physical form no less.


  On your deathbed, the memory of this rock will be the last thing to ever cross your unconscious mind. Hundreds of years from now, your descendants will sing songs in praise of this perfect rock.


  Could this be, at last, the rock you've been looking for? The one rock to roll them all?
