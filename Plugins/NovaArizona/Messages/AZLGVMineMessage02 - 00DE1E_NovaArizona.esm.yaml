Description: This is a technical manual about the disarming of landmines. The reading is dense and overly technical, but you parse out that the book has a strong emphasis on fragmentation mines. The book has been recently used, with a couple of tears in the pages. Whoever was reading this was reading very fast. A small note is tucked away in the book, reading 'Meet at the ARS, east of Big Stop'.
